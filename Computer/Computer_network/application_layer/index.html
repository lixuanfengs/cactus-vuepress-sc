puter_network/application_layer/#电子邮件" class="sidebar-link">电子邮件</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level3"><a href="/Computer/Computer_network/application_layer/#熟悉又陌生的电子邮件" class="sidebar-link">熟悉又陌生的电子邮件？</a></li><li class="sidebar-sub-header level3"><a href="/Computer/Computer_network/application_layer/#常用的邮件协议" class="sidebar-link">常用的邮件协议</a></li><li class="sidebar-sub-header level3"><a href="/Computer/Computer_network/application_layer/#基于万维网的电子邮件" class="sidebar-link">基于万维网的电子邮件</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/Computer/Computer_network/application_layer/#万维网www" class="sidebar-link">万维网WWW</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level3"><a href="/Computer/Computer_network/application_layer/#www是什么" class="sidebar-link">WWW是什么？</a></li><li class="sidebar-sub-header level3"><a href="/Computer/Computer_network/application_layer/#万维网文档" class="sidebar-link">万维网文档</a></li><li class="sidebar-sub-header level3"><a href="/Computer/Computer_network/application_layer/#http" class="sidebar-link">HTTP</a></li><li class="sidebar-sub-header level3"><a href="/Computer/Computer_network/application_layer/#http报文" class="sidebar-link">HTTP报文</a></li><li class="sidebar-sub-header level3"><a href="/Computer/Computer_network/application_layer/#知识拓展-2" class="sidebar-link">知识拓展</a></li></ul></li></ul></li></ul></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>GitHub技巧</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>Nodejs</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>博客搭建</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>手册记录</span> <span class="arrow right"></span></p> <!----></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/manual/#手册" data-v-06225672>手册</a></li><li data-v-06225672><a href="/manual/#计算机网络" data-v-06225672>计算机网络</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2023-06-25</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->应用层<!----></h1>  <div class="theme-vdoing-content content__default"><h1 id="应用层"><a href="#应用层" class="header-anchor">#</a> 应用层</h1> <h2 id="应用层概述"><a href="#应用层概述" class="header-anchor">#</a> 应用层概述</h2> <h3 id="应用层简介"><a href="#应用层简介" class="header-anchor">#</a> 应用层简介</h3> <ul><li><code>应用层</code>是<strong>计算机网络体系结构</strong>的<code>最顶层</code>，是<code>设计和建立计算机网络</code>的<strong>最终目的</strong>，也是<strong>计算机网络中发展最快的部分。</strong></li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.4nuumpggzvo0.webp" alt="image"></p> <ul><li>早期基于文本的应用(电子邮件、远程登录、文件传输、新闻组)</li> <li><strong>20世纪90年代</strong>将因特网带入干家万户的<code>万维网www</code></li> <li>当今流行的即时通信、P2P文件共享及各种音视频应用</li> <li>计算设备的小型化和“无处不在”，宽带住宅接入和无线接入的日益普及和迅速发展，为未来更多的新型应用提供了广阔的舞台。</li></ul> <h3 id="本章应用层学习内容"><a href="#本章应用层学习内容" class="header-anchor">#</a> 本章应用层学习内容</h3> <ul><li>在本章中，我们以一些经典的网络应用为例来学习<code>有关网络应用</code>的<strong>原理、协议和实现方面的知识</strong>。</li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.2d1r61k8rrtw.webp" alt="image"></p> <ul><li>万维网WWW</li> <li>域名系统DNS</li> <li>动态主机配置协议DHCP</li> <li>电子邮件</li> <li>文件传送协议FTP</li> <li>P2P文件共享</li> <li>多媒体应用</li></ul> <h2 id="客户-服务器方式和对等方式"><a href="#客户-服务器方式和对等方式" class="header-anchor">#</a> 客户/服务器方式和对等方式</h2> <ul><li>网络应用程序运行在处于网络边缘的不同的端系统上，通过彼此间的通信来共同完成某项任务。开发一种新的网络应用<code>首先要考虑的问题</code>就是<strong>网络应用程序在各种端系统上的组织方式和它们之间的关系</strong>。<strong>目前流行的主要有以下两种：</strong></li></ul> <h3 id="客户-服务器方式-c-s方式"><a href="#客户-服务器方式-c-s方式" class="header-anchor">#</a> 客户/服务器方式（C/S方式）</h3> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.5ojqu4ofg6o0.webp" alt="image"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.3bkgvn4zv4q0.webp" alt="image"></p> <h3 id="对等方式-p2p方式"><a href="#对等方式-p2p方式" class="header-anchor">#</a> 对等方式（P2P方式）</h3> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.5noc2qwqwc40.webp" alt="image"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.37n2om7k3l80.webp" alt="image"></p> <h2 id="动态主机配置协议dhcp"><a href="#动态主机配置协议dhcp" class="header-anchor">#</a> 动态主机配置协议DHCP</h2> <h3 id="走进dhcp"><a href="#走进dhcp" class="header-anchor">#</a> 走进DHCP</h3> <ul><li><p><code>动态主机配置协议DHCP</code>(Dynamic Host Configuration Protocol)提供了一种机制，称为<strong>即插即用连网</strong>。<code>这种机制</code><strong>允许一台计算机加入新网络时可自动获取IP地址等网络配置信息而不用手工参与。</strong></p> <ul><li><code>1️⃣DHCP的作用</code></li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.1ezoif9ovtz4.webp" alt="image"></p> <ul><li><code>2️⃣DHCP的工作过程</code></li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.8ggtfiprb2o.webp" alt="image"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.6dxvvbw5vi80.webp" alt="image"></p> <p>​	<img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.o68or3x0j34.webp" alt="image"></p> <p>​	<img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.1c97t2p1f4cg.webp" alt="image"></p> <p>​	<img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.o0tq8lhr5io.webp" alt="image"></p> <ul><li><code>3️⃣DHCP中继代理</code></li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.7alcjqsa67w0.webp" alt="image"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.5vv1dj3lvnc0.webp" alt="image"></p></li></ul> <h3 id="知识拓展"><a href="#知识拓展" class="header-anchor">#</a> 知识拓展</h3> <p><strong>DHCP主要使用以下报文来实现其功能：</strong></p> <ul><li>DHCP <strong>DISCOVER</strong>：DHCP<code>发现</code>报文</li> <li>DHCP <strong>REQUEST</strong>：DHCP<code>请求</code>报文</li> <li>DHCP <strong>NACK</strong>：DHCP<code>否认</code>报文</li> <li>DHCP <strong>OFFER</strong>：DHCP<code>提供</code>报文</li> <li>DHCP <strong>ACK</strong>：DHCP<code>确认</code>报文</li> <li>DHCP <strong>RELEASE</strong>：DHCP<code>释放</code>报文</li></ul> <p><strong>DHCP报文</strong>在运输层使用<code>UDP协议</code><strong>封装</strong></p> <ul><li>DHCP客户使用的UDP端口号为68</li> <li>DHCP服务器使用的UDP端口号为67</li></ul> <p><strong>DHCP客户</strong>在未<strong>获取到IP地址</strong>时使用地址<strong>0.0.0.0</strong></p> <p>在每一个网络上都设置一个DHCP服务器会使DHCP服务器的数量太多。因此现在是<strong>使每一个网络至少有一个DHCP中继代理</strong>(通常是一台路由器)，它配置了DHCP服务器的IP地址信息，作为各网络中<code>计算机与DHCP服务器的桥梁</code>。</p> <h2 id="域名系统dns"><a href="#域名系统dns" class="header-anchor">#</a> 域名系统DNS</h2> <h3 id="dns简介"><a href="#dns简介" class="header-anchor">#</a> DNS简介</h3> <ul><li><code>域名系统DNS</code>是<strong>因特网使用的命名系统</strong>，用来把便于<strong>人们记忆的具有特定含义的主机名(例如www.abc.com)</strong>，转换为便于机器处理的<strong>IP地址</strong>。</li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.1wpj3sfwhcbk.webp" alt="image"></p> <ul><li><strong>因特网</strong>采用<code>层次树状结构</code>的<strong>域名结构</strong></li></ul> <h3 id="域名以及域名服务器分类"><a href="#域名以及域名服务器分类" class="header-anchor">#</a> 域名以及域名服务器分类</h3> <p><code>1️⃣域名分类</code></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.6ewcilp4f5s0.webp" alt="image"></p> <ul><li><strong>顶级域名TLD</strong>(Top Level Domain)<strong>分为以下三类：</strong></li></ul> <ul><li>国家顶级域名nTLD</li> <li>通用顶级域名gTLD</li> <li>反向域arpa</li></ul> <p><strong>域名和IP地址的映射关系</strong>必须保存在<strong>域名服务器</strong>中，供所有其他应用查询。显然不能将所有信息都储存在一台域名服务器中。DNS使用分布在各地的域名服务器来实现域名到IP地址的转换。</p> <p><code>2️⃣域名服务器分类</code></p> <ul><li><strong>域名服务器</strong>可以划分为<strong>以下四种不同的类型：</strong> <ul><li>根域名服务器</li> <li>顶级域名服务器</li> <li>权限域名服务器</li> <li>本地域名服务器</li></ul></li></ul> <h3 id="域名查询方式"><a href="#域名查询方式" class="header-anchor">#</a> 域名查询方式</h3> <ul><li><strong>域名解析</strong>的过程使用<strong>两种</strong>域名查询方式：</li></ul> <p><code>1️⃣递归查询</code></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.26xakpkgfxwk.webp" alt="image"></p> <p><code>2️⃣迭代查询</code></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.22vgv9hrcuqo.webp" alt="image"></p> <p>为了提高DNS的查询效率，并减轻根域名服务器的负荷和减少因特网上的DNS查询报文数量，在<strong>域名服务器和主机</strong>中广泛地使用了<code>高速缓存</code>。</p> <ul><li><strong>DNS报文</strong>使用运输层的<code>UDP协议</code>进行封装，<strong>运输层端口号为53</strong>。</li></ul> <blockquote><p><a href="https://www.ruanyifeng.com/blog/2022/08/dns-query.html" target="_blank" rel="noopener noreferrer">具体查询命令和步骤<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <h2 id="文件传送协议ftp"><a href="#文件传送协议ftp" class="header-anchor">#</a> 文件传送协议FTP</h2> <h3 id="ftp是什么"><a href="#ftp是什么" class="header-anchor">#</a> FTP是什么？</h3> <p>将某台计算机中的文件通过网络传送到可能相距很远的另一台计算机中，是一项基本的网络应用，即<strong>文件传送</strong>。</p> <ul><li><code>文件传送协议FTP</code>(File Transfer Protocol)是因特网上<strong>使用得最广泛的文件传送协议</strong>。
<ul><li>FTP提供·交互式的访问·，允许客户指明文件的类型与格式(如指明是否使用ASCII码)，并·允许文件具有存取权限·(如访问文件的用户必须经过授权,并输入有效的口令)。</li> <li>FTP屏蔽了<code>各计算机系统的细节</code>，因而<strong>适合于在异构网络中任意计算机之间传送文件</strong>。</li></ul></li></ul> <p>在因特网发展的早期阶段，用FTP传送文件约占整个因特网的通信量的三分之一，而由电子邮件和域名系统所产生的通信量还要小于FTP所产生的通信量。只是到了1995年，万维网WWW的通信量才首次超过了FTP。</p> <h2 id="ftp和服务器之前的连接"><a href="#ftp和服务器之前的连接" class="header-anchor">#</a> FTP和服务器之前的连接</h2> <p><strong>FTP客户和服务器之间</strong>要建立以下两个并行的<code>TCP连接</code>：</p> <ul><li><strong>控制连接</strong>，在整个会话期间一直保持打开，<code>用于传送FTP相关控制命令</code>。</li> <li><strong>数据连接</strong>，<code>用于文件传输</code>，在每次文件传输时才建立，传输结束就关闭。默认情况下，FTP使用TCP 21端口进行控制连接，TCP 20端口进行数据连接。</li></ul> <p>但是，是否使用TCP 20端口建立数据连接与传输模式有关，主动方式使用TCP 20端口被动方式由服务器和客户端自行协商决定。</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.340486kfyhe0.webp" alt="image"></p> <h2 id="电子邮件"><a href="#电子邮件" class="header-anchor">#</a> 电子邮件</h2> <h3 id="熟悉又陌生的电子邮件"><a href="#熟悉又陌生的电子邮件" class="header-anchor">#</a> 熟悉又陌生的电子邮件？</h3> <p><strong>电子邮件系统</strong>采用<code>客户/服务器</code>方式。三个主要组成构件：用户代理，邮件服务器，以及电子邮件所需的协议。</p> <ul><li><code>用户代理</code>是<strong>用户与电子邮件系统的接口</strong>，又称为电子邮件客户端软件。</li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.uc6g85vdjio.webp" alt="image"></p> <ul><li><code>邮件服务器</code>是<strong>电子邮件系统的基础设施</strong>。因特网上所有的ISP都有邮件服务器，其<strong>功能是</strong><code>发送和接收邮件</code>，同时还要负责维护用户的邮箱。</li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.b55pt8tb5kw.webp" alt="image"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.2udfbnvbjhg0.webp" alt="image"></p> <ul><li><code>协议</code>包括<strong>邮件发送协议</strong>(例如<code>SMTP</code>)和<strong>邮件读取协议</strong>(例如<code>POP3</code>)。</li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.61hrx6irm6o0.webp" alt="image"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.58onjwivojs0.webp" alt="image"></p> <h3 id="常用的邮件协议"><a href="#常用的邮件协议" class="header-anchor">#</a> 常用的邮件协议</h3> <ul><li><code>常用的邮件发送协议</code>是<strong>简单邮件传送协议SMTP</strong> <ul><li><strong>基于TCP连接，端口号为25；</strong></li> <li>只能传送<code>ASCII码文本</code></li> <li><strong>用于用户代理向邮件服务器发送邮件以及邮件服务器之间的邮件发送</strong></li></ul></li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.1bgnud39hp7k.webp" alt="image"></p> <ul><li><strong>为解决SMTP传送非ASCII码文本的问题</strong>，<strong>提出了</strong>多用途因特网邮件扩展<code>MIME</code>。</li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.3iigvs4j8gi0.webp" alt="image"></p> <ul><li><strong>常用的邮件读取协议有以下两个：</strong> <ul><li><code>邮局协议POP3</code>：<strong>非常简单、功能有限的邮件读取协议</strong>。用户只能以下载并删除方式或下载并保留方式从邮件服务器下载邮件到用户方计算机。不允许用户在邮件服务器上管理自己的邮件。</li> <li><code>因特网邮件访问协议IMAP</code>：<strong>功能比POP3强大的邮件读取协议</strong>。用户在自己的计算机上就可以操控邮件服务器中的邮箱，就像在本地操控一样，因此IMAP是一个联机协议。</li> <li><code>POP3和IMAP4</code>都采用基于<strong>TCP连接的客户/服务器方式</strong>。POP3使用端口110，IMAP4使用端口143。</li></ul></li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.6dmrbh2bczo0.webp" alt="image"></p> <h3 id="基于万维网的电子邮件"><a href="#基于万维网的电子邮件" class="header-anchor">#</a> 基于万维网的电子邮件</h3> <ul><li>通过浏览器登录(提供用户名和口令)邮件服务器万维网网站就可以撰写、收发、阅读和管理电子邮件。这种工作模式与IMAP很类似,不同的是用户计算机无需安装专门的用户代理程序,只需要使用通用的万维网浏览器。</li> <li>这种工作模式在<strong>用户浏览器与邮件服务器网站之间</strong>使用<code>HTTP协议</code>，而<strong>邮件服务器之间</strong>使用<code>SMTP协议</code>。</li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.4qzvy8nvavc0.webp" alt="image"></p> <h2 id="万维网www"><a href="#万维网www" class="header-anchor">#</a> 万维网WWW</h2> <h3 id="www是什么"><a href="#www是什么" class="header-anchor">#</a> WWW是什么？</h3> <ul><li><code>万维网WWW</code> (Worid Wide Web)是<strong>一个大规模的、联机式的信息储藏所，是运行在因特网上的一个分布式应用。</strong></li> <li><strong>万维网</strong>利用<code>网页之间的超链接</code>将不同网站的网页链接成一张逻辑上的信息网。</li></ul> <p><strong>万维网</strong>是欧洲粒子物理实验室的<strong>Tim Berners-Lee</strong>最初于1989年3月提出的。</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.4en3zg77vws.webp" alt="image"></p> <p><strong>浏览器</strong>最重要的部分是渲染引擎，也就是<strong>浏览器内核，负责对网页内容进行解析和显示。</strong></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.32bgotmwxiu0.webp" alt="image"></p> <ul><li><code>万维网</code>使用<strong>统一资源定位符URL</strong>来指明因特网上任何种类“资源”的<strong>位置</strong>。<strong>其一般形式为:&lt;协议&gt;://&lt;主机&gt;:&lt;端口&gt;/&lt;路径&gt;</strong></li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.2suz3oxy5p20.webp" alt="image"></p> <h3 id="万维网文档"><a href="#万维网文档" class="header-anchor">#</a> 万维网文档</h3> <p>1️⃣ <code>超文本标记语言HTML</code>，使用<strong>多种“标签”来描述网页的结构和内容</strong>。(网页扩展名为.htm)</p> <p>2️⃣ <code>层叠样式表CSS</code>，<strong>从审美角度来描述网页的样式</strong>。(文件扩展名为.css)</p> <p>3️⃣<code>脚本语言JavaScript</code> (与Java没有任何关系)，<strong>控制网页的行为。</strong>(文件扩展名为.js)</p> <h3 id="http"><a href="#http" class="header-anchor">#</a> HTTP</h3> <ul><li><code>超文本传输协议HTTP</code> (HyperText Transfer Protocol)<strong>定义了浏览器</strong>(即万维网客户进程)<strong>怎样向万维网服务器请求万维网文档</strong>，<strong>以及万维网服务器怎样把万维网文档传送给</strong><code>浏览器</code>。</li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.1v0kxlpao9b4.webp" alt="image"></p> <ul><li><code>HTTP/1.0</code>采用<strong>非持续连接方式</strong>。每次浏览器要请求一个文件都要与服务器建立TCP连接(80端口)，当收到响应后就立即关闭连接。
<ul><li><strong>每请求一个文档</strong>就要有<code>两倍的RTT的开销</code>。</li> <li>为了减小时延，浏览器通常会建立多个并行的TCP连接同时请求多个对象。</li></ul></li></ul> <h3 id="http报文"><a href="#http报文" class="header-anchor">#</a> HTTP报文</h3> <p>HTTP有两类报文：<strong>请求报文和响应报文</strong>。报文中的每一个字段都是一些<code>ASCII码串</code>，并且<strong>每个字段的长度</strong>都是<code>不确定的</code>。</p> <p><code>1️⃣请求报文格式</code></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.ni0oupr3yio.webp" alt="image"></p> <ul><li>HTTP请求报文支持以下方法</li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.4mip9qhd8sg0.webp" alt="image"></p> <p><code>2️⃣响应报文格式</code></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.3jbbhbjmeoo0.webp" alt="image"></p> <h3 id="知识拓展-2"><a href="#知识拓展-2" class="header-anchor">#</a> 知识拓展</h3> <ul><li><code>Cookie</code>提供了一种机制<strong>使得万维网服务器能够“记住”用户</strong>。而无需用户主动提供用户标识信息。也就是说，Cookie是一种对无状态的HTTP进行状态化的技术。</li> <li>使用Cookie在服务器上记录用户信息</li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.2khh7v4w2qk0.webp" alt="image"></p> <ul><li>在万维网<strong>加粗样式</strong>中还可以使用<code>缓存机制</code>以提高<strong>万维网的效率</strong>。<code>万维网缓存</code>又称为<strong>Web缓存</strong>，可位于客户机，也可位于中间系统上，位于中间系统上的Web缓存又称为代理服务器。</li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.aea0gk75548.webp" alt="image"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.s2261236c5s.webp" alt="image"></p> <ul><li>原始服务器与代理服务器中的文件一致</li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.7abspmxy0280.webp" alt="image"></p> <ul><li>原始服务器与代理服务器中的文件不一致</li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.7dkdn3uqa2c0.webp" alt="image"></p></div></div>  <div class="page-edit"><div class="edit-l
