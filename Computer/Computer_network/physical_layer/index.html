i class="sidebar-sub-header level3"><a href="/Computer/Computer_network/physical_layer/#常见的基带调制编码方式" class="sidebar-link">常见的基带调制编码方式</a></li><li class="sidebar-sub-header level3"><a href="/Computer/Computer_network/physical_layer/#基本的调制方式" class="sidebar-link">基本的调制方式</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/Computer/Computer_network/physical_layer/#信道的极限容量" class="sidebar-link">信道的极限容量</a></li><li class="sidebar-sub-header level2"><a href="/Computer/Computer_network/physical_layer/#信道的复用技术" class="sidebar-link">信道的复用技术</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level3"><a href="/Computer/Computer_network/physical_layer/#频分复用、时分复用和统计时分复用" class="sidebar-link">频分复用、时分复用和统计时分复用</a></li><li class="sidebar-sub-header level3"><a href="/Computer/Computer_network/physical_layer/#波分复用-wdm" class="sidebar-link">波分复用(WDM)</a></li><li class="sidebar-sub-header level3"><a href="/Computer/Computer_network/physical_layer/#码分复用-cdma" class="sidebar-link">码分复用(CDMA)</a></li></ul></li></ul></li><li><a href="/Computer/Computer_network/data_link_layer/" class="sidebar-link">数据链路层</a></li><li><a href="/Computer/Computer_network/network_layer/" class="sidebar-link">网络层</a></li><li><a href="/Computer/Computer_network/Transport_layer/" class="sidebar-link">运输层</a></li><li><a href="/Computer/Computer_network/application_layer/" class="sidebar-link">应用层</a></li></ul></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>GitHub技巧</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>Nodejs</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>博客搭建</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>手册记录</span> <span class="arrow right"></span></p> <!----></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/manual/#手册" data-v-06225672>手册</a></li><li data-v-06225672><a href="/manual/#计算机网络" data-v-06225672>计算机网络</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2023-06-25</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->物理层<!----></h1>  <div class="theme-vdoing-content content__default"><h1 id="物理层"><a href="#物理层" class="header-anchor">#</a> 物理层</h1> <h2 id="物理层的基本概念"><a href="#物理层的基本概念" class="header-anchor">#</a> 物理层的基本概念</h2> <p>物理层协议的主要任务</p> <ol><li>机械特性</li></ol> <p>指明接口所用接线器的 <strong>形状</strong> 和 <strong>尺寸</strong> 、 <strong>引脚数目</strong> 和 <strong>排列</strong> 、 <strong>固定和锁定</strong> 装置。</p> <ol start="2"><li>电气特性</li></ol> <p>指明在接口电缆的各条线上出现的 <strong>电压的范围</strong> 。</p> <ol start="3"><li>功能特性</li></ol> <p>指明某条显示行出现某一电平的 <strong>电压表示何种意义</strong>。</p> <ol start="4"><li>过程特性</li></ol> <p>指明对于不同功能的各种可能 <strong>事件的出现顺序</strong>。</p> <p>物理层的主要作用</p> <ol><li>物理层考虑的是怎样才能连接各种尖酸的传输媒体上传输数据比特流</li> <li>物理层为数据链路层屏蔽了各种传输媒体的差异，是数据链路层只需要考虑如何完成本层的协议，不必考虑网络具体传输的媒体是什么。</li></ol> <h2 id="物理层下面的传输媒体"><a href="#物理层下面的传输媒体" class="header-anchor">#</a> 物理层下面的传输媒体</h2> <p>传输媒体</p> <h3 id="导引型传输媒体"><a href="#导引型传输媒体" class="header-anchor">#</a> 导引型传输媒体</h3> <ol><li><p>双绞线</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.694l6v3vj5s0.webp" alt="image"></p></li> <li><p>同轴电缆</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.1291a2a495og.webp" alt="image"></p></li> <li><p>光纤</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.5vqervoc2qg0.webp" alt="image"></p> <ul><li>光在光纤中传输的基本原理</li></ul> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.3hls1grtz9g0.webp" alt="image"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.12rqru8cqtls.webp" alt="image"></p></li> <li><p>电力线</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.1p7fzbzx3ezk.webp" alt="image"></p></li></ol> <h3 id="非引导型传输媒体"><a href="#非引导型传输媒体" class="header-anchor">#</a> 非引导型传输媒体</h3> <ol><li>无线电波</li> <li>微波</li></ol> <p><img src="https://cdn.statically.io/gh/xustudyxu/image-hosting1@master/20221203/image.fqktiaiu508.webp" alt="image"></p> <ol start="3"><li>红外线</li> <li>可见光</li></ol> <h2 id="传输方式"><a href="#传输方式" class="header-anchor">#</a> 传输方式</h2> <ol><li>串行与并行</li> <li>同步与异步
<ul><li>同步传输时，收发双方同步的方法
<ul><li>外同步：在收发双方之间添加一条单独的时钟信号线</li> <li>内同步：发送端将始终同步信号变慢到发送数据中一起传输</li></ul></li> <li>异步发送时，每个字节单独发送，且起始段与结束段有单独的标记。</li></ul></li> <li>单向通信/双向交替通信/双方同时通信(单工/半双工/全双工)</li></ol> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.36ld283rxom0.webp" alt="image"></p> <h2 id="编码与调制"><a href="#编码与调制" class="header-anchor">#</a> 编码与调制</h2> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.68hcn22uf880.webp" alt="image"></p> <h3 id="常见的基带调制编码方式"><a href="#常见的基带调制编码方式" class="header-anchor">#</a> 常见的基带调制编码方式</h3> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.z6k4dfxm0io.webp" alt="image"></p> <ul><li>不归零编码中存在时钟不一致的问题</li> <li>归零编码中存在浪费数据带宽的问题</li> <li>曼切斯特编码有自动同步的能力</li> <li>差分曼切斯特编码相交上面的编码变化少，更适合网络传输</li></ul> <p>练习题：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.z2bp6646hps.webp" alt="image"></p> <h3 id="基本的调制方式"><a href="#基本的调制方式" class="header-anchor">#</a> 基本的调制方式</h3> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.1gk02ylk9c0w.webp" alt="image"></p> <p>不过有一个缺点，使用基本调制方式，一个码元只能包含一个比特信息。通常来说可以有混合调制的方式，也就是多个维度一起调制的方式。</p> <p>下面就是一个典型的例子</p> <p>正交振幅调制 QAM</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.4tc9rfwo3l40.webp" alt="image"></p> <h2 id="信道的极限容量"><a href="#信道的极限容量" class="header-anchor">#</a> 信道的极限容量</h2> <blockquote><p>任何信道都存在各种失真，各种干扰</p></blockquote> <p>信号在信道上传输速率的因素主要有以下两个方面决定</p> <ol><li><p>奈氏准则</p> <p>在假定的理想条件下，<strong>为了避免码间串扰</strong>，<strong>码元传输速率是有上限的</strong>。</p> <p>在理想带宽为 W(hz) 的信道中。</p> <ol><li>理想低通信道的最高码元传输速率 = 2W Baud</li> <li>理想带通信道的最高码元传输速率 = W Baud</li></ol> <blockquote><p>其中，码元传输速度也叫调制速度</p> <p><em>W</em> 为信道带宽</p> <p><em>Baud</em> 为波特，即 码元/秒</p></blockquote> <p>波特率 <em>B</em> 与传输速率 <em>C</em> 的关系如下</p></li></ol> <center><em>C = Blog<sub>2</sub>N</em></center>
2. 香农定理 公式: *C = Wlog<sub>2</sub>(1 + S/N)*
<blockquote><p>C：信道的极限信息传输速率（单位：b/s）</p> <p>W：信道带宽（单位：Hz）</p> <p>S：信道内所传信号的平均功率</p> <p>N：信道内的高斯噪声功率</p> <p>S/N：信噪比，使用分贝（dB）作为度量单位</p> <ul><li>信噪比（dB）= <em>10 × log<sub>10</sub>(S/N)（dB）</em></li></ul></blockquote> <p><img src="https://cdn.statically.io/gh/xustudyxu/image-hosting1@master/20221203/image.6u8tung63co0.webp" alt="image"></p> <h2 id="信道的复用技术"><a href="#信道的复用技术" class="header-anchor">#</a> 信道的复用技术</h2> <h3 id="频分复用、时分复用和统计时分复用"><a href="#频分复用、时分复用和统计时分复用" class="header-anchor">#</a> 频分复用、时分复用和统计时分复用</h3> <ol><li>频分复用</li></ol> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.4hed19sa9cg.webp" alt="image"></p> <p>每个用户划分出一个频段来就是频分复用。
存在大量的带宽闲置的问题</p> <ol start="2"><li>时分复用(TDM)</li></ol> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.58cg0bzk2uw0.webp" alt="image"></p> <ul><li>所有用户被划分在了不同的时间帧中，每个用户周期出现。</li> <li>存在大量的限制</li></ul> <ol start="3"><li>统计时分复用</li></ol> <p>动态分配时间间隙，提高利用率</p> <h3 id="波分复用-wdm"><a href="#波分复用-wdm" class="header-anchor">#</a> 波分复用(WDM)</h3> <p>波分复用就是光频拆分出来，通过一个光纤来传输多个信号。</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.4jwgzkrt4nq0.webp" alt="image"></p> <h3 id="码分复用-cdma"><a href="#码分复用-cdma" class="header-anchor">#</a> 码分复用(CDMA)</h3> <p>所有的用户在同一时刻使用同一频带进行通信。</p> <p>工作原理:</p> <ol><li><p>一个用户在传输数据的时候，1 bit 的数据通常要化成 m bit 的码片进行传输。</p></li> <li><p>每个码片中的所有的数字仅有 <code>1</code> 和 <code>-1</code>。</p></li> <li><p>假设用户的码片信息为 S1,S2,…,Sn 的话，不同码片之间的内积为 0，即对于任意的 i,j 满足 i≠j 而言， S<sub>i</sub>⋅S<sub>j</sub> ÷ m=0 成立。</p></li> <li><p>传输比特 1 ，则传输码片 S，否则传输码片的反码 <img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.4qwjfif0uae0.web" alt="image">。</p></li> <li><p>我们发现 S⋅S=1,S⋅<img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.4qwjfif0uae0.webp" alt="image">=−1 ，而 S<sub>i</sub>⋅S<sub>j</sub>=0，那么在多个用户信息之间叠加的话，我们可以通过这种计算内积的方法把其他用户的内积给去除。</p></li></ol> <p>以书上的例子为例。</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/computer_network/image.7dobfgww0c00.webp" alt="image"></p></div></div>  <div class="page-edit"><div class="edit-link"><a href="https://github.com/lixuanfengs/cactus-vuepress-sc/edit/master/docs/03.手册/02.计算机网络/02.物理层.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <div class="tags"><a href="/tags/?tag=%E8%AE%A1%E7%AE%97%E6%9C%BA%E7%BD%91%E7%BB%9C" title="标签">#计算机网络</a></div> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2023/09/28, 17:04:39</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/39e2a1/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">概述</div></a> <a href="/Computer/Computer_network/data_link_layer/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">数据链路层</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
