a href="/pages/2d7dcf/" class="sidebar-link">网关运营管理后台框架搭建</a></li><li><a href="/pages/6936ee/" class="sidebar-link">前后端分离应用的跨域接口调用</a></li><li><a href="/pages/13559a/" class="sidebar-link">网关Nginx负载模型配置</a></li><li><a href="/pages/918d1a/" class="sidebar-link">动态刷新网关Nginx负载均衡配置</a></li><li><a href="/pages/dea686/" class="sidebar-link">实现网关算力节点动态负载功能</a></li><li><a href="/pages/1bdcba/" class="sidebar-link">网关组件工程模块合并</a></li><li><a href="/pages/d9cb43/" class="sidebar-link">功能完善(算力关联、接口上报、调用反馈)</a></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/note/Gateway/#《API网关设计与实现》" data-v-06225672>《API网关设计与实现》</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2023-06-01</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->代理RPC泛化调用<!----></h1>  <div class="theme-vdoing-content content__default"><h2 id="学习方法"><a href="#学习方法" class="header-anchor">#</a> 学习方法</h2> <p>对于中间件框架的实现，往往都离不开代理的操作，因为需要使用代理用逻辑封装行为。例如你原本是通过硬编码调用一个接口，那么现在因为所有的行为都被提炼到中间件中控制，那么对于接口的调用就不在一个而是一堆。而对于这样一堆接口的调用，它们是有共性的，比如可以统一使用Java反射获取到方法名、入参、出参等等信息，再根据这些信息做代理逻辑包装，让每一个接口的调用都被中间件处理。</p> <p>那么我们本章要实现的就是把来自网关的HTTP请求，转换到RPC调用上，这里就涉及到了RPC所提供的泛化调用，按照对应的泛化调用的逻辑，提供对应的接口和方法以及入参信息就可以拿到最终的结果。文档：<strong><a href="https://cn.dubbo.apache.org/zh-cn/overview/mannual/java-sdk/advanced-features-and-usage/service/generic-reference/" target="_blank" rel="noopener noreferrer">泛化调用（客户端泛化） | Apache Dubbo<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></strong></p> <h2 id="绑定设计"><a href="#绑定设计" class="header-anchor">#</a> 绑定设计</h2> <p>这里需要认真考虑一下，要把 HTTP 与 RPC 建立连接，就像你把 DAO 与 SQL 执行建立连接一样，两个服务的中间需要被绑定建立连接关系。也就是把 HTTP 地址中的接口方法与 RPC 对应的服务建立起一种关联关系，这样才能满足在调用 HTTP 网关接口时，调用到对应的 RPC 服务上。</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/image-20230601181112301.png" alt="image-20230601181112301"></p> <ul><li><p>就像如图所示 HTTP 经过网关调用到 RPC 中间的执行逻辑就是把两个模块用绑定的方式建立起连接，生成一个代理对象。代理对象中包装的就是执行网关接口泛化调用的参数准备和执行以及返回结果的操作。</p></li> <li><p>这里的第一个知识点是泛化调用，它是 RPC 接口设计中提供的一种反射调用机制，你不需要硬编码调用接口，只需要提供接口的方法名称、入参信息，即可调用到对应的 RPC 接口服务。可以参考官网文档：<strong>https://cn.dubbo.apache.org/zh-cn/overview/mannual/java-sdk/advanced-features-and-usage/service/generic-reference/</strong></p></li> <li><p>这里的第二个知识点是代理包装，虽然 RPC 框架提供了泛化调用，也就是说这里可以拿到网络协议转换的 HTTP 请求信息以后，就能直接调用到 RPC 接口。但这样的操作方式不太方便使用，存在硬编码的风险，后续不好迭代升级，也不好扩展其他的接口。因为每一个 RPC 的实现，泛化调用的方法名称还是有所不同的，另外是扩展非 RPC 框架的逻辑，也不方便处理。所以这里需要单独提供一个代理包装逻辑。</p></li> <li><p>这里的第三个知识点是Cglib，因为有第二个知识点中代理操作的存在，我们就需要选择一种方式来做代理处理，而Cglib 可以满足我们自定义创建接口的方式进行代理，同时又可以在让一个代理类有多个接口。注意：多个接口的意思是，一个接口是用于标准的描述，在于使用上。另外一个接口是自主生成的，生成的是我们的 RPC 描述性接口，相当于自主生成了class字节码。</p></li></ul> <h2 id="绑定实现"><a href="#绑定实现" class="header-anchor">#</a> 绑定实现</h2> <h3 id="工程结构"><a href="#工程结构" class="header-anchor">#</a> 工程结构</h3> <div class="language-java line-numbers-mode"> 2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>&quot;}, new Object[]{&quot;world&quot;});</p></li> <li><p>IGenericReference 是一种定义出来的接口，专门给到通信层做编码调用使用的。</p></li> <li><p>GenericReferenceProxyFactory 用于创建代理对象，这里用到了 CGLIB 操作，它先构建出一个 RPC 接口信息，在把我们定义的 IGenericReference 接口和构建的接口，一起给代理类实现。也就是说一个代理类，实现了2个接口。<em>你可以在大脑袋中想一下这个事</em> 创建完成后，我们使用定义的接口调用，模拟创建出来的接口逻辑。</p></li></ul> <h3 id="实现代理类"><a href="#实现代理类" class="header-anchor">#</a> 实现代理类</h3> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/Fm78tC8EgX1kjHiWxcp4WVOTBCP9.png" alt="Fm78tC8EgX1kjHiWxcp4WVOTBCP9"></p> <p>因为网关服务是不引入 RPC 接口的包描述接口信息的，所以也就是只能使用泛化调用进行处理，那么我们在网关执行中又希望可以通过编码的方式调用接口，做一层装饰使用，所以这里要定义一个 IGenericReference 泛化调用的接口，并把这个接口和 RPC 使用 CGLIB 创建出来的接口结合起来交给代理类实现。</p> <h4 id="统一泛化调用接口"><a href="#统一泛化调用接口" class="header-anchor">#</a> <strong>统一泛化调用接口</strong></h4> <p><strong>源码详见：cn.cactusli.gateway.bind.IGenericReference</strong></p> <div class="language-Java line-numbers-mode"><pre class="language-java"><code><span class="token comment">/**
 * Package: cn.cactusli.gateway.session.bind
 * Description:
 *  统一泛化调用接口
 *
 * @Author 仙人球⁶ᴳ | 微信：Cactusesli
 * @Date 2023/6/2 11:00
 * @Github https://github.com/lixuanfengs
 */</span>
<span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">IGenericReference</span> <span class="token punctuation">{</span>

    <span class="token class-name">String</span> $<span class="token function">invoke</span><span class="token punctuation">(</span><span class="token class-name">String</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><ul><li>目前只在这里提供一个标准的 String 的入参和出参类型的泛化调用接口。</li></ul> <h4 id="泛化调用封装"><a href="#泛化调用封装" class="header-anchor">#</a> <strong>泛化调用封装</strong></h4> <p><strong>源码详见：cn.cactusli.gateway.bind.GenericReferenceProxy</strong></p> <div class="language-Java line-numbers-mode"><pre class="language-java"><code><span class="token comment">/**
 * Package: cn.cactusli.gateway.session.bind
 * Description:
 *  泛化调用静态代理：方便做一些拦截处理。给 http 对应的 RPC 调用，做一层代理控制。每调用到一个 http 对应的网关方法，就会代理的方式调用到 RPC 对应的泛化调用方法上
 * @Author 仙人球⁶ᴳ | 微信：Cactusesli
 * @Date 2023/6/2 11:01
 * @Github https://github.com/lixuanfengs
 */</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">GenericReferenceProxy</span> <span class="token keyword">implements</span> <span class="token class-name">MethodInterceptor</span> <span class="token punctuation">{</span>


    <span class="token comment">/**
     * RPC 泛化调用服务
     */</span>
    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">GenericService</span> genericService<span class="token punctuation">;</span>
    <span class="token comment">/**
     * RPC 泛化调用方法
     */</span>
    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">String</span> methodName<span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token class-name">GenericReferenceProxy</span><span class="token punctuation">(</span><span class="token class-name">GenericService</span> genericService<span class="token punctuation">,</span> <span class="token class-name">String</span> methodName<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>genericService <span class="token operator">=</span> genericService<span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>methodName <span class="token operator">=</span> methodName<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>


    <span class="token comment">/**
     * 做一层代理控制，后续不止是可以使用 Dubbo 泛化调用，也可以是其他服务的泛化调用
     * 泛化调用文档：https://dubbo.apache.org/zh/docsv2.7/user/examples/generic-reference/
     */</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token class-name">Object</span> <span class="token function">intercept</span><span class="token punctuation">(</span><span class="token class-name">Object</span> o<span class="token punctuation">,</span> <span class="token class-name">Method</span> method<span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">,</span> <span class="token class-name">MethodProxy</span> methodProxy<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">Throwable</span> <span class="token punctuation">{</span>
        <span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">[</span><span class="token punctuation">]</span> parameterTypes <span class="token operator">=</span> method<span class="token punctuation">.</span><span class="token function">getParameterTypes</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> parameters <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">String</span><span class="token punctuation">[</span>parameterTypes<span class="token punctuation">.</span>length<span class="token punctuation">]</span><span class="token punctuation">;</span>
        <span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token keyword">int</span> i <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> parameterTypes<span class="token punctuation">.</span>length<span class="token punctuation">;</span> i<span class="token operator">++</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
            parameters<span class="token punctuation">[</span>i<span class="token punctuation">]</span> <span class="token operator">=</span> parameterTypes<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token comment">// 举例：genericService.$invoke(&quot;sayHello&quot;, new String[]{&quot;java.lang.String&quot;}, new Object[]{&quot;world&quot;});</span>
        <span class="token keyword">return</span> genericService<span class="token punctuation">.</span>$<span class="token function">invoke</span><span class="token punctuation">(</span>methodName<span class="token punctuation">,</span> parameters<span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
