class="sidebar-link">1、准备机器</a></li><li class="sidebar-sub-header level4"><a href="/pages/053a6e/#_2、安装前置环境-都执行" class="sidebar-link">2、安装前置环境（都执行）</a></li><li class="sidebar-sub-header level5"><a href="/pages/053a6e/#_1、基础环境" class="sidebar-link">1、基础环境</a></li><li class="sidebar-sub-header level5"><a href="/pages/053a6e/#_2、docker环境" class="sidebar-link">2、docker环境</a></li><li class="sidebar-sub-header level4"><a href="/pages/053a6e/#_3、安装k8s核心-都执行" class="sidebar-link">3、安装k8s核心（都执行）</a></li><li class="sidebar-sub-header level4"><a href="/pages/053a6e/#_4、初始化master节点-master执行" class="sidebar-link">4、初始化master节点（master执行）</a></li><li class="sidebar-sub-header level4"><a href="/pages/053a6e/#_5、初始化worker节点-worker执行" class="sidebar-link">5、初始化worker节点（worker执行）</a></li><li class="sidebar-sub-header level4"><a href="/pages/053a6e/#_6、验证集群" class="sidebar-link">6、验证集群</a></li><li class="sidebar-sub-header level4"><a href="/pages/053a6e/#_7、设置ipvs模式" class="sidebar-link">7、设置ipvs模式</a></li><li class="sidebar-sub-header level4"><a href="/pages/053a6e/#_8、让其他客户端kubelet也能操作集群" class="sidebar-link">8、让其他客户端kubelet也能操作集群</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/pages/053a6e/#_4、急速安装方式" class="sidebar-link">4、急速安装方式</a></li></ul></li><li><a href="/pages/9b6891/" class="sidebar-link">Kubernetes基础入门</a></li><li><a href="/pages/16e344/" class="sidebar-link">Kubernetes基础其他项</a></li><li><a href="/pages/334f66/" class="sidebar-link">Kubernetes 概念</a></li><li><a href="/pages/a0d5e9/" class="sidebar-link">Kubernetes-工作负载（Workloads）</a></li><li><a href="/pages/a324cb/" class="sidebar-link">Kubernetes-服务、负载均衡和网络</a></li><li><a href="/pages/a7ed35/" class="sidebar-link">kubernetes-配置与存储</a></li><li><a href="/pages/6f3bc4/" class="sidebar-link">生产环境-二进制安装Kubernetes平台</a></li><li><a href="/pages/60ae18/" class="sidebar-link">应用商店-Helm</a></li><li><a href="/pages/1c7015/" class="sidebar-link">kubernetes平台基本预装资源</a></li><li><a href="/pages/c991e7/" class="sidebar-link">kubernetes平台存储系统搭建</a></li><li><a href="/pages/4a8fde/" class="sidebar-link">生态链路整合</a></li><li><a href="/pages/b3ead0/" class="sidebar-link">部署文档</a></li><li><a href="/pages/9926a4/" class="sidebar-link">网络规划</a></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/note/Kubernetes/#《Kubernetes教程》笔记" data-v-06225672>《Kubernetes教程》笔记</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2022-04-29</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Kubernetes安装<!----></h1>  <div class="theme-vdoing-content content__default"><h1 id="二、kubernetes安装"><a href="#二、kubernetes安装" class="header-anchor">#</a> 二、Kubernetes安装</h1> <h2 id="_1、集群原理"><a href="#_1、集群原理" class="header-anchor">#</a> 1、集群原理</h2> <p>集群：</p> <p>主从：</p> <ul><li>主从同步/复制  ;mysql 主  -- mysql 从</li> <li>主管理从   v</li></ul> <p>分片（数据集群）：</p> <ul><li>大家都一样</li> <li>每个人存一部分东西</li></ul> <h3 id="_1、master-node-架构"><a href="#_1、master-node-架构" class="header-anchor">#</a> 1、master-node 架构</h3> <p>11000台机器</p> <p>地主+奴隶</p> <p>地（机器）</p> <p>奴隶（在机器上干活）</p> <p>master：主节点（地主）。可能有很多（多人控股公司）</p> <p>node：work节点（工作节点）。 很多。真正干应用的活</p> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/1619061915065.png" alt="1619061915065"></p> <blockquote><p>master 和 worker怎么交互</p> <p>master决定worker里面都有什么</p> <p>worker只是和master （API） 通信；  每一个节点自己干自己的活</p></blockquote> <p>程序员使用UI或者CLI操作k8s集群的master，就可以知道整个集群的状况。</p> <h3 id="_2、工作原理"><a href="#_2、工作原理" class="header-anchor">#</a> 2、工作原理</h3> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/components-of-kubernetes.svg" alt="Kubernetes 组件"></p> <blockquote><p>master节点（Control Plane【控制面板】）：master节点控制整个集群</p> <p>master节点上有一些核心组件：</p> <ul><li>Controller  Manager：控制管理器</li> <li>etcd：键值数据库（redis）【记账本，记事本】</li> <li>scheduler：调度器</li> <li>api server：api网关（所有的控制都需要通过api-server）</li></ul> <p>node节点（worker工作节点）：</p> <ul><li>kubelet（监工）：每一个node节点上必须安装的组件。</li> <li>kube-proxy：代理。代理网络</li></ul> <p>部署一个应用？</p> <p>程序员：调用CLI告诉master，我们现在要部署一个tomcat应用</p> <ul><li>程序员的所有调用都先去master节点的网关api-server。这是matser的唯一入口（mvc模式中的c层）</li> <li>收到的请求先交给master的api-server。由api-server交给controller-mannager进行控制</li> <li>controller-mannager 进行 应用部署</li> <li>controller-mannager 会生成一次部署信息。 tomcat --image:tomcat6 --port 8080 ,真正不部署应用</li> <li>部署信息被记录在etcd中</li> <li>scheduler调度器从etcd数据库中，拿到要部署的应用，开始调度。看哪个节点合适，</li> <li>scheduler把算出来的调度信息再放到etcd中</li> <li>每一个node节点的监控kubelet，随时和master保持联系的（给api-server发送请求不断获取最新数据），所有节点的kubelet就会从master</li> <li>假设node2的kubelet最终收到了命令，要部署。</li> <li>kubelet就自己run一个应用在当前机器上，随时给master汇报当前应用的状态信息，分配ip</li> <li>node和master是通过master的api-server联系的</li> <li>每一个机器上的kube-proxy能知道集群的所有网络。只要node访问别人或者别人访问node，node上的kube-proxy网络代理自动计算进行流量转发</li></ul></blockquote> <p>下图和上图一样的，再理解一下</p> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/1619075196642.png" alt="1619075196642"></p> <p>无论访问哪个机器，都可以访问到真正应用（Service【服务】）</p> <h3 id="_3、原理分解"><a href="#_3、原理分解" class="header-anchor">#</a> 3、原理分解</h3> <h4 id="_1、主节点-master"><a href="#_1、主节点-master" class="header-anchor">#</a> 1、主节点（master）</h4> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/1619062152511.png" alt="1619062152511"></p> <blockquote><p>快速介绍：</p> <ul><li><p>master也要装kubelet和kubeproxy</p></li> <li><p>前端访问（UI\CLI）：</p></li> <li><p>kube-apiserver：</p></li> <li><p>scheduler:</p></li> <li><p>controller manager:</p></li> <li><p>etcd</p></li> <li><p>kubelet+kubeproxy每一个节点的必备+docker（容器运行时环境）</p></li></ul></blockquote> <h4 id="_2、工作节点-node"><a href="#_2、工作节点-node" class="header-anchor">#</a> 2、工作节点（node）</h4> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/1619062201206.png" alt="1619062201206"></p> <blockquote><p>快速介绍：</p> <ul><li>Pod：
<ul><li>docker run 启动的是一个container（容器），<strong>容器是docker的基本单位</strong>，一个应用是一个容器</li> <li>kubelet run 启动的一个应用称为一个Pod；<strong>Pod是k8s的基本单位。</strong> <ul><li>Pod是容器的一个再封装</li> <li>cactusli(永远不变)    ==slf4j=    log4j(类)</li> <li>应用 ===== ==Pod== ======= docker的容器</li> <li>一个容器往往代表不了一个基本应用。博客（php+mysql合起来完成）</li> <li>准备一个Pod 可以包含多个 container；一个Pod代表一个基本的应用。</li> <li>IPod（看电影、听音乐、玩游戏）【一个基本产品，原子】；</li> <li>Pod（music container、movie container）【一个基本产品，原子的】</li></ul></li></ul></li> <li>Kubelet：监工，负责交互master的api-server以及当前机器的应用启停等，在master机器就是master的小助手。每一台机器真正干活的都是这个 Kubelet</li> <li>Kube-proxy：</li> <li>其它:</li></ul></blockquote> <h2 id="_2、组件交互原理"><a href="#_2、组件交互原理" class="header-anchor">#</a> 2、组件交互原理</h2> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/1619076211983.png" alt="1619076211983"></p> <blockquote><p>想让k8s部署一个tomcat？</p> <p>0、开机默认所有节点的kubelet、master节点的scheduler（调度器）、controller-manager（控制管理器）一直监听master的api-server发来的事件变化（for ::）</p> <p>1、程序员使用命令行工具： kubectl ； kubectl create deploy tomcat --image=tomcat8（告诉master让集群使用tomcat8镜像，部署一个tomcat应用）</p> <p>2、kubectl命令行内容发给api-server，api-server保存此次创建信息到etcd</p> <p>3、etcd给api-server上报事件，说刚才有人给我里面保存一个信息。（部署Tomcat[deploy]）</p> <p>4、controller-manager监听到api-server的事件，是 （部署Tomcat[deploy]）</p> <p>5、controller-manager 处理这个 （部署Tomcat[deploy]）的事件。controller-manager会生成Pod的部署信息【pod信息】</p> <p>6、controller-manager 把Pod的信息交给api-server，再保存到etcd</p> <p>7、etcd上报事件【pod信息】给api-server。</p> <p>8、scheduler专门监听 【pod信息】 ，拿到 【pod信息】的内容，计算，看哪个节点合适部署这个Pod【pod调度过后的信息（node: node-02）】，</p> <p>9、scheduler把 【pod调度过后的信息（node: node-02）】交给api-server保存给etcd</p> <p>10、etcd上报事件【pod调度过后的信息（node: node-02）】，给api-server</p> <p>11、其他节点的kubelet专门监听 【pod调度过后的信息（node: node-02）】 事件，集群所有节点kubelet从api-server就拿到了 【pod调度过后的信息（node: node-02）】 事件</p> <p>12、每个节点的kubelet判断是否属于自己的事情；node-02的kubelet发现是他的事情</p> <p>13、node-02的kubelet启动这个pod。汇报给master当前启动好的所有信息</p></blockquote> <h2 id="_3、安装"><a href="#_3、安装" class="header-anchor">#</a> 3、安装</h2> <h3 id="_1、理解"><a href="#_1、理解" class="header-anchor">#</a> 1、理解</h3> <p>安装方式</p> <ul><li>二进制方式（建议生产环境使用）</li> <li>MiniKube.....</li> <li>kubeadm引导方式（官方推荐）
<ul><li>GA</li></ul></li></ul> <p>大致流程</p> <ul><li>准备N台服务器，<strong>内网互通</strong>，</li> <li>安装Docker容器化环境【k8s放弃dockershim】</li> <li>安装Kubernetes
<ul><li>三台机器安装核心组件（<strong>kubeadm(创建集群的引导工具)</strong>,  <em><strong>kubelet</strong></em>，<strong>kubectl（程序员用的命令行）</strong>  ）</li> <li>kubelet可以直接通过容器化的方式创建出之前的核心组件（api-server）【官方把核心组件做成镜像】</li> <li>由kubeadm引导创建集群</li></ul></li></ul> <h3 id="_2、执行"><a href="#_2、执行" class="header-anchor">#</a> 2、执行</h3> <h4 id="_1、准备机器"><a href="#_1、准备机器" class="header-anchor">#</a> 1、准备机器</h4> <ul><li>开通三台机器，内网互通，配置公网ip。centos7.8/7.9，基础实验2c4g三台也可以</li> <li>每台机器的hostname不要用localhost，可用k8s-01，k8s-02，k8s-03之类的【不包含下划线、小数点、大写字母】（这个后续步骤也可以做）</li></ul> <h4 id="_2、安装前置环境-都执行"><a href="#_2、安装前置环境-都执行" class="header-anchor">#</a> 2、安装前置环境（都执行）</h4> <h5 id="_1、基础环境"><a href="#_1、基础环境" class="header-anchor">#</a> 1、基础环境</h5> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token comment">#########################################################################</span>
<span class="token comment">#关闭防火墙： 如果是云服务器，需要设置安全组策略放行端口</span>
<span class="token comment"># https://kubernetes.io/zh/docs/setup/production-environment/tools/kubeadm/install-kubeadm/#check-required-ports</span>
systemctl stop firewalld
systemctl disable firewalld

<span class="token comment"># 修改 hostname</span>
hostnamectl set-hostname k8s-01
<span class="token comment"># 查看修改结果</span>
hostnamectl status
<span class="token comment"># 设置 hostname 解析</span>
<span class="token builtin class-name">echo</span> <span class="token string">&quot;127.0.0.1   <span class="token variable"><span class="token variable">$(</span><span class="token function">hostname</span><span class="token variable">)</span></span>&quot;</span> <span class="token operator">&gt;&gt;</span> /etc/hosts

<span class="token comment">#关闭 selinux： </span>
<span class="token function">sed</span> <span class="token parameter variable">-i</span> <span class="token string">'s/enforcing/disabled/'</span> /etc/selinux/config
setenforce <span class="token number">0</span>

<span class="token comment">#关闭 swap：</span>
swapoff <span class="token parameter variable">-a</span>  
<span class="token function">sed</span> <span class="token parameter variable">-ri</span> <span class="token string">'s/.*swap.*/#&amp;/'</span> /etc/fstab 

<span class="token comment">#允许 iptables 检查桥接流量</span>
<span class="token comment">#https://kubernetes.io/zh/docs/setup/production-environment/tools/kubeadm/install-kubeadm/#%E5%85%81%E8%AE%B8-iptables-%E6%A3%80%E6%9F%A5%E6%A1%A5%E6%8E%A5%E6%B5%81%E9%87%8F</span>
<span class="token comment">## 开启br_netfilter</span>
<span class="token comment">## sudo modprobe br_netfilter</span>
<span class="token comment">## 确认下</span>
<span class="token comment">## lsmod | grep br_netfilter</span>

<span class="token comment">## 修改配置</span>


<span class="token comment">#####这里用这个，不要用课堂上的配置。。。。。。。。。</span>
<span class="token comment">#将桥接的 IPv4 流量传递到 iptables 的链：</span>
<span class="token comment"># 修改 /etc/sysctl.conf</span>
<span class="token comment"># 如果有配置，则修改</span>
<span class="token function">sed</span> <span class="token parameter variable">-i</span> <span class="token string">&quot;s#^net.ipv4.ip_forward.*#net.ipv4.ip_forward=1#g&quot;</span>  /etc/sysctl.conf
<span class="token function">sed</span> <span class="token parameter variable">-i</span> <span class="token string">&quot;s#^net.bridge.bridge-nf-call-ip6tables.*#net.bridge.bridge-nf-call-ip6tables=1#g&quot;</span>  /etc/sysctl.conf
<span class="token function">sed</span> <span class="token parameter variable">-i</span> <span class="token string">&quot;s#^net.bridge.bridge-nf-call-iptables.*#net.bridge.bridge-nf-call-iptables=1#g&quot;</span>  /etc/sysctl.conf
<span class="token function">sed</span> <span class="token parameter variable">-i</span> <span class="token string">&quot;s#^net.ipv6.conf.all.disable_ipv6.*#net.ipv6.conf.all.disable_ipv6=1#g&quot;</span>  /etc/sysctl.conf
<span class="token function">sed</span> <span class="token parameter variable">-i</span> <span class="token string">&quot;s#^net.ipv6.conf.default.disable_ipv6.*#net.ipv6.conf.default.disable_ipv6=1#g&quot;</span>  /etc/sysctl.conf
<span class="token function">sed</span> <span class="token parameter variable">-i</span> <span class="token string">&quot;s#^net.ipv6.conf.lo.disable_ipv6.*#net.ipv6.conf.lo.disable_ipv6=1#g&quot;</span>  /etc/sysctl.conf
<span class="token function">sed</span> <span class="token parameter variable">-i</span> <span class="token string">&quot;s#^net.ipv6.conf.all.forwarding.*#net.ipv6.conf.all.forwarding=1#g&quot;</span>  /etc/sysctl.conf
<span class="token comment"># 可能没有，追加</span>
<span class="token builtin class-name">echo</span> <span class="token string">&quot;net.ipv4.ip_forward = 1&quot;</span> <span class="token operator">&gt;&gt;</span> /etc/sysctl.conf
<span class="token builtin class-name">echo</span> <span class="token string">&quot;net.bridge.bridge-nf-call-ip6tables = 1&quot;</span> <span class="token operator">&gt;&gt;</span> /etc/sysctl.conf
<span class="token builtin class-name">echo</span> <span class="token string">&quot;net.bridge.bridge-nf-call-iptables = 1&quot;</span> <span class="token operator">&gt;&gt;</span> /etc/sysctl.conf
<span class="token builtin class-name">echo</span> <span class="token string">&quot;net.ipv6.conf.all.disable_ipv6 = 1&quot;</span> <span class="token operator">&gt;&gt;</span> /etc/sysctl.conf
<span class="token builtin class-name">echo</span> <span class="token string">&quot;net.ipv6.conf.default.disable_ipv6 = 1&quot;</span> <span class="token operator">&gt;&gt;</span> /etc/sysctl.conf
<span class="token builtin class-name">echo</span> <span class="token string">&quot;net.ipv6.conf.lo.disable_ipv6 = 1&quot;</span> <span class="token operator">&gt;&gt;</span> /etc/sysctl.conf
<span class="token builtin class-name">echo</span> <span class="token string">&quot;net.ipv6.conf.all.forwarding = 1&quot;</span>  <span class="token operator">&gt;&gt;</span> /etc/sysctl.conf
<span class="token comment"># 执行命令以应用</span>
<span class="token function">sysctl</span> <span class="token parameter variable">-p</span>
