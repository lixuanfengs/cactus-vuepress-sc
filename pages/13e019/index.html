1-12-20</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Java 多用户即时通信系统<!----></h1>  <div class="theme-vdoing-content content__default"><h1 id="java-多用户即时通信系统"><a href="#java-多用户即时通信系统" class="header-anchor">#</a> Java 多用户即时通信系统</h1> <h2 id="涉及到java各个方面的技术"><a href="#涉及到java各个方面的技术" class="header-anchor">#</a> 涉及到Java各个方面的技术</h2> <ul><li>项目框架设计</li> <li>java面向对象编程</li> <li>网络编程</li> <li>多线程</li> <li>IO流</li> <li>Mysql/使用集合充当内存数据库</li></ul> <h3 id="需求分析"><a href="#需求分析" class="header-anchor">#</a> 需求分析</h3> <ol><li>用户登录</li> <li>拉取在线用户列表</li> <li>无异常退出(客户端、服务端)</li> <li>私聊</li> <li>群聊</li> <li>发文件</li> <li>服务器推送新闻</li></ol> <h2 id="界面设计"><a href="#界面设计" class="header-anchor">#</a> 界面设计</h2> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/users/01.png" alt="01"></p> <h2 id="功能实现-用户登录"><a href="#功能实现-用户登录" class="header-anchor">#</a> 功能实现-用户登录</h2> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/users/02.png" alt="02"></p> <h2 id="功能实现-拉取在线用户列表"><a href="#功能实现-拉取在线用户列表" class="header-anchor">#</a> 功能实现-拉取在线用户列表</h2> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/users/03.png" alt="03"></p> <h2 id="功能实现-无异常退出"><a href="#功能实现-无异常退出" class="header-anchor">#</a> 功能实现-无异常退出</h2> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/users/04.png" alt="04"></p> <h2 id="功能实现-私聊"><a href="#功能实现-私聊" class="header-anchor">#</a> 功能实现-私聊</h2> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/users/05.png" alt="05"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/users/06.png" alt="06"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/users/07.png" alt="12"></p> <h2 id="功能实现-群聊"><a href="#功能实现-群聊" class="header-anchor">#</a> 功能实现-群聊</h2> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/users/08.png" alt="12"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/users/09.png" alt="12"></p> <h2 id="功能实现-发文件"><a href="#功能实现-发文件" class="header-anchor">#</a> 功能实现-发文件</h2> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/users/10.png" alt="12"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/users/11.png" alt="12"></p> <h2 id="功能实现-服务器推送新闻"><a href="#功能实现-服务器推送新闻" class="header-anchor">#</a> 功能实现-服务器推送新闻</h2> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/users/12.png" alt="12"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/users/13.png" alt="12"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/users/14.png" alt="12"></p> <h2 id="代码实现"><a href="#代码实现" class="header-anchor">#</a> 代码实现</h2> <ul><li>服务端:</li></ul> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">package</span> <span class="token namespace">com<span class="token punctuation">.</span>qqcommon</span><span class="token punctuation">;</span>

<span class="token keyword">import</span> <span class="token import"><span class="token namespace">java<span class="token punctuation">.</span>io<span class="token punctuation">.</span></span><span class="token class-name">Serializable</span></span><span class="token punctuation">;</span>

<span class="token comment">/**
 * @author cactusli
 * @version 1.0
 * @date 2021/8/7  16:32
