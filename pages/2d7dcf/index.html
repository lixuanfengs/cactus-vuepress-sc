a href="/pages/3750a4/" class="sidebar-link">服务注册组件搭建采集接口信息</a></li><li><a href="/pages/46c35f/" class="sidebar-link">应用服务接口注册到注册中心</a></li><li><a href="/pages/bb3695/" class="sidebar-link">订阅服务注册消息驱动网关映射</a></li><li><a href="/pages/2d7dcf/" aria-current="page" class="active sidebar-link">网关运营管理后台框架搭建</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level2"><a href="/pages/2d7dcf/#学习方法" class="sidebar-link">学习方法</a></li><li class="sidebar-sub-header level2"><a href="/pages/2d7dcf/#后台展示" class="sidebar-link">后台展示</a></li><li class="sidebar-sub-header level2"><a href="/pages/2d7dcf/#框架搭建" class="sidebar-link">框架搭建</a></li><li class="sidebar-sub-header level2"><a href="/pages/2d7dcf/#文件配置" class="sidebar-link">文件配置</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level3"><a href="/pages/2d7dcf/#vue页面开发" class="sidebar-link">vue页面开发</a></li><li class="sidebar-sub-header level3"><a href="/pages/2d7dcf/#页面api调用" class="sidebar-link">页面API调用</a></li><li class="sidebar-sub-header level3"><a href="/pages/2d7dcf/#路由配置" class="sidebar-link">路由配置</a></li><li class="sidebar-sub-header level3"><a href="/pages/2d7dcf/#菜单配置" class="sidebar-link">菜单配置</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/pages/2d7dcf/#本章小结" class="sidebar-link">本章小结</a></li></ul></li><li><a href="/pages/6936ee/" class="sidebar-link">前后端分离应用的跨域接口调用</a></li><li><a href="/pages/13559a/" class="sidebar-link">网关Nginx负载模型配置</a></li><li><a href="/pages/918d1a/" class="sidebar-link">动态刷新网关Nginx负载均衡配置</a></li><li><a href="/pages/dea686/" class="sidebar-link">实现网关算力节点动态负载功能</a></li><li><a href="/pages/1bdcba/" class="sidebar-link">网关组件工程模块合并</a></li><li><a href="/pages/d9cb43/" class="sidebar-link">功能完善(算力关联、接口上报、调用反馈)</a></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/note/Gateway/#《API网关设计与实现》" data-v-06225672>《API网关设计与实现》</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2023-09-15</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->网关运营管理后台框架搭建<!----></h1>  <div class="theme-vdoing-content content__default"><h2 id="学习方法"><a href="#学习方法" class="header-anchor">#</a> <strong>学习方法</strong></h2> <p>通常在我们的系统开发中，都有一个用于管理整个应用配置和检索数据的管理后台，便于运营使用。在早期没有vue出现之前，大家通常使用类似 <strong><a href="https://www.ilayuis.com/" target="_blank" rel="noopener noreferrer">Layui<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></strong> 这样的框架搭建管理后台，虽然它已经停更了但不影响它的使用也真的非常好用。</p> <p>不过在互联网公司很多运营后台都是由前端研发提供好vue框架并负责开发，或者一些简单的页面也可以由后端研发进行处理。类似这样的 vue 运营管理框架包括：</p> <ol><li><strong><a href="https://github.com/PanJiaChen/vue-element-admin" target="_blank" rel="noopener noreferrer">vue-element-admin<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></strong> - 一个基于 vue2.0 和 Eelement 的控制面板 UI 框架，这是使用vue技术栈开发的前端程序员的首选管理系统模板，模板以及非常的成熟了，并且有相关的社区和维护人员，开发时候遇到问题也不要慌。</li> <li><strong><a href="https://www.antdv.com/docs/vue/introduce-cn/" target="_blank" rel="noopener noreferrer">ant-design-vue-pro<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></strong> - 阿里背书，蚂蚁家族的。</li> <li><strong><a href="https://github.com/iview/iview-admin" target="_blank" rel="noopener noreferrer">iview-admin<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></strong> - iView admin 是基于 iView 的 Vue 2.0 控制面板。搭配使用 iView UI 组件库形成的一套后台集成解决方案。</li> <li><strong><a href="https://github.com/d2-projects/d2-admin" target="_blank" rel="noopener noreferrer">d2-admin<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></strong> - D2Admin 是一个完全 开源免费 的企业中后台产品前端集成方案，基于 <a href="http://vue.js/" target="_blank" rel="noopener noreferrer">vue.js<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 和 ElementUI 的管理系统前端解决方案 ，小于 60kb 的本地首屏 js 加载</li> <li><strong><a href="https://github.com/epicmaxco/vuestic-admin" target="_blank" rel="noopener noreferrer">vuestic-admin<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></strong> - vuestic-admin，一款免费而美妙<a href="http://vue.js/" target="_blank" rel="noopener noreferrer">Vue.js<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>管理模板包括38以上个定制用户界面组件，像地图，聊天，个人资料卡，图标，进度条、登录和注册的预建页面等等。</li> <li><strong><a href="https://admin.vuebulma.com/" target="_blank" rel="noopener noreferrer">Vue Admin<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></strong> - Vue Admin 是一个基于 Vue 2.0 &amp; Bulma 0.3 的后台管理面板（管理系统），相当于是 Vue 版本的 Bootstrap 管理系统，提供了一组通用的后台界面 UI 和组件，其中还有丰富的图表组件，开箱即用。</li> <li><strong><a href="https://github.com/lin-xin/vue-manage-system" target="_blank" rel="noopener noreferrer">vue-manage-system<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></strong> - 基于<a href="http://vue.js/" target="_blank" rel="noopener noreferrer">Vue.js<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 2.x系列 + Element UI 的后台管理系统解决方案 ,弥补了element中缺少图片裁剪上传、富文本编辑器、图表等这些在后台管理系统中很常见的功能。适用于绝大部分的后台管理系统（Web Management System）开发。</li></ol> <p>以上这些框架都可以搭建出运营管理后台，这里也做了一些测试验证，虽然有些像 vue-element-admin 老牌非常强大，但整体框架也不小，开发模式会复杂一些适合更大的系统和专业的vue人员使用。我们这里为了让大家既能学习到vue，也能简单的入门，所以在测试后选择了 vue-manage-system 进行使用。</p> <h2 id="后台展示"><a href="#后台展示" class="header-anchor">#</a> <strong>后台展示</strong></h2> <p>搭建好的框架已经放到代码仓库；------------</p> <p>可以直接下载到本地，使用 IDEA 打开后，会提示你运行。</p> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-blogs/image-20230919171129441.png" alt="image-20230919171129441"></p> <p>npm install 是一个初始化操作，用于构建vue工程的。构建完成后就可以启动工程了，命令如下；</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code>npm install       <span class="token comment">// 安装项目依赖，等待安装完成之后，安装失败可用 cnpm 或 yarn</span>
npm run dev       <span class="token comment">// 运行</span>
npm run build     <span class="token comment">// 执行构建命令，生成的dist文件夹放在服务器下即可访问</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p><img src="https://lixuanfengs.github.io/blog-images/cactus-blogs/image-20230919171627887.png" alt="image-20230919171627887"></p> <p><strong>访问</strong>：<strong>http://localhost:5173/</strong></p> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-blogs/image-20230919173111003.png" alt="image-20230919173111003"></p> <p>接下就讲解下这样的框架是如何搭建和配置的。</p> <h2 id="框架搭建"><a href="#框架搭建" class="header-anchor">#</a> <strong>框架搭建</strong></h2> <p>首先你要确保你本地已经安装了 node 且在 14.18+ 的版本，这是一个基本的环境要求，如果没有可以去安装 node 环境。</p> <ol><li>拉取代码：git clone https://github.com/lin-xin/vue-manage-system.git</li> <li>进入模板：cd vue-manage-system - 你也可以把这里的文件复制到工程根目录下，但要记得在 IDEA 中复制，避免因为文件件中看不到有些隐藏文件。如果放到根目录，记得看下 <a href="http://app.vue/" target="_blank" rel="noopener noreferrer">App.vue<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 中的文件路径。src/assets/css/<a href="http://main.css/" target="_blank" rel="noopener noreferrer">main.css<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22
