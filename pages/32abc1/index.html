set global max_connections = 1000;  #设置最大连接数1000

show variables like &quot;max_connections&quot;; #显示最大连接数

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>永久解决方案</p> <p>修改或添加 my.cnf   里的配置 max_connections=1000</p></blockquote> <h2 id="mysql主从"><a href="#mysql主从" class="header-anchor">#</a> MySQL主从</h2> <h3 id="介绍"><a href="#介绍" class="header-anchor">#</a> 介绍</h3> <p>主从复制:是MySQL数据库的一种容灾备份方案,是MySQL自带的功能,无需借助第三方工具,MySQL的主从复制并不是数据库磁盘上的文件直接拷贝,而是通过逻辑的binlog日志复制到要同步的服务器本地。然后由本地的线程读取日志里面的SQL语句重新应用到MySQL数据库中</p> <h3 id="原理"><a href="#原理" class="header-anchor">#</a> 原理</h3> <p>1、master将改变记录到二进制日志(binary log)中</p> <p>(这些记录叫做二进制日志事件,binary log events);</p> <p>2、slave将master的binary log events 拷贝到它的中继日志(relay log)</p> <p>3、slave重做中继日志中的事件,将日志操作还原并生成数据</p> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/b2b3522b0bcf49a0bc52f2aba8ff615a.png" alt="img"></p> <h3 id="同步方式"><a href="#同步方式" class="header-anchor">#</a> 同步方式</h3> <p>1、异步同步:搭建简单,使用非常广泛,从MySQL诞生之初就产生了这种架构,性能非常好,可谓非常成熟。但是这种架构数据是异步的,所以有丢失数据库的风险</p> <p>2、全同步复制:保证数据安全,不丢数据,损失性能</p> <p>3、传统半同步复制:性能，功能都介于异步和全同步中间。从mysql5.5开始诞生，目的是为了折中上述两种架构的性能以及优缺点</p> <p>4、无损复制，增强版的半同步复制:数据零丢失，性能好 ，mysql5.7诞生</p> <h3 id="开始配置主从"><a href="#开始配置主从" class="header-anchor">#</a> 开始配置主从</h3> <h4 id="需求"><a href="#需求" class="header-anchor">#</a> 需求</h4> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>操作系统： centos7.9
主从架构:  一主两从，主库用于生产，从库用于数据容灾和主库备机
主库IP:   <span class="token number">10.2</span>.32.4
从库IP1:  <span class="token number">10.2</span>.32.5
从库IP2:  <span class="token number">10.2</span>.32.6
数据库: MySQL8.x
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><h4 id="编辑主库配置文件"><a href="#编辑主库配置文件" class="header-anchor">#</a> 编辑主库配置文件</h4> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># 三台机器都要操作</span>
