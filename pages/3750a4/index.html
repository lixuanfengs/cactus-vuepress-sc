a href="/pages/3750a4/" aria-current="page" class="active sidebar-link">服务注册组件搭建采集接口信息</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level2"><a href="/pages/3750a4/#学习方法" class="sidebar-link">学习方法</a></li><li class="sidebar-sub-header level2"><a href="/pages/3750a4/#注册组件" class="sidebar-link">注册组件</a></li><li class="sidebar-sub-header level2"><a href="/pages/3750a4/#功能实现" class="sidebar-link">功能实现</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level3"><a href="/pages/3750a4/#工程结构" class="sidebar-link">工程结构</a></li><li class="sidebar-sub-header level3"><a href="/pages/3750a4/#定义注解" class="sidebar-link">定义注解</a></li><li class="sidebar-sub-header level3"><a href="/pages/3750a4/#应用配置" class="sidebar-link">应用配置</a></li><li class="sidebar-sub-header level3"><a href="/pages/3750a4/#信息提取" class="sidebar-link">信息提取</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/pages/3750a4/#测试验证" class="sidebar-link">测试验证</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level3"><a href="/pages/3750a4/#前置条件" class="sidebar-link">前置条件</a></li><li class="sidebar-sub-header level3"><a href="/pages/3750a4/#启动测试" class="sidebar-link">启动测试</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/pages/3750a4/#本章小结" class="sidebar-link">本章小结</a></li></ul></li><li><a href="/pages/46c35f/" class="sidebar-link">应用服务接口注册到注册中心</a></li><li><a href="/pages/bb3695/" class="sidebar-link">订阅服务注册消息驱动网关映射</a></li><li><a href="/pages/2d7dcf/" class="sidebar-link">网关运营管理后台框架搭建</a></li><li><a href="/pages/6936ee/" class="sidebar-link">前后端分离应用的跨域接口调用</a></li><li><a href="/pages/13559a/" class="sidebar-link">网关Nginx负载模型配置</a></li><li><a href="/pages/918d1a/" class="sidebar-link">动态刷新网关Nginx负载均衡配置</a></li><li><a href="/pages/dea686/" class="sidebar-link">实现网关算力节点动态负载功能</a></li><li><a href="/pages/1bdcba/" class="sidebar-link">网关组件工程模块合并</a></li><li><a href="/pages/d9cb43/" class="sidebar-link">功能完善(算力关联、接口上报、调用反馈)</a></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/note/Gateway/#《API网关设计与实现》" data-v-06225672>《API网关设计与实现》</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2023-08-28</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->服务注册组件搭建采集接口信息<!----></h1>  <div class="theme-vdoing-content content__default"><h2 id="学习方法"><a href="#学习方法" class="header-anchor">#</a> <strong>学习方法</strong></h2> <p>你觉得使用设计模式会让事情变得复杂吗？</p> <p>在我们日常进行代码评审时，经常会遇到一种实现方式。一个接口对应一个实现类，而这个实现类可能会有上千行代码。但在这些代码实现中，除了定义接口并写实现类外，基本上看不到任何使用设计模式的痕迹，也没有体现出所谓的职责分离。</p> <p>然而，没有使用设计模式的主要问题似乎是：“使用设计模式会浪费时间”。但根据我的经验来看，实际上浪费时间的往往不是设计模式本身，而是代码编写者缺乏运用设计模式的能力和经验。这也是为什么他们无法应用设计模式。当你真正开始用设计模式来编写代码时，你会意识到，没有比这更让人兴奋的事情了。因为你的代码会变得非常清晰，这有助于调试和后续的迭代。</p> <p>就好比你在解决一个复杂的拼图一样，设计模式就像是拼图中的小块，它们将你的代码连接成一个完整的、清晰的画面。当你一旦掌握了这些小块的使用方式，你会发现，它们能够显著提高你的代码质量，让你的项目更易于管理和维护。</p> <p>因此，虽然一开始可能需要花一些时间来学习和应用设计模式，但当你逐渐熟练后，你会体会到，设计模式对于代码质量和开发效率的积极影响是非常值得的。</p> <h2 id="注册组件"><a href="#注册组件" class="header-anchor">#</a> <strong>注册组件</strong></h2> <p>首先，让我们聊一下关于网关注册中心的事情。它像是一个信息交汇的中心，它的职责是维护着网关和 RPC 接口的种种信息，好让我们能够将这些 RPC 接口智能地分配到网关的不同计算资源上。之前的章节已经成功实现了网关计算资源的自动注册，但同样地，对于 RPC 接口，也需要自动注册。要不然，若仍然依赖人工手动地去维护这个过程，将会是一个相当耗费人力资源的大工程。</p> <p>接下来，让我们来谈谈<strong>应用注册组件</strong>的精彩之处。这个组件的使命是为那些由 RPC 接口所生成的服务提供便捷。这是通过引入 SDK 组件，并以一种极富创意的注解配置方式来实现的。当你启动你的服务时，这个 SDK 组件就像是一位精明的侦探，他会捕捉到那些被标记上注解的接口和方法，然后将这些珍贵的情报秘密地传送给服务端进行注册。这个过程就像是在悄悄地编织着一张无形的网，将所有服务连接在一起。</p> <p>这样，你的服务就不再需要手动去注册了，因为这个应用注册组件已经帮你完成了。这意味着你能够将更多的精力集中在创造性的开发工作上，而不是浪费时间在繁琐的手动操作中。就像是一支隐形的队伍，这个组件会在背后默默地协助你，让你的服务体系变得更加智能和高效。</p> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-blogs/image-20230829102148928.png" alt="image-20230829102148928"></p> <ul><li><p>开发 api-gateway-sdk 组件，获取 Spring Bean 对象的注册结果。并对已经使用注解标记了的接口进行拦截提取接口和方法信息。</p></li> <li><p>本章暂时只完成这部分组件的开发，后续章节再完善向网关中心注册的操作。</p></li></ul> <h2 id="功能实现"><a href="#功能实现" class="header-anchor">#</a> <strong>功能实现</strong></h2> <h3 id="工程结构"><a href="#工程结构" class="header-anchor">#</a> <strong>工程结构</strong></h3> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-blogs/image-20230830095044316.png" alt="image-20230830095044316"></p> <ul><li>源码：------</li></ul> <h3 id="定义注解"><a href="#定义注解" class="header-anchor">#</a> <strong>定义注解</strong></h3> <p>在这里，我们需要创造出两个独特的自定义注解，这些注解就像是魔法印记一样，能够将我们的接口变得有灵气。通过这些注解的标记，我们就能够在以后读取 Bean 对象时，灵巧地判断出是否需要从中提取信息并加以注册。</p> <p>这就像是在接口的世界中画上了一抹魔法符号，这些符号会在背后默默地发挥作用。当我们的系统读取到 Bean 对象时，这些注解就会告诉我们哪些接口是需要被特殊对待的。这就像是一个接口的小秘密，被注解隐藏在其中，只有懂得这种神秘语言的人才能理解。</p> <p>这个过程就像是在编织一张看不见的网，只有那些被注解标记过的接口会被有心人发现。而这些接口，将会在后续的操作中得到特别的对待。这样，通过简单的一些魔法印记，我们就能够赋予我们的接口更多的能力和特殊功能。</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Documented</span>
<span class="token annotation punctuation">@Retention</span><span class="token punctuation">(</span><span class="token class-name">RetentionPolicy</span><span class="token punctuation">.</span><span class="token constant">RUNTIME</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@Target</span><span class="token punctuation">(</span><span class="token punctuation">{</span><span class="token class-name">ElementType</span><span class="token punctuation">.</span><span class="token constant">TYPE</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token annotation punctuation">@interface</span> <span class="token class-name">ApiProducerClazz</span> <span class="token punctuation">{</span>

    <span class="token comment">/** 接口名称 */</span>
    <span class="token class-name">String</span> <span class="token function">interfaceName</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">default</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">;</span>

    <span class="token comment">/** 接口版本 */</span>
    <span class="token class-name">String</span> <span class="token function">interfaceVersion</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">default</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span><span class="token operator">--</span>
    
<span class="token annotation punctuation">@Documented</span>
<span class="token annotation punctuation">@Retention</span><span class="token punctuation">(</span><span class="token class-name">RetentionPolicy</span><span class="token punctuation">.</span><span class="token constant">RUNTIME</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@Target</span><span class="token punctuation">(</span><span class="token punctuation">{</span><span class="token class-name">ElementType</span><span class="token punctuation">.</span><span class="token constant">METHOD</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token annotation punctuation">@interface</span> <span class="token class-name">ApiProducerMethod</span> <span class="token punctuation">{</span>

    <span class="token comment">/** 方法名称 */</span>
    <span class="token class-name">String</span> <span class="token function">methodName</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">default</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">;</span>

    <span class="token comment">/** 访问路径；/cactus/activity/sayHi */</span>
    <span class="token class-name">String</span> <span class="token function">uri</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">default</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">;</span>

    <span class="token comment">/** 接口类型；GET、POST、PUT、DELETE */</span>
    <span class="token class-name">String</span> <span class="token function">httpCommandType</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">default</span> <span class="token string">&quot;GET&quot;</span><span class="token punctuation">;</span>

    <span class="token comment">/** 是否认证；true = 1是、false = 0否 */</span>
    <span class="token keyword">int</span> <span class="token function">auth</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">default</span> <span class="token number">0</span><span class="token punctuation">;</span>

<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br></div></div><ul><li>ApiProducerClazz 注解作用到类上，ApiProducerMethod 注解作用到方法上。</li></ul> <h3 id="应用配置"><a href="#应用配置" class="header-anchor">#</a> <strong>应用配置</strong></h3> <p>在这个部分，我们要谈的是应用配置，就好像是给我们的系统装上了一套特别的工具箱，让它变得更加灵活多变。这个工具箱中装满了我们所需的各种要素，其中包括了网关注册中心的地址、系统的标识、系统的名字，还有用于注册 RPC 接口的注册中心。</p> <p>想象一下，当你在组装一台复杂的机器时，你需要仔细地选择每个零件，确保它们都能够完美地协同工作。这些应用配置就好像是你在这个过程中的指南针，告诉你应该在哪里放置哪个零件。它们是为了确保你的系统能够以最佳状态运行而存在的。</p> <p>举个例子，网关注册中心的地址就像是一个通讯中心，它负责把信息传递到正确的地方。系统的标识和名字则是你的系统的身份证，让其他系统能够认识你。而 RPC 注册中心，就好像是一个大型数据库，记录着你的 RPC 接口的位置和信息。</p> <p>总之，应用配置就是我们系统的定制工具箱，它们的存在使得我们的系统能够灵活地适应不同的环境和需求，就像一台精密的机器，始终保持着高效运转。</p> <p><strong>源码详见：cn.cactusli.gateway.sdk.config.GatewaySDKServiceProperties</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@ConfigurationProperties</span><span class="token punctuation">(</span>prefix <span class="token operator">=</span> <span class="token string">&quot;gateway.sdk&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">GatewaySDKServiceProperties</span> <span class="token punctuation">{</span>

    <span class="token comment">/** 网关注册中心地址 */</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> address<span class="token punctuation">;</span>
    <span class="token comment">/** 系统标识 */</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> systemId<span class="token punctuation">;</span>

    <span class="token keyword">private</span> <span class="token class-name">String</span> systemName<span class="token punctuation">;</span>

    <span class="token keyword">private</span> <span class="token class-name">String</span> systemRegistry<span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">getAddress</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> address<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">setAddress</span><span class="token punctuation">(</span><span class="token class-name">String</span> address<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>address <span class="token operator">=</span> address<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">getSystemId</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> systemId<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">setSystemId</span><span class="token punctuation">(</span><span class="token class-name">String</span> systemId<span class="token punctuation">)</span> <span class="token punctuation">{</span>

    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">getSystemName</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> systemName<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">setSystemName</span><span class="token punctuation">(</span><span class="token class-name">String</span> systemName<span class="token punctuation">)</span> <span class="token punctuation">{</span>

    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">getSystemRegistry</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>

在这个星球上已经有很多项目都涉及到了 Spring Boot Starter 组件的开发，这为你提供了很好的学习资源。</p></li> <li><p>在日常使用网关服务时，我们通常只需要在本地引入一个已经提供好的网关 SDK，然后简单地进行一些配置即可完成接口与网关之间的注册过程，就像是将食材放入锅中一样简单。如果有其他额外的需求，也可以前往网关的控制后台页面，进行一些修改，就像是在调整自己的独特口味一样。整个过程如此便捷，让我们能够更专注地享受网关服务带来的便利。</p></li></ul></div></div>  <div class="page-edit"><div class="edit-link"><a href="https://github.com/lixuanfengs/cactus-vuepress-sc/edit/master/docs/《API网关设计与实现》/24.服务注册组件搭建采集接口信息.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <div class="tags"><a href="/tags/?tag=gateway" title="标签">#gateway</a></div> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2023/08/31, 17:59:16</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/81289e/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">网关引擎打包镜像部署</div></a> <a href="/pages/46c35f/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">应用服务接口注册到注册中心</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
