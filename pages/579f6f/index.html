5672></a></li> <li data-v-06225672><a href="/Java/#后端" data-v-06225672>后端</a></li><li data-v-06225672><a href="/Java/#阅读源码系列" data-v-06225672>阅读源码系列</a></li><li data-v-06225672><a href="/Java/#Spring Boot" data-v-06225672>Spring Boot</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2022-05-11</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->如何分析SpringBoot源码模块及结构？<!----></h1>  <div class="theme-vdoing-content content__default"><p>注：该源码分析对应SpringBoot版本为<strong>2.1.0.RELEASE</strong></p> <h2 id="_1-前言"><a href="#_1-前言" class="header-anchor">#</a> 1 前言</h2> <p>前面搭建好了自己本地的SpringBoot源码调试环境后，此时我们不要急着下手进入到具体的源码调试细节中，<strong>刚开始阅读源码，此时我们一定要对项目结构等有一个整体的认识，然后再进行源码分析调试</strong>。推荐阅读下笔者之前写的的<a href="https://juejin.cn/post/6844904067936813063" target="_blank" rel="noopener noreferrer">分析开源项目源码，我们该如何入手分析？<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>一文，干货满满哦。</p> <h2 id="_2-springboot源码模块一览"><a href="#_2-springboot源码模块一览" class="header-anchor">#</a> 2 SpringBoot源码模块一览</h2> <p>我们先来对SpringBoot的源码模块来一个大致的了解，如下图：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/6110d3d47253a076a3045e241139bce6.webp" alt="img"></p> <p>从上图可以看到，主要有以下四个模块：</p> <ul><li><code>**spring-boot-project**</code>：整个SpringBoot框架全部功能在这个模块实现，SpringBoot项目95%的代码都在这里实现，源码总共有25万行左右。</li> <li><code>**spring-boot-samples**</code>：这个是SpringBoot给小伙伴们赠送的福利，里面包含了各种各样使用SpringBoot的简单demo，我们调试阅读源码的时候可以充分利用该模块。</li> <li><code>**spring-boot-sample-invoker**</code>：这个模块应该是跟sample模块有关，注意根pom.xml中有这么一句话：<code>Samples are built via the invoker plugin</code>，该模块无代码。</li> <li><code>**spring-boot-tests**</code>：这个模块SpringBoot的测试模块，跟部署测试和集成测试有关。</li></ul> <p>因为SpringBoot的全部功能在spring-boot-project模块实现，因此下面重点来介绍下 spring-boot-project 模块。</p> <h2 id="_3-spring-boot-project源码模块详解"><a href="#_3-spring-boot-project源码模块详解" class="header-anchor">#</a> 3 spring-boot-project源码模块详解</h2> <p>先来看下 <code>spring-boot-project</code> 整体模块结构，如下图，然后我们再逐个来介绍：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/94003cc77177de74e2221957747f37e3.webp" alt="img"></p> <h4 id="_1-spring-boot-parent"><a href="#_1-spring-boot-parent" class="header-anchor">#</a> 1) spring-boot-parent</h4> <p>这个模块没有代码，是spring-boot模块的父项目，被其他子模块继承。</p> <h4 id="_2-spring-boot"><a href="#_2-spring-boot" class="header-anchor">#</a> 2) spring-boot</h4> <p>这个模块是SpringBoot项目的核心，可以说一些基础核心的功能都在这里实现，为SpringBoot的其他模块组件功能提供了支持，主要包括以下核心功能：</p> <ul><li><code>SpringApplication</code>类，这个是SpringBoot的启动类，提供了一个静态的<code>run</code>方法来启动程序，该类主要用来创建并且刷新Spring容器<code>ApplicationContext</code>.</li> <li>支持选择不同的容器比如Tomcat,Jetty等来作为应用的嵌入容器，这个是SpringBoot的新特性之一。</li> <li>外部配置支持，这个指的是我们执行<code>java -jar xxx.jar</code>命令时可以带一些参数，比如执行<code>java -jar demo.jar --server.port=8888</code>来将应用端口修改为8888.</li> <li>该模块内置了一些SpringBoot启动时的生命周期事件和一些容器初始化器(<code>ApplicationContext</code> initializers)，来执行一些SpringBoot启动时的初始化逻辑。</li></ul> <h4 id="_3-spring-boot-autoconfigure"><a href="#_3-spring-boot-autoconfigure" class="header-anchor">#</a> 3) spring-boot-autoconfigure</h4> <p>这个模块跟SpringBoot的自动配置有关，也是SpringBoot的新特性之一。比如SpringBoot能基于类路径来自动配置某个项目模块，自动配置最为关键的注解是<code>@EnableAutoConfiguration</code>,这个注解能触发Spring上下文的自动配置。另外一个重要的注解是<code>@Conditional</code>。</p> <p>举个栗子，若<code>HSQLDB</code>在项目的类路径中，且我们没有配置任何其他数据库的连接，此时自动配置就会自动根据类路径来创建相应的<code>bean</code>。</p> <p>除了根据类路径来进行自动配置外，还有根据容器中是否存在某个bean等方式来进行自动配置，这里不会进入到具体细节中。</p> <h4 id="_4-spring-boot-starters"><a href="#_4-spring-boot-starters" class="header-anchor">#</a> 4) spring-boot-starters</h4> <p>这个模块是跟SpringBoot的起步依赖有关，也是SpringBoot的新特性之一。SpringBoot通过提供众多起步依赖降低项目依赖的复杂度。起步依赖其实就是利用maven项目模型将其他相关的依赖给聚合起来，里面各种依赖的版本号都给定义好，避免用户在引入依赖时出现各种版本冲突，方便了我们的使用。</p> <p>举个栗子，我们要用到activemq时，此时可以直接引入<code>spring-boot-starter-activemq</code>起步依赖即可，若SpringBoot官网或第三方组织没有提供相应的SpringBoot起步依赖时，此时我们可以进行定制自己的起步依赖。</p> <p>注意，该模块没有代码，主要是通过maven的pom.xml来组织各种依赖。</p> <h4 id="_5-spring-boot-cli"><a href="#_5-spring-boot-cli" class="header-anchor">#</a> 5) spring-boot-cli</h4> <p>Spring Boot CLI是一个命令行工具，如果您想使用Spring快速开发，可以使用它。它允许您运行Groovy脚本，这意味着您有一个熟悉的类似Java的语法，而没有那么多样板代码。您还可以引导一个新项目或编写自己的命令。</p> <h4 id="_6-spring-boot-actuator"><a href="#_6-spring-boot-actuator" class="header-anchor">#</a> 6) spring-boot-actuator</h4> <p>这个跟SpringBoot的监控有关，也是SpringBoot的新特性之一。可以通过HTTP端点或JMX等来管理和监控应用。审计、运行状况和度量收集可以自动应用到应用程序。这个监控模块是开箱即用的，提供了一系列端点包括<code>HealthEndpoint</code>, <code>EnvironmentEndpoint</code>和<code>BeansEndpoint</code>等端点。</p> <h4 id="_7-spring-boot-actuator-autoconfigure"><a href="#_7-spring-boot-actuator-autoconfigure" class="header-anchor">#</a> 7) spring-boot-actuator-autoconfigure</h4> <p>这个模块为监控模块提供自动配置的功能，通常也是根据类路径来进行配置。比如<code>Micrometer</code>存在于类路径中，那么将会自动配置<code>MetricsEndpoint</code>。</p> <h4 id="_8-spring-boot-test"><a href="#_8-spring-boot-test" class="header-anchor">#</a> 8) spring-boot-test</h4> <p>这个模式是spring-boot的跟测试有关的模块，包含了一些帮助我们测试的核心类和注解（比如<code>@SpringBootTest</code>）。</p> <h4 id="_9-spring-boot-dependencies"><a href="#_9-spring-boot-dependencies" class="header-anchor">#</a> 9) spring-boot-dependencies</h4> <p>这个模块也没有代码，主要是定义了一些SpringBoot的maven相关的一些依赖及其版本。</p> <h4 id="_10-spring-boot-devtools"><a href="#_10-spring-boot-devtools" class="header-anchor">#</a> 10) spring-boot-devtools</h4> <p>这个模块跟SpringBoot的热部署有关，即修改代码后无需重启应用即生效。</p> <h4 id="_11-spring-boot-docs"><a href="#_11-spring-boot-docs" class="header-anchor">#</a> 11) spring-boot-docs</h4> <p>这个模块应该是跟文档相关的模块。</p> <h4 id="_12-spring-boot-properties-migrator"><a href="#_12-spring-boot-properties-migrator" class="header-anchor">#</a> 12) spring-boot-properties-migrator</h4> <p>看到 migrator 这个单词，估计就是跟项目迁移有关，没有去细 究。</p> <h4 id="_13-spring-boot-test-autoconfigure"><a href="#_13-spring-boot-test-autoconfigure" class="header-anchor">#</a> 13) spring-boot-test-autoconfigure</h4> <p>这个模块一看就是跟SpringBoot的测试的自动配置有关。</p> <h4 id="_14-spring-boot-tools"><a href="#_14-spring-boot-tools" class="header-anchor">#</a> 14) spring-boot-tools</h4> <p>这个模块一看就是SpringBoot的工具相关的模块，提供了加载，maven插件,metadata和后置处理相关的支持。</p> <p>上面介绍了这么多spring-boot模块下的子模块，不用慌，我们要进行解读的模块不多，我们真正要看的模块有<code>spring-boot</code>，<code>spring-boot-autoconfigure</code>，<code>spring-boot-starters</code>和<code>spring-boot-actuator</code>模块。</p> <h2 id="_4-用一个思维导图来总结下springboot源码项目的脉络"><a href="#_4-用一个思维导图来总结下springboot源码项目的脉络" class="header-anchor">#</a> 4 用一个思维导图来总结下SpringBoot源码项目的脉络</h2> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/be3a9ea21dc33532c5a2e46ffcd73c6f.webp" alt="img"></p> <h2 id="_5-springboot模块之间的pom关系详解"><a href="#_5-springboot模块之间的pom关系详解" class="header-anchor">#</a> 5 SpringBoot模块之间的pom关系详解</h2> <p>前面弄清楚了SpringBoot的各个模块的具体功能，此时我们来看下SpringBoot模块的pom之间的关系是怎样的，因为项目是通过maven构建的，因此还是有必要去研究下这块关系滴。</p> <p>先看SpringBoot源码项目的pom关系，如下图：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/75dec7fcb47b1492794b1a38e176a79c.webp" alt="img"> 根据上图可得出以下结论：</p> <ul><li><code>spring-boot-build(pom.xml)</code>是项目的根pom，其子pom有<code>spring-boot-project(pom.xml)</code>和<code>spring-boot-dependencies(pom.xml)</code>；</li> <li><code>spring-boot-dependencies(pom.xml)</code>主要定义了SpringBoot项目的各种依赖及其版本，其子pom有<code>spring-boot-parent(pom.xml)</code>和<code>spring-boot-starter-parent(pom.xml)</code>；</li> <li><code>spring-boot-project(pom.xml)</code>起到聚合module的作用，其子模块并不继承于它，而是继承于<code>spring-boot-parent(pom.xml)</code>；</li> <li><code>spring-boot-parent(pom.xml)</code>是<code>spring-boot-project(pom.xml)</code>的子module，但继承的父pom为<code>spring-boot-dependencies(pom.xml)</code>，其定义了一些properties等相关的东西。其子pom为<code>spring-boot-project(pom.xml)</code>的子module（注意除去<code>spring-boot-dependencies(pom.xml)</code>），比如有<code>spring-boot(pom.xml)</code>,<code>spring-boot-starters(pom.xml)</code>和<code>spring-boot-actuator(pom.xml)</code>等；</li> <li><code>spring-boot-starters(pom.xml)</code>是所有具体起步依赖的父pom，其子pom有<code>spring-boot-starter-data-jdbc(pom.xml)</code>和<code>spring-boot-starter-data-redis(pom.xml)</code>等。</li> <li><code>spring-boot-starter-parent(pom.xml)</code>，是我们的所有具体SpringBoot项目的父pom，比如SpringBoot自带的样例的<code>spring-boot-samples(pom.xml)</code>是继承于它的。</li></ul> <p>SpringBoot的各模块之间的pom关系有点复杂，确实有点绕，如果看完上面的图片和解释还是不太清楚的话，建议小伙伴们自己打开idea的项目，逐个去捋一下。总之记得SpringBoot的一些父pom无非是做了一些版本管理，聚合模块之间的事情。</p> <h2 id="_6-小结"><a href="#_6-小结" class="header-anchor">#</a> 6 小结</h2> <p>好了，前面已经把SpringBoot源码项目的各个模块的功能和模块pom之间的关系给捋清楚了，总之刚开始分析项目源码，有一个整体的大局观很重要。</p> <p>本来下节想先写SpringBoot的启动流程分析的，但由于之前研究过启动流程，所以就把启动流程分析放后点写了。下一节先对SpringBoot的新特性--自动配置的源码撸起来，因此下一节让我们先来揭开SpringBoot自动配置背后神秘的面纱吧，嘿嘿🤭。</p> <p><strong>下节预告</strong>： SpringBoot自动配置的相关原理搞起来</p> <p><strong>原创不易，帮忙点个赞呗！</strong></p> <p>参考：</p> <ul><li>https://github.com/spring-projects/spring-boot/tree/v2.1.0.RELEASE</li> <li>https://docs.spring.io/spring-boot/docs/1.5.2.RELEASE/reference/htmlsingle/#cli</li></ul></div></div>  <div class="page-edit"><div class="edit-link"><a href="https://github.com/lixuanfengs/cactus-vuepress-sc/edit/master/docs/07.后端/110.阅读源码系列/10.Spring Boot/02.如何分析SpringBoot源码模块及结构？.md" target="_blank" rel="noopener noreferrer">编辑</a
