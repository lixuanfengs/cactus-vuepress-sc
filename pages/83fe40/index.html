		<span class="token keyword">return</span> <span class="token class-name">ConditionOutcome</span><span class="token punctuation">.</span><span class="token function">match</span><span class="token punctuation">(</span>matchMessage<span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br><span class="line-number">47</span><br><span class="line-number">48</span><br><span class="line-number">49</span><br><span class="line-number">50</span><br><span class="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br><span class="line-number">62</span><br><span class="line-number">63</span><br></div></div><p>我们可以看到<code>OnBeanCondition</code>类覆盖的<code>getMatchOutcome</code>方法分别处理了标注<code>@ConditionalOnBean</code>,<code>@ConditionalOnSingleCandidate</code>和<code>@ConditionalOnMissingBean</code>注解的情况，分别对应上面代码注释的<code>(1)</code>,<code>(2)</code>和<code>(3)</code>处。</p> <p>现在我们只看针对<code>@ConditionalOnBean</code>注解的处理逻辑，从上面代码中可以看到若配置类（metadata）标注<code>@ConditionalOnBean</code>注解的话，主要做了以下事情：</p> <ol><li>将该注解属性提取出来封装进<code>BeanSearchSpec</code>对象中;</li> <li>然后调用<code>getMatchingBeans(context, spec)</code>方法来获取是否有匹配的<code>bean</code>；</li> <li>最后返回<code>bean</code>的匹配情况；</li></ol> <p>可以看到最重要的逻辑是第 2 步，那么我们再来看下<code>getMatchingBeans</code>方法，直接上代码：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">protected</span> <span class="token keyword">final</span> <span class="token class-name">MatchResult</span> <span class="token function">getMatchingBeans</span><span class="token punctuation">(</span><span class="token class-name">ConditionContext</span> context<span class="token punctuation">,</span>
			<span class="token class-name">BeanSearchSpec</span> beans<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token comment">// 获得Spring容器的beanFactory</span>
		<span class="token class-name">ConfigurableListableBeanFactory</span> beanFactory <span class="token operator">=</span> context<span class="token punctuation">.</span><span class="token function">getBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token comment">// 判断bean的搜索策略是否是SearchStrategy.ANCESTORS策略</span>
		<span class="token keyword">if</span> <span class="token punctuation">(</span>beans<span class="token punctuation">.</span><span class="token function">getStrategy</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token class-name">SearchStrategy</span><span class="token punctuation">.</span><span class="token constant">ANCESTORS</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token class-name">BeanFactory</span> parent <span class="token operator">=</span> beanFactory<span class="token punctuation">.</span><span class="token function">getParentBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token class-name">Assert</span><span class="token punctuation">.</span><span class="token function">isInstanceOf</span><span class="token punctuation">(</span><span class="token class-name">ConfigurableListableBeanFactory</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> parent<span class="token punctuation">,</span>
					<span class="token string">&quot;Unable to use SearchStrategy.PARENTS&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
			beanFactory <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">ConfigurableListableBeanFactory</span><span class="token punctuation">)</span> parent<span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
		<span class="token comment">// MatchResult用来存储bean的匹配结果</span>
		<span class="token class-name">MatchResult</span> matchResult <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">MatchResult</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token comment">// 如果bean的搜索策略不是SearchStrategy.CURRENT的话，则置considerHierarchy为true</span>
		<span class="token keyword">boolean</span> considerHierarchy <span class="token operator">=</span> beans<span class="token punctuation">.</span><span class="token function">getStrategy</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token class-name">SearchStrategy</span><span class="token punctuation">.</span><span class="token constant">CURRENT</span><span class="token punctuation">;</span>
		<span class="token comment">// 获取TypeExtractor，TypeExtractor是用来判断bean的类型的</span>
		<span class="token class-name">TypeExtractor</span> typeExtractor <span class="token operator">=</span> beans<span class="token punctuation">.</span><span class="token function">getTypeExtractor</span><span class="token punctuation">(</span>context<span class="token punctuation">.</span><span class="token function">getClassLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token comment">// 获取是否有被忽略bean类型，若有的话将该bean类型的名称装进beansIgnoredByType集合</span>
		<span class="token comment">// 这里主要是针对@ConditionalOnMissingBean的ignored属性</span>
		<span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> beansIgnoredByType <span class="token operator">=</span> <span class="token function">getNamesOfBeansIgnoredByType</span><span class="token punctuation">(</span>
				beans<span class="token punctuation">.</span><span class="token function">getIgnoredTypes</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> typeExtractor<span class="token punctuation">,</span> beanFactory<span class="token punctuation">,</span> context<span class="token punctuation">,</span>
				considerHierarchy<span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token comment">// 遍历bean的所有类型</span>
		<span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token class-name">String</span> type <span class="token operator">:</span> beans<span class="token punctuation">.</span><span class="token function">getTypes</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token comment">// 调用getBeanNamesForType方法根据bean类型得到所有符合条件的bean类型，并放到typeMatches集合</span>
			<span class="token class-name">Collection</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> typeMatches <span class="token operator">=</span> <span class="token function">getBeanNamesForType</span><span class="token punctuation">(</span>beanFactory<span class="token punctuation">,</span> type<span class="token punctuation">,</span>
					typeExtractor<span class="token punctuation">,</span> context<span class="token punctuation">.</span><span class="token function">getClassLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> considerHierarchy<span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token comment">// 移除掉Ignored的类型</span>
			typeMatches<span class="token punctuation">.</span><span class="token function">removeAll</span><span class="token punctuation">(</span>beansIgnoredByType<span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token comment">// 若typeMatches为空，那么则说明正在遍历的这个type类型不符合匹配条件，此时用matchResult记录一下这个不符合条件的类型</span>
			<span class="token keyword">if</span> <span class="token punctuation">(</span>typeMatches<span class="token punctuation">.</span><span class="token function">isEmpty</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
				matchResult<span class="token punctuation">.</span><span class="token function">recordUnmatchedType</span><span class="token punctuation">(</span>type<span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token punctuation">}</span>
			<span class="token comment">// 若typeMatches不为空，那么则说明正在遍历的这个type类型符合匹配条件，此时用matchResult记录一下这个符合条件的类型</span>
			<span class="token keyword">else</span> <span class="token punctuation">{</span>
				matchResult<span class="token punctuation">.</span><span class="token function">recordMatchedType</span><span class="token punctuation">(</span>type<span class="token punctuation">,</span> typeMatches<span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token punctuation">}</span>
		<span class="token punctuation">}</span>
		<span class="token comment">// 这里针对@ConditionalOnBean等注解的annotation属性的处理</span>
		<span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token class-name">String</span> annotation <span class="token operator">:</span> beans<span class="token punctuation">.</span><span class="token function">getAnnotations</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> annotationMatches <span class="token operator">=</span> <span class="token class-name">Arrays</span>
					<span class="token punctuation">.</span><span class="token function">asList</span><span class="token punctuation">(</span><span class="token function">getBeanNamesForAnnotation</span><span class="token punctuation">(</span>beanFactory<span class="token punctuation">,</span> annotation<span class="token punctuation">,</span>
							context<span class="token punctuation">.</span><span class="token function">getClassLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> considerHierarchy<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
			annotationMatches<span class="token punctuation">.</span><span class="token function">removeAll</span><span class="token punctuation">(</span>beansIgnoredByType<span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token keyword">if</span> <span class="token punctuation">(</span>annotationMatches<span class="token punctuation">.</span><span class="token function">isEmpty</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
				matchResult<span class="token punctuation">.</span><span class="token function">recordUnmatchedAnnotation</span><span class="token punctuation">(</span>annotation<span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token punctuation">}</span>
			<span class="token keyword">else</span> <span class="token punctuation">{</span>
				matchResult<span class="token punctuation">.</span><span class="token function">recordMatchedAnnotation</span><span class="token punctuation">(</span>annotation<span class="token punctuation">,</span> annotationMatches<span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token punctuation">}</span>
		<span class="token punctuation">}</span>
		<span class="token comment">// 这里针对@ConditionalOnBean等注解的name属性的处理</span>
		<span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token class-name">String</span> beanName <span class="token operator">:</span> beans<span class="token punctuation">.</span><span class="token function">getNames</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token comment">// beansIgnoredByType集合不包含beanName且beanFactory包含这个bean，则匹配</span>
			<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>beansIgnoredByType<span class="token punctuation">.</span><span class="token function">contains</span><span class="token punctuation">(</span>beanName<span class="token punctuation">)</span>
					<span class="token operator">&amp;&amp;</span> <span class="token function">containsBean</span><span class="token punctuation">(</span>beanFactory<span class="token punctuation">,</span> beanName<span class="token punctuation">,</span> considerHierarchy<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
				matchResult<span class="token punctuation">.</span><span class="token function">recordMatchedName</span><span class="token punctuation">(</span>beanName<span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token punctuation">}</span>
			<span class="token comment">// 否则，不匹配</span>
			<span class="token keyword">else</span> <span class="token punctuation">{</span>
				matchResult<span class="token punctuation">.</span><span class="token function">recordUnmatchedName</span><span class="token punctuation">(</span>beanName<span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token punctuation">}</span>
		<span class="token punctuation">}</span>
		<span class="token comment">// 最后返回匹配结果</span>
		<span class="token keyword">return</span> matchResult<span class="token punctuation">;</span>
	<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br><span class="line-number">47</span><br><span class="line-number">48</span><br><span class="line-number">49</span><br><span class="line-number">50</span><br><span class="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br><span class="line-number">62</span><br><span class="line-number">63</span><br><span class="line-number">64</span><br><span class="line-number">65</span><br><span class="line-number">66</span><br></div></div><p>上面的逻辑主要是从 spring 容器中搜索有无指定条件的<code>bean</code>，搜索 Spring 容器搜索 bean 的话有三种搜索策略，分别是<code>CURRENT</code>,<code>ANCESTORS</code>和<code>ALL</code>，分表表示只从当前的<code>context</code>中搜索<code>bean</code>，只从父<code>context</code>中搜索<code>bean</code>和从整个<code>context</code>中搜索<code>bean</code>；定义了搜索策略后，然后再根据<code>BeanSearchSpec</code>对象封装的注解属性分别取指定的容器中查找有无符合条件的<code>bean</code>，然后再进行一些过滤。比如<code>@ConditionalOnMissingBean</code>注解有定义<code>ignored</code>属性值，那么从容器中搜索到有符合条件的<code>bean</code>时，此时还要移除掉<code>ignored</code>指定的<code>bean</code>。</p> <p>好了，上面就已经分析了<code>OnBeanCondition</code>这个条件类了，我们坚持主线优先的原则，具体的细节代码不会深究。</p> <h3 id="_4-3-onwebapplicationcondition"><a href="#_4-3-onwebapplicationcondition" class="header-anchor">#</a> 4.3 OnWebApplicationCondition</h3> <p><code>OnWebApplicationCondition</code>同样继承了<code>FilteringSpringBootCondition</code>父类，覆盖了父类<code>FilteringSpringBootCondition</code>的<code>getOutcomes</code>方法。而<code>FilteringSpringBootCondition</code>又是<code>SpringBootCondition</code>的子类，<code>FilteringSpringBootCondition</code>跟自动配置类过滤有关，这里先不分析。<strong>值得注意的是</strong><code>**OnWebApplicationCondition**</code><strong>同样重写了</strong><code>**SpringBootCondition**</code><strong>的</strong><code>**getMatchOutcome**</code><strong>方法</strong>，用来判断当前应用是否 web 应用。同时是<code>OnWebApplicationCondition</code>是<code>@ConditionalOnWebApplication</code>的条件类。</p> <p>同样，先来看<code>OnWebApplicationCondition</code>重写<code>SpringBootCondition</code>的<code>getMatchOutcome</code>方法：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token class-name">ConditionOutcome</span> <span class="token function">getMatchOutcome</span><span class="token punctuation">(</span><span class="token class-name">ConditionContext</span> context<span class="token punctuation">,</span>
			<span class="token class-name">AnnotatedTypeMetadata</span> metadata<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token comment">// 配置类是否标注有@ConditionalOnWebApplication注解</span>
		<span class="token keyword">boolean</span> required <span class="token operator">=</span> metadata
				<span class="token punctuation">.</span><span class="token function">isAnnotated</span><span class="token punctuation">(</span><span class="token class-name">ConditionalOnWebApplication</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token comment">// 调用isWebApplication方法返回匹配结果</span>
		<span class="token class-name">ConditionOutcome</span> outcome <span class="token operator">=</span> <span class="token function">isWebApplication</span><span class="token punctuation">(</span>context<span class="token punctuation">,</span> metadata<span class="token punctuation">,</span> required<span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token comment">// 若有标注@ConditionalOnWebApplication但不符合条件，则返回不匹配</span>
		<span class="token keyword">if</span> <span class="token punctuation">(</span>required <span class="token operator">&amp;&amp;</span> <span class="token operator">!</span>outcome<span class="token punctuation">.</span><span class="token function">isMatch</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> <span class="token class-name">ConditionOutcome</span><span class="token punctuation">.</span><span class="token function">noMatch</span><span class="token punctuation">(</span>outcome<span class="token punctuation">.</span><span class="token function">getConditionMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
		<span class="token comment">// 若没有标注@ConditionalOnWebApplication但符合条件，则返回不匹配</span>
		<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>required <span class="token operator">&amp;&amp;</span> outcome<span class="token punctuation">.</span><span class="token function">isMatch</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> <span class="token class-name">ConditionOutcome</span><span class="token punctuation">.</span><span class="token function">noMatch</span><span class="token punctuation">(</span>outcome<span class="token punctuation">.</span><span class="token function">getConditionMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
		<span class="token comment">// 这里返回匹配的情况，TODO 不过有个疑问：如果没有标注@ConditionalOnWebApplication注解，又不符合条件的话，也会执行到这里，返回匹配？</span>
		<span class="token keyword">return</span> <span class="token class-name">ConditionOutcome</span><span class="token punctuation">.</span><span class="token function">match</span><span class="token punctuation">(</span>outcome<span class="token punctuation">.</span><span class="token function">getConditionMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br></div></div><p>上面代码的逻辑很简单，主要是调用<code>isWebApplication</code>方法来判断当前应用是否是 web 应用。因此，我们再来看下<code>isWebApplication</code>方法:</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">private</span> <span class="token class-name">ConditionOutcome</span> <span class="token function">isWebApplication</span><span class="token punctuation">(</span><span class="token class-name">ConditionContext</span> context<span class="token punctuation">,</span>
			<span class="token class-name">AnnotatedTypeMetadata</span> metadata<span class="token punctuation">,</span> <span class="token keyword">boolean</span> required<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token comment">// 调用deduceType方法判断是哪种类型，其中有SERVLET，REACTIVE和ANY类型，其中ANY表示了SERVLET或REACTIVE类型</span>
		<span class="token keyword">switch</span> <span class="token punctuation">(</span><span class="token function">deduceType</span><span class="token punctuation">(</span>metadata<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token comment">// SERVLET类型</span>
		<span class="token keyword">case</span> <span class="token constant">SERVLET</span><span class="token operator">:</span>
			<span class="token keyword">return</span> <span class="token function">isServletWebApplication</span><span class="token punctuation">(</span>context<span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token comment">// REACTIVE类型</span>
		<span class="token keyword">case</span> <span class="token constant">REACTIVE</span><span class="token operator">:</span>
			<span class="token keyword">return</span> <span class="token function">isReactiveWebApplication</span><span class="token punctuation">(</span>context<span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token keyword">default</span><span class="token operator">:</span>
			<span class="token keyword">return</span> <span class="token function">isAnyWebApplication</span><span class="token punctuation">(</span>context<span class="token punctuation">,</span> required<span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>在<code>isWebApplication</code>方法中，首先从<code>@ConditionalOnWebApplication</code>注解中获取其定义了什么类型，然后根据不同的类型进入不同的判断逻辑。这里我们只看下<code>SERVLET</code>的情况判断处理，看代码：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">private</span> <span class="token class-name">ConditionOutcome</span> <span class="token function">isServletWebApplication</span><span class="token punctuation">(</span><span class="token class-name">ConditionContext</span> context<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token class-name">ConditionMessage<span class="token punctuation">.</span>Builder</span> message <span class="token operator">=</span> <span class="token class-name">ConditionMessage</span><span class="token punctuation">.</span><span class="token function">forCondition</span><span class="token punctuation">(</span><span class="token string">&quot;&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token comment">// 若classpath中不存在org.springframework.web.context.support.GenericWebApplicationContext.class，则返回不匹配</span>
		<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span><span class="token class-name">ClassNameFilter</span><span class="token punctuation">.</span><span class="token function">isPresent</span><span class="token punctuation">(</span><span class="token constant">SERVLET_WEB_APPLICATION_CLASS</span><span class="token punctuation">,</span>
				context<span class="token punctuation">.</span><span class="token function">getClassLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> <span class="token class-name">ConditionOutcome</span><span class="token punctuation">.</span><span class="token function">noMatch</span><span class="token punctuation">(</span>
					message<span class="token punctuation">.</span><span class="token function">didNotFind</span><span class="token punctuation">(</span><span class="token string">&quot;servlet web application classes&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">atAll</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
		<span class="token comment">// 若classpath中存在org.springframework.web.context.support.GenericWebApplicationContext.class，那么又分为以下几种匹配的情况</span>
		<span class="token comment">// session</span>
		<span class="token keyword">if</span> <span class="token punctuation">(</span>context<span class="token punctuation">.</span><span class="token function">getBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token keyword">null</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> scopes <span class="token operator">=</span> context<span class="token punctuation">.</span><span class="token function">getBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getRegisteredScopeNames</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token class-name">ObjectUtils</span><span class="token punctuation">.</span><span class="token function">containsElement</span><span class="token punctuation">(</span>scopes<span class="token punctuation">,</span> <span class="token string">&quot;session&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
				<span class="token keyword">return</span> <span class="token class-name">ConditionOutcome</span><span class="token punctuation">.</span><span class="token function">match</span><span class="token punctuation">(</span>message<span class="token punctuation">.</span><span class="token function">foundExactly</span><span class="token punctuation">(</span><span class="token string">&quot;'session' scope&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token punctuation">}</span>
		<span class="token punctuation">}</span>
		<span class="token comment">// ConfigurableWebEnvironment</span>
		<span class="token keyword">if</span> <span class="token punctuation">(</span>context<span class="token punctuation">.</span><span class="token function">getEnvironment</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">instanceof</span> <span class="token class-name">ConfigurableWebEnvironment</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> <span class="token class-name">ConditionOutcome</span>
					<span class="token punctuation">.</span><span class="token function">match</span><span class="token punctuation">(</span>message<span class="token punctuation">.</span><span class="token function">foundExactly</span><span class="token punctuation">(</span><span class="token string">&quot;ConfigurableWebEnvironment&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
		<span class="token comment">// WebApplicationContext</span>
		<span class="token keyword">if</span> <span class="token punctuation">(</span>context<span class="token punctuation">.</span><span class="token function">getResourceLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">instanceof</span> <span class="token class-name">WebApplicationContext</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> <span class="token class-name">ConditionOutcome</span><span class="token punctuation">.</span><span class="token function">match</span><span class="token punctuation">(</span>message<span class="token punctuation">.</span><span class="token function">foundExactly</span><span class="token punctuation">(</span><span class="token string">&quot;WebApplicationContext&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
		<span class="token comment">// 若以上三种都不匹配的话，则说明不是一个servlet web application</span>
		<span class="token keyword">return</span> <span class="token class-name">ConditionOutcome</span><span class="token punctuation">.</span><span class="token function">noMatch</span><span class="token punctuation">(</span>message<span class="token punctuation">.</span><span class="token function">because</span><span class="token punctuation">(</span><span class="token string">&quot;not a servlet web application&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br></div></div><p>对于是<code>SERVLET</code>的情况，首先根据<code>classpath</code>中是否存在<code>org.springframework.web.context.support.GenericWebApplicationContext.class</code>，如果不存在该类，则直接返回不匹配；若存在的话那么又分为以下几种匹配的情况：</p> <ul><li>session</li> <li>ConfigurableWebEnvironment</li> <li>WebApplicationContext</li></ul> <p>若上面三种情况都不匹配，则说明不是一个 servlet web application。</p> <h3 id="_4-4-其他"><a href="#_4-4-其他" class="header-anchor">#</a> 4.4 其他</h3> <p>由于 springboot 的<code>OnXXXCondition</code>类实现太多，不可能每个条件类都分析一遍，因此上面只分析了<code>OnResourceCondition</code>,<code>OnBeanCondition</code>和<code>onWebApplicationCondition</code>的源码。我们分析源码不可能把所有代码都通读一遍的，阅读源码的话，只要理解了某个模块的类之间的关系及挑几个有代表性的类分析下就行，不可能一网打尽。</p> <p>若有时间的话，推荐看下几个我们常用的条件类的源码：<code>OnPropertyCondition</code>,<code>OnClassCondition</code>和<code>OnExpressionCondition</code>等。</p> <h2 id="_5-如何扩展-springbootcondition"><a href="#_5-如何扩展-springbootcondition" class="header-anchor">#</a> 5 如何扩展 SpringBootCondition</h2> <p>前文我们知道了如何扩展 Spring 的<code>Condition</code>接口，那么我们该如何扩展 SpringBoot 的<code>SpringBootCondition</code>类呢？</p> <p>推荐阅读<a href="https://link.juejin.cn?target=https%3A%2F%2Fblog.csdn.net%2Fzhanglu1236789%2Farticle%2Fdetails%2F78999496" target="_blank" rel="noopener noreferrer">springboot 之使用 SpringBootCondition<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>获得答案</p> <p>好了，本篇文章是 SpringBoot 自动配置源码分析的前置文章，这里分析了条件注解源码，那么下篇文章我们就来看看 SpringBoot 自动配置的源码了。</p></div></div>  <div class="page-edit"><div class="edit-link"><a href="https://github.com/lixuanfengs/cactus-vuepress-sc/edit/master/docs/07.后端/110.阅读源码系列/10.Spring Boot/03.SpringBoot自动配置的条件注解原理.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2023/09/28, 17:04:39</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/579f6f/" class="page
