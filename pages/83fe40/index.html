前言</a></li><li class="sidebar-sub-header level2"><a href="/pages/83fe40/#_2-springboot-的派生条件注解" class="sidebar-link">2 SpringBoot 的派生条件注解</a></li><li class="sidebar-sub-header level2"><a href="/pages/83fe40/#_3-condition-接口" class="sidebar-link">3 Condition 接口</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level3"><a href="/pages/83fe40/#_3-1-condition-接口源码分析" class="sidebar-link">3.1 Condition 接口源码分析</a></li><li class="sidebar-sub-header level3"><a href="/pages/83fe40/#_3-2-spring-的内置-condition-接口实现类" class="sidebar-link">3.2 Spring 的内置 Condition 接口实现类</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/pages/83fe40/#_4-springbootcondition-源码解析" class="sidebar-link">4 SpringBootCondition 源码解析</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level3"><a href="/pages/83fe40/#_4-1-onresourcecondition-源码分析" class="sidebar-link">4.1 OnResourceCondition 源码分析</a></li><li class="sidebar-sub-header level3"><a href="/pages/83fe40/#_4-2-onbeancondition-源码分析" class="sidebar-link">4.2 OnBeanCondition 源码分析</a></li><li class="sidebar-sub-header level3"><a href="/pages/83fe40/#_4-3-onwebapplicationcondition" class="sidebar-link">4.3 OnWebApplicationCondition</a></li><li class="sidebar-sub-header level3"><a href="/pages/83fe40/#_4-4-其他" class="sidebar-link">4.4 其他</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/pages/83fe40/#_5-如何扩展-springbootcondition" class="sidebar-link">5 如何扩展 SpringBootCondition</a></li></ul></li><li><a href="/pages/09cee0/" class="sidebar-link">SpringBoot是如何实现自动配置的？</a></li><li><a href="/pages/04160a/" class="sidebar-link">SpringBoot的配置属性值是如何绑定的？</a></li><li><a href="/pages/a30d58/" class="sidebar-link">SpringBoot内置的各种Starter是怎样构建的？</a></li><li><a href="/pages/0dbcc9/" class="sidebar-link">SpringBoot的启动流程是怎样的？</a></li><li><a href="/pages/6a857a/" class="sidebar-link">SpringApplication对象是如何构建的？</a></li><li><a href="/pages/c9edcd/" class="sidebar-link">SpringBoot事件监听机制</a></li><li><a href="/pages/d23c3e/" class="sidebar-link">SpringBoot内置生命周期事件详解</a></li></ul></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Netty</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Dubbo</span> <span class="arrow right"></span></p> <!----></section></li></ul></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/Java/#后端" data-v-06225672>后端</a></li><li data-v-06225672><a href="/Java/#阅读源码系列" data-v-06225672>阅读源码系列</a></li><li data-v-06225672><a href="/Java/#Spring Boot" data-v-06225672>Spring Boot</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2022-05-11</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->SpringBoot自动配置的条件注解原理<!----></h1>  <div class="theme-vdoing-content content__default"><p><strong>注：该源码分析对应 SpringBoot 版本为 2.1.0.RELEASE</strong></p> <h2 id="_1-前言"><a href="#_1-前言" class="header-anchor">#</a> 1 前言</h2> <p>上一篇，我们分析了 SpringBoot 源码结构及各个模块 pom 之间的关系后，那么此篇开始就开始解开 SpringBoot 新特性之一--自动配置的神秘面纱了。因为 SpringBoot 自动配置原理是基于其大量的条件注解<code>ConditionalOnXXX</code>，因此，本节我们先来撸下 Spring 的条件注解的相关源码。</p> <h2 id="_2-springboot-的派生条件注解"><a href="#_2-springboot-的派生条件注解" class="header-anchor">#</a> 2 SpringBoot 的派生条件注解</h2> <p>我们都知道，SpringBoot 自动配置是需要满足相应的条件才会自动配置,因此 SpringBoot 的自动配置大量应用了条件注解<code>ConditionalOnXXX</code>。如下图：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/8fdfd087d7cca7b4afa76c9dfbd7eb89.webp" alt="img"></p> <p>那么上图的条件注解如何使用呢？</p> <p>举个栗子，我们来看下如何使用<code>@ConditionalOnClass</code>和<code>@ConditionalOnProperty</code>这两个注解，先看下图代码：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/cb096774a5442a8d25099818928221dd.webp" alt="img"> <code>HelloWorldEnableAutoConfiguration</code>这个自动配置类应用了<code>@ConditionalOnClass</code>和<code>ConditionalOnProperty</code>两个条件注解，那么只有在满足:<code>classpath</code>中存在<code>HelloWorldComponent.class</code>和配置了<code>hello.world.name</code>和<code>hello.world.age</code>属性<strong>这两个条件</strong>的情况下才会创建<code>HelloWorldComponent</code>这个<code>bean</code>。</p> <p>其实 SpringBoot 的<code>@ConditionalOnXXX</code>等条件注解都是派生注解，那么什么是派生注解呢？ 就拿上面的栗子来说，以<code>@ConditionalOnClass(HelloWorldComponent.class)</code>为例，我们打开<code>ConditionalOnClass</code>注解源码，如下：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Target</span><span class="token punctuation">(</span><span class="token punctuation">{</span>
    <span class="token class-name">ElementType</span><span class="token punctuation">.</span><span class="token constant">TYPE</span><span class="token punctuation">,</span>
    <span class="token class-name">ElementType</span><span class="token punctuation">.</span><span class="token constant">METHOD</span>
<span class="token punctuation">}</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@Retention</span><span class="token punctuation">(</span><span class="token class-name">RetentionPolicy</span><span class="token punctuation">.</span><span class="token constant">RUNTIME</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@Documented</span>
<span class="token annotation punctuation">@Conditional</span><span class="token punctuation">(</span><span class="token class-name">OnClassCondition</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token annotation punctuation">@interface</span> <span class="token class-name">ConditionalOnClass</span> <span class="token punctuation">{</span>
    <span class="token class-name">Class</span> <span class="token operator">&lt;</span><span class="token generics"><span class="token punctuation">&lt;</span> <span class="token operator">?</span> <span class="token punctuation">&gt;</span></span> <span class="token punctuation">[</span><span class="token punctuation">]</span> <span class="token function">value</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">default</span> <span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">;</span>
    <span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> <span class="token function">name</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">default</span> <span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>可以看到<code>@ConditionalOnClass</code>注解上面又标注了<code>@Conditional(OnClassCondition.class)</code>注解，因此<code>@ConditionalOnClass</code>是<code>@Conditional</code>的派生注解，<code>@Conditional(OnClassCondition.class)</code>和<code>@ConditionalOnClass</code>注解是等价的，即这两个注解标注在某个配置类上的效果是等价的。</p> <p>而 SpringBoot 的自动配置原理正是建立在这些大量的派生条件注解<code>@ConditionalOnXXX</code>之上，而这些条件注解的原理跟 Spring 的 <code>Condition</code> 接口有关。因此我们先来研究下 <code>Condition</code> 接口的相关源码。</p> <h2 id="_3-condition-接口"><a href="#_3-condition-接口" class="header-anchor">#</a> 3 Condition 接口</h2> <h3 id="_3-1-condition-接口源码分析"><a href="#_3-1-condition-接口源码分析" class="header-anchor">#</a> 3.1 Condition 接口源码分析</h3> <p>分析 <code>Condition</code> 接口源码前先看下如何自定义<code>ConditionalOnXXX</code>注解,举个栗子，比如自定义一个<code>@ConditionalOnLinux</code>注解，该注解只有在其属性<code>environment</code>是&quot;linux&quot;才会创建相关的 bean。定义了以下代码：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">/**
 * 实现spring 的Condition接口，并且重写matches()方法，如果@ConditionalOnLinux的注解属性environment是linux就返回true
 *
 */</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">LinuxCondition</span> <span class="token keyword">implements</span> <span class="token class-name">Condition</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">boolean</span> <span class="token function">matches</span><span class="token punctuation">(</span><span class="token class-name">ConditionContext</span> context<span class="token punctuation">,</span> <span class="token class-name">AnnotatedTypeMetadata</span> metadata<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token comment">// 获得注解@ConditionalOnLinux的所有属性</span>
        <span class="token class-name">List</span> <span class="token generics"><span class="token punctuation">&lt;</span> <span class="token class-name">AnnotationAttributes</span> <span class="token punctuation">&gt;</span></span> allAnnotationAttributes <span class="token operator">=</span> <span class="token function">annotationAttributesFromMultiValueMap</span><span class="token punctuation">(</span>
            metadata<span class="token punctuation">.</span><span class="token function">getAllAnnotationAttributes</span><span class="token punctuation">(</span>
                <span class="token class-name">ConditionalOnLinux</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token class-name">AnnotationAttributes</span> annotationAttributes<span class="token operator">:</span> allAnnotationAttributes<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token comment">// 获得注解@ConditionalOnLinux的environment属性</span>
            <span class="token class-name">String</span> environment <span class="token operator">=</span> annotationAttributes<span class="token punctuation">.</span><span class="token function">getString</span><span class="token punctuation">(</span><span class="token string">&quot;environment&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token comment">// 若environment等于linux，则返回true</span>
            <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token string">&quot;linux&quot;</span><span class="token punctuation">.</span><span class="token function">equals</span><span class="token punctuation">(</span>environment<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>

<span class="token annotation punctuation">@Target</span><span class="token punctuation">(</span><span class="token punctuation">{</span>
    <span class="token class-name">ElementType</span><span class="token punctuation">.</span><span class="token constant">TYPE</span><span class="token punctuation">,</span>
    <span class="token class-name">ElementType</span><span class="token punctuation">.</span><span class="token constant">METHOD</span>
<span class="token punctuation">}</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@Retention</span><span class="token punctuation">(</span><span class="token class-name">RetentionPolicy</span><span class="token punctuation">.</span><span class="token constant">RUNTIME</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@Documented</span>
<span class="token annotation punctuation">@Conditional</span><span class="token punctuation">(</span><span class="token class-name">LinuxCondition</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token annotation punctuation">@interface</span> <span class="token class-name">ConditionalOnLinux</span> <span class="token punctuation">{</span>
    <span class="token comment">// 标注是哪个环境</span>
    <span class="token class-name">String</span> <span class="token function">environment</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">default</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">;</span>

<span class="token punctuation">}</span>

<span class="token annotation punctuation">@Configuration</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">ConditionConfig</span> <span class="token punctuation">{</span>
    <span class="token comment">// 只有`@ConditionalOnLinux`的注解属性`environment`是&quot;linux&quot;时才会创建bean</span>
    <span class="token annotation punctuation">@Bean</span>
    <span class="token annotation punctuation">@ConditionalOnLinux</span><span class="token punctuation">(</span>environment <span class="token operator">=</span> <span class="token string">&quot;linux&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">Environment</span> <span class="token function">linuxEnvironment</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">LinuxEnvironment</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br></div></div><p>上面的代码我们捋一下：</p> <ol><li><code>LinuxCondition</code>实现了<code>Condition</code>接口并实现了<code>matches</code>方法，而<code>matches</code>方法则判断<code>@ConditionalOnLinux</code>的注解属性<code>environment</code>是否&quot;linux&quot;，是则返回 true，否则 false。</li> <li>然后我们再定义了一个注解<code>@ConditionalOnLinux</code>，这个注解是<code>@Conditional</code>的派生注解，与<code>@Conditional(LinuxCondition.class)</code>等价，注意<code>@ConditionalOnLinux</code>注解定义了一个属性<code>environment</code>。而我们最终可以利用<code>LinuxCondition</code>的<code>matches</code>方法中的参数<code>AnnotatedTypeMetadata</code>来获取<code>@ConditionalOnLinux</code>的注解属性<code>environment</code>的值，从而用来判断值是否为 linux&quot;。</li> <li>最后我们又定义了一个配置类<code>ConditionConfig</code>，在<code>linuxEnvironment</code>方法上标注了<code>@ConditionalOnLinux(environment = &quot;linux&quot;)</code>。因此，这里只有 <code>LinuxCondition</code>的<code>matches</code>方法返回 true 才会创建<code>bean</code>。</li></ol> <p>学会了如何自定义<code>@ConditionalOnXXX</code>注解后，我们现在再来看下<code>Condition</code>接口的源码：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@FunctionalInterface</span>
<span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">Condition</span> <span class="token punctuation">{</span>
	<span class="token keyword">boolean</span> <span class="token function">matches</span><span class="token punctuation">(</span><span class="token class-name">ConditionContext</span> context<span class="token punctuation">,</span> <span class="token class-name">AnnotatedTypeMetadata</span> metadata<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p><code>Condition</code> 接口主要有一个<code>matches</code>方法，该方法决定了是否要注册相应的<code>bean</code>对象。其中<code>matches</code>方法中有两个参数，参数类型分别是<code>ConditionContext</code>和<code>AnnotatedTypeMetadata</code>，这两个参数非常重要。它们分别用来获取一些环境信息和注解元数据从而用在<code>matches</code>方法中判断是否符合条件。</p> <p><code>ConditionContext</code>，顾名思义，主要是跟<code>Condition</code>的上下文有关，主要用来获取<code>Registry</code>,<code>BeanFactory</code>,<code>Environment</code>,<code>ResourceLoader</code>和<code>ClassLoader</code>等。那么获取这些用来干什么呢？举个栗子，比如<code>OnResourceCondition</code>需要靠<code>ConditionContext</code>来获取<code>ResourceLoader</code>来加载指定资源，<code>OnClassCondition</code>需要靠<code>ConditionContext</code>来获取<code>ClassLoader</code>来加载指定类等，下面看下其源码：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">ConditionContext</span> <span class="token punctuation">{</span>
    <span class="token class-name">BeanDefinitionRegistry</span> <span class="token function">getRegistry</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token annotation punctuation">@Nullable</span>
    <span class="token class-name">ConfigurableListableBeanFactory</span> <span class="token function">getBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Environment</span> <span class="token function">getEnvironment</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">ResourceLoader</span> <span class="token function">getResourceLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token annotation punctuation">@Nullable</span>
    <span class="token class-name">ClassLoader</span> <span class="token function">getClassLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p><code>AnnotatedTypeMetadata</code>，这个跟注解元数据有关，利用<code>AnnotatedTypeMetadata</code>可以拿到某个注解的一些元数据，而这些元数据就包含了某个注解里面的属性，比如前面的栗子，利用<code>AnnotatedTypeMetadata</code>可以拿到<code>@ConditionalOnLinux</code>的注解属性<code>environment</code>的值。下面看下其源码：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">AnnotatedTypeMetadata</span> <span class="token punctuation">{</span>
	<span class="token keyword">boolean</span> <span class="token function">isAnnotated</span><span class="token punctuation">(</span><span class="token class-name">String</span> annotationName<span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> <span class="token function">getAnnotationAttributes</span><span class="token punctuation">(</span><span class="token class-name">String</span> annotationName<span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> <span class="token function">getAnnotationAttributes</span><span class="token punctuation">(</span><span class="token class-name">String</span> annotationName<span class="token punctuation">,</span> <span class="token keyword">boolean</span> classValuesAsString<span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token class-name">MultiValueMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> <span class="token function">getAllAnnotationAttributes</span><span class="token punctuation">(</span><span class="token class-name">String</span> annotationName<span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token class-name">MultiValueMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> <span class="token function">getAllAnnotationAttributes</span><span class="token punctuation">(</span><span class="token class-name">String</span> annotationName<span class="token punctuation">,</span> <span class="token keyword">boolean</span> classValuesAsString<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>回到刚才的栗子，我们知道<code>@ConditionalOnLinux</code>注解真正起作用的是<code>Condition</code>接口的具体实现类<code>LinuxCondition</code>的<code>matches</code>方法，那么这个<code>matches</code>方法是在何时被调用的呢？</p> <p>通过 idea 调试看调用的栈帧，如下图：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/30af5402e293ecdf5f258e1bb0a27da1.webp" alt="img"></p> <p>发现是在<code>ConditionEvaluator</code>的<code>shouldSkip</code>方法中调用了<code>LinuxCondition</code>的<code>matches</code>方法，自然我们再去看看<code>ConditionEvaluator</code>的<code>shouldSkip</code>的方法执行了什么逻辑。</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 这个方法主要是如果是解析阶段则跳过，如果是注册阶段则不跳过</span>
<span class="token keyword">public</span> <span class="token keyword">boolean</span> <span class="token function">shouldSkip</span><span class="token punctuation">(</span><span class="token annotation punctuation">@Nullable</span> <span class="token class-name">AnnotatedTypeMetadata</span> metadata<span class="token punctuation">,</span> <span class="token annotation punctuation">@Nullable</span> <span class="token class-name">ConfigurationPhase</span> phase<span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token comment">// 若没有被@Conditional或其派生注解所标注，则不会跳过</span>
	<span class="token keyword">if</span> <span class="token punctuation">(</span>metadata <span class="token operator">==</span> <span class="token keyword">null</span> <span class="token operator">||</span> <span class="token operator">!</span>metadata<span class="token punctuation">.</span><span class="token function">isAnnotated</span><span class="token punctuation">(</span><span class="token class-name">Conditional</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">;</span>
	<span class="token punctuation">}</span>
	<span class="token comment">// 没有指定phase，注意phase可以分为PARSE_CONFIGURATION或REGISTER_BEAN类型</span>
	<span class="token keyword">if</span> <span class="token punctuation">(</span>phase <span class="token operator">==</span> <span class="token keyword">null</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token comment">// 若标有@Component，@Import，@Bean或@Configuration等注解的话，则说明是PARSE_CONFIGURATION类型</span>
		<span class="token keyword">if</span> <span class="token punctuation">(</span>metadata <span class="token keyword">instanceof</span> <span class="token class-name">AnnotationMetadata</span> <span class="token operator">&amp;&amp;</span>
				<span class="token class-name">ConfigurationClassUtils</span><span class="token punctuation">.</span><span class="token function">isConfigurationCandidate</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token class-name">AnnotationMetadata</span><span class="token punctuation">)</span> metadata<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> <span class="token function">shouldSkip</span><span class="token punctuation">(</span>metadata<span class="token punctuation">,</span> <span class="token class-name">ConfigurationPhase</span><span class="token punctuation">.</span><span class="token constant">PARSE_CONFIGURATION</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
		<span class="token comment">// 否则是REGISTER_BEAN类型</span>
		<span class="token keyword">return</span> <span class="token function">shouldSkip</span><span class="token punctuation">(</span>metadata<span class="token punctuation">,</span> <span class="token class-name">ConfigurationPhase</span><span class="token punctuation">.</span><span class="token constant">REGISTER_BEAN</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token punctuation">}</span>

	<span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Condition</span><span class="token punctuation">&gt;</span></span> conditions <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token comment">// TODO 获得所有标有@Conditional注解或其派生注解里面的Condition接口实现类并实例化成对象。</span>
	<span class="token comment">// 比如@Conditional(OnBeanCondition.class)则获得OnBeanCondition.class，OnBeanCondition.class往往实现了Condition接口</span>
	<span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> conditionClasses <span class="token operator">:</span> <span class="token function">getConditionClasses</span><span class="token punctuation">(</span>metadata<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token comment">// 将类实例化成对象</span>
		<span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token class-name">String</span> conditionClass <span class="token operator">:</span> conditionClasses<span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token class-name">Condition</span> condition <span class="token operator">=</span> <span class="token function">getCondition</span><span class="token punctuation">(</span>conditionClass<span class="token punctuation">,</span> <span class="token keyword">this</span><span class="token punctuation">.</span>context<span class="token punctuation">.</span><span class="token function">getClassLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
			conditions<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span>condition<span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>
	<span class="token comment">// 排序，即按照Condition的优先级进行排序</span>
	<span class="token class-name">AnnotationAwareOrderComparator</span><span class="token punctuation">.</span><span class="token function">sort</span><span class="token punctuation">(</span>conditions<span class="token punctuation">)</span><span class="token punctuation">;</span>

	<span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token class-name">Condition</span> condition <span class="token operator">:</span> conditions<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token class-name">ConfigurationPhase</span> requiredPhase <span class="token operator">=</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
		<span class="token keyword">if</span> <span class="token punctuation">(</span>condition <span class="token keyword">instanceof</span> <span class="token class-name">ConfigurationCondition</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token comment">// 从condition中获得对bean是解析还是注册</span>
			requiredPhase <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token class-name">ConfigurationCondition</span><span class="token punctuation">)</span> condition<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getConfigurationPhase</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
		<span class="token comment">// 若requiredPhase为null或获取的阶段类型正是当前阶段类型且不符合condition的matches条件，则跳过</span>
		<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token punctuation">(</span>requiredPhase <span class="token operator">==</span> <span class="token keyword">null</span> <span class="token operator">||</span> requiredPhase <span class="token operator">==</span> phase<span class="token punctuation">)</span> <span class="token operator">&amp;&amp;</span> <span class="token operator">!</span>condition<span class="token punctuation">.</span><span class="token function">matches</span><span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">.</span>context<span class="token punctuation">,</span> metadata<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br></div></div><p><code>shouldSkip</code>这个方法执行的逻辑主要是如果是解析阶段则跳过，如果是注册阶段则不跳过；如果是在注册阶段即<code>REGISTER_BEAN</code>阶段的话，此时会得到所有的<code>Condition</code>接口的具体实现类并实例化这些实现类，然后再执行下面关键的代码进行判断是否需要跳过。</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token punctuation">(</span>requiredPhase <span class="token operator">==</span> <span class="token keyword">null</span> <span class="token operator">||</span> requiredPhase <span class="token operator">==</span> phase<span class="token punctuation">)</span> <span class="token operator">&amp;&amp;</span> <span class="token operator">!</span>condition<span class="token punctuation">.</span><span class="token function">matches</span><span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">.</span>context<span class="token punctuation">,</span> metadata<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>上面代码最重要的逻辑是调用了<code>Condition</code>接口的具体实现类的<code>matches</code>方法，若<code>matches</code>返回<code>false</code>，则跳过，不进行注册<code>bean</code>的操作；若<code>matches</code>返回<code>true</code>，则不跳过，进行注册<code>bean</code>的操作；</p> <p>好了，<code>Condition</code>的源码分析就到此为止，再往上翻调用方法的话应该就是 Spring 加载<code>bean</code>定义的相关源码了，不属于这里的分析范围。</p> <h3 id="_3-2-spring-的内置-condition-接口实现类"><a href="#_3-2-spring-的内置-condition-接口实现类" class="header-anchor">#</a> 3.2 Spring 的内置 Condition 接口实现类</h3> <p>前面我们学会了如何自定义条件注解及<code>Condition</code>的源码分析，那么我们不禁好奇，Spring 究竟内置了哪些<code>Condition</code>接口的实现类呢？</p> <p>那么看下 Spring 的<code>Condition</code>接口的具体实现类的类图：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/e0873786ade3a56acf2a0cdc2db5efd6.webp" alt="img"></p> <p>发现 Spring 内置的<code>Condition</code>接口的具体实现类虽然有多个，但只有<code>ProfileCondition</code>不是测试相关的，因此可以说真正的内置的<code>Condition</code>接口的具体实现类只有<code>ProfileCondition</code>一个，非常非常少,这跟 SpringBoot 的大量派生条件注解形成了鲜明的对比。<code>ProfileCondition</code>大家都知道，是跟环境有关，比如我们平时一般有<code>dev</code>,<code>test</code>和<code>prod</code>环境，而<code>ProfileCondition</code>就是判断我们项目配置了哪个环境的。下面是<code>ProfileCondition</code>的源码，很简单，这里就不分析了。</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">class</span> <span class="token class-name">ProfileCondition</span> <span class="token keyword">implements</span> <span class="token class-name">Condition</span> <span class="token punctuation">{</span>
	<span class="token annotation punctuation">@Override</span>
	<span class="token keyword">public</span> <span class="token keyword">boolean</span> <span class="token function">matches</span><span class="token punctuation">(</span><span class="token class-name">ConditionContext</span> context<span class="token punctuation">,</span> <span class="token class-name">AnnotatedTypeMetadata</span> metadata<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token class-name">MultiValueMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> attrs <span class="token operator">=</span> metadata<span class="token punctuation">.</span><span class="token function">getAllAnnotationAttributes</span><span class="token punctuation">(</span><span class="token class-name">Profile</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token keyword">if</span> <span class="token punctuation">(</span>attrs <span class="token operator">!=</span> <span class="token keyword">null</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token class-name">Object</span> value <span class="token operator">:</span> attrs<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;value&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
				<span class="token keyword">if</span> <span class="token punctuation">(</span>context<span class="token punctuation">.</span><span class="token function">getEnvironment</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">acceptsProfiles</span><span class="token punctuation">(</span><span class="token class-name">Profiles</span><span class="token punctuation">.</span><span class="token function">of</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">)</span> value<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
					<span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
				<span class="token punctuation">}</span>
			<span class="token punctuation">}</span>
			<span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
		<span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><h2 id="_4-springbootcondition-源码解析"><a href="#_4-springbootcondition-源码解析" class="header-anchor">#</a> 4 SpringBootCondition 源码解析</h2> <p>前面看到 Spring 对<code>Condition</code>的内置注解可以说只有<code>ProfileCondition</code>一个，但是我们都知道，SpringBoot 则内置了大量的条件注解<code>ConditionalOnXXX</code>。在分析前，我们先来看一下<code>SpringBootCondition</code>的整体类图来个整体的理解，如下图：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/9b749f42ace5c56f919065b52f4d49ff.webp" alt="img"></p> <p>可以看到<code>SpringBootCondition</code>作为 SpringBoot 条件注解的基类，处于整个类图的中心，它实现了<code>Condition</code>接口，然后又有很多具体的子类<code>OnXXXCondition</code>,这些<code>OnXXXCondition</code>其实就是<code>@ConditionalOnXXX</code>的条件类。</p> <p>我们先来看下<code>SpringBootCondition</code>这个父类是主要做了哪些事情，抽象了哪些共有的逻辑？</p> <p><code>SpringBootConditon</code>实现了<code>Condition</code>接口，作为 SpringBoot 众多条件注解<code>OnXXXCondtion</code>的父类，它的作用主要就是打印一些条件注解评估报告的日志，比如打印哪些配置类是符合条件注解的，哪些是不符合的。打印的日志形式如下图：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/0e15bd7cb8a8689544baebbfb8e2f0d8.webp" alt="img"></p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/2bb5e9749dfa9800877c52f659b6facd.webp" alt="img"> 因为<code>SpringBootConditon</code>实现了<code>Condition</code>接口，也实现了<code>matches</code>方法，因此该方法同样也是被<code>ConditionEvaluator</code>的<code>shouldSkip</code>方法中调用，因此我们就以<code>SpringBootConditon</code>的<code>matches</code>方法为入口去进行分析。直接上代码：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// SpringBootCondition.java</span>
<span class="token keyword">public</span> <span class="token keyword">final</span> <span class="token keyword">boolean</span> <span class="token function">matches</span><span class="token punctuation">(</span><span class="token class-name">ConditionContext</span> context<span class="token punctuation">,</span>
			<span class="token class-name">AnnotatedTypeMetadata</span> metadata<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token comment">// 得到metadata的类名或方法名</span>
		<span class="token class-name">String</span> classOrMethodName <span class="token operator">=</span> <span class="token function">getClassOrMethodName</span><span class="token punctuation">(</span>metadata<span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token keyword">try</span> <span class="token punctuation">{</span>
			<span class="token comment">// 判断每个配置类的每个条件注解@ConditionalOnXXX是否满足条件，然后记录到ConditionOutcome结果中</span>
			<span class="token comment">// 注意getMatchOutcome是一个抽象模板方法，交给OnXXXCondition子类去实现</span>
			<span class="token class-name">ConditionOutcome</span> outcome <span class="token operator">=</span> <span class="token function">getMatchOutcome</span><span class="token punctuation">(</span>context<span class="token punctuation">,</span> metadata<span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token comment">// 打印condition评估的日志，哪些条件注解@ConditionalOnXXX是满足条件的，哪些是不满足条件的，这些日志都打印出来</span>
			<span class="token function">logOutcome</span><span class="token punctuation">(</span>classOrMethodName<span class="token punctuation">,</span> outcome<span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token comment">// 除了打印日志外，这些是否匹配的信息还要记录到ConditionEvaluationReport中</span>
			<span class="token function">recordEvaluation</span><span class="token punctuation">(</span>context<span class="token punctuation">,</span> classOrMethodName<span class="token punctuation">,</span> outcome<span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token comment">// 最后返回@ConditionalOnXXX是否满足条件</span>
			<span class="token keyword">return</span> outcome<span class="token punctuation">.</span><span class="token function">isMatch</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
		<span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">NoClassDefFoundError</span> ex<span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">IllegalStateException</span><span class="token punctuation">(</span>
					<span class="token string">&quot;Could not evaluate condition on &quot;</span> <span class="token operator">+</span> classOrMethodName <span class="token operator">+</span> <span class="token string">&quot; due to &quot;</span>
							<span class="token operator">+</span> ex<span class="token punctuation">.</span><span class="token function">getMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token string">&quot; not &quot;</span>
							<span class="token operator">+</span> <span class="token string">&quot;found. Make sure your own configuration does not rely on &quot;</span>
							<span class="token operator">+</span> <span class="token string">&quot;that class. This can also happen if you are &quot;</span>
							<span class="token operator">+</span> <span class="token string">&quot;@ComponentScanning a springframework package (e.g. if you &quot;</span>
							<span class="token operator">+</span> <span class="token string">&quot;put a @ComponentScan in the default package by mistake)&quot;</span><span class="token punctuation">,</span>
					ex<span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
		<span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">RuntimeException</span> ex<span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">IllegalStateException</span><span class="token punctuation">(</span>
					<span class="token string">&quot;Error processing condition on &quot;</span> <span class="token operator">+</span> <span class="token function">getName</span><span class="token punctuation">(</span>metadata<span class="token punctuation">)</span><span class="token punctuation">,</span> ex<span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br></div></div><p>上面代码的注释已经非常详细，我们知道了<code>SpringBootCondition</code>抽象了所有其具体实现类<code>OnXXXCondition</code>的共有逻辑--<code>condition</code>评估信息打印，最重要的是封装了一个模板方法<code>getMatchOutcome(context, metadata)</code>，留给各个<code>OnXXXCondition</code>具体子类去覆盖实现属于自己的判断逻辑，然后再返回相应的匹配结果给<code>SpringBootCondition</code>用于日志打印。</p> <p>因此我们知道了<code>SpringBootCondition</code>其实就是用来打印<code>condition</code>评估信息的，对于其他枝节方法我们不必追究过深，免得丢了主线。我们现在的重点是放在交给<code>OnXXXCondition</code>子类实现的模板方法上<code>getMatchOutcome(context, metadata);</code>，因为这个方法将会由很多<code>OnXXXCondition</code>覆盖重写判断逻辑，这里是我们接下来分析的重点。</p> <p>因为<code>SpringBootCondition</code>有众多具体实现类，下面只挑<code>OnResourceCondition</code>，<code>OnBeanCondition</code>和<code>OnWebApplicationCondition</code>进行讲解，而<code>AutoConfigurationImportFilter</code>跟自动配置有关，则留到自动配置源码解析的时候再进行分析。</p> <h3 id="_4-1-onresourcecondition-源码分析"><a href="#_4-1-onresourcecondition-源码分析" class="header-anchor">#</a> 4.1 OnResourceCondition 源码分析</h3> <p>现在先来看下一个逻辑及其简单的注解条件类<code>OnResourceCondition</code>，<code>OnResourceCondition</code>继承了<code>SpringBootCondition</code>父类，覆盖了其<code>getMatchOutcome</code>方法，用于<code>@ConditionalOnResource</code>注解指定的资源存在与否。<code>OnResourceCondition</code>的判断逻辑非常简单，主要拿到<code>@ConditionalOnResource</code>注解指定的资源路径后，然后用<code>ResourceLoader</code>根据指定路径去加载看资源存不存在。下面直接看代码:</p> <p>先来看下<code>@ConditionalOnResource</code>的代码，</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Target</span><span class="token punctuation">(</span><span class="token punctuation">{</span> <span class="token class-name">ElementType</span><span class="token punctuation">.</span><span class="token constant">TYPE</span><span class="token punctuation">,</span> <span class="token class-name">ElementType</span><span class="token punctuation">.</span><span class="token constant">METHOD</span> <span class="token punctuation">}</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@Retention</span><span class="token punctuation">(</span><span class="token class-name">RetentionPolicy</span><span class="token punctuation">.</span><span class="token constant">RUNTIME</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@Documented</span>

			<span class="token keyword">else</span> <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span><span class="token function">hasSingleAutowireCandidate</span><span class="token punctuation">(</span>context<span class="token punctuation">.</span><span class="token function">getBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>

						<span class="token punctuation">.</span><span class="token function">forCondition</span><span class="token punctuation">(</span><span class="token class-name">ConditionalOnSingleCandidate</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> spec<span class="token punctuation">)</span>
						<span class="token punctuation">.</span><span class="token function">didNotFind</span><span class="token punctuation">(</span><span class="token string">&quot;a primary bean from beans&quot;</span><span class="token punctuation">)</span>
						<span class="token punctuation">.</span><span class="token function">items</span><span class="token punctuation">(</span><span class="token class-name">Style</span><span class="token punctuation">.</span><span class="token constant">QUOTE</span><span class="token punctuation">,</span> matchResult<span class="token punctuation">.</span><span class="token function">getNamesOfAllMatches</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token punctuation">}</span>
			matchMessage <span class="token operator">=</span> matchMessage
					<span class="token punctuation">.</span><span class="token function">andCondition</span><span class="token punctuation">(</span><span class="token class-name">ConditionalOnSingleCandidate</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> spec<span class="token punctuation">)</span>
					<span class="token punctuation">.</span><span class="token function">found</span><span class="token punctuation">(</span><span class="token string">&quot;a primary bean from beans&quot;</span><span class="token punctuation">)</span>
					<span class="token punctuation">.</span><span class="token function">items</span><span class="token punctuation">(</span><span class="token class-name">Style</span><span class="token punctuation">.</span><span class="token constant">QUOTE</span><span class="token punctuation">,</span> matchResult<span class="token punctuation">.</span><span class="token function">getNamesOfAllMatches</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
		<span class="token comment">// (3)，配置类（metadata）标注@ConditionalOnMissingBean注解的情况</span>
		<span class="token keyword">if</span> <span class="token punctuation">(</span>metadata<span class="token punctuation">.</span><span class="token function">isAnnotated</span><span class="token punctuation">(</span><span class="token class-name">ConditionalOnMissingBean</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
			<span class="token class-name">BeanSearchSpec</span> spec <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">BeanSearchSpec</span><span class="token punctuation">(</span>context<span class="token punctuation">,</span> metadata<span class="token punctuation">,</span>
					<span class="token class-name">ConditionalOnMissingBean</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token class-name">MatchResult</span> matchResult <span class="token operator">=</span> <span class="token function">getMatchingBeans</span><span class="token punctuation">(</span>context<span class="token punctuation">,</span> spec<span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token keyword">if</span> <span class="token punctuation">(</span>matchResult<span class="token punctuation">.</span><span class="token function">isAnyMatched</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
				<span class="token class-name">String</span> reason <span class="token operator">=</span> <span class="token function">createOnMissingBeanNoMatchReason</span><span class="token punctuation">(</span>matchResult<span class="token punctuation">)</span><span class="token punctuation">;</span>
				<span class="token keyword">return</span> <span class="token class-name">ConditionOutcome</span><span class="token punctuation">.</span><span class="token function">noMatch</span><span class="token punctuation">(</span><span class="token class-name">ConditionMessage</span>
						<span class="token punctuation">.</span><span class="token function">forCondition</span><span class="token punctuation">(</span><span class="token class-name">ConditionalOnMissingBean</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> spec<span class="token punctuation">)</span>
						<span class="token punctuation">.</span><span class="token function">because</span><span class="token punctuation">(</span>reason<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
			<span class="token punctuation">}</span>
			matchMessage <span class="token operator">=</span> matchMessage<span class="token punctuation">.</span><span class="token function">andCondition</span><span class="token punctuation">(</span><span class="token class-name">ConditionalOnMissingBean</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> spec<span class="token punctuation">)</span>
					<span class="token punctuation">.</span><span class="token function">didNotFind</span><span class="token punctuation">(</span><span class="token string">&quot;any beans&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">atAll</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>
