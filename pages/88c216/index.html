s="sidebar-sub-header level2"><a href="/pages/88c216/#二维数组使用细节和注意事项" class="sidebar-link">二维数组使用细节和注意事项</a></li></ul></li><li><a href="/pages/f3fe89/" class="sidebar-link">Java 面向对象</a></li><li><a href="/pages/d8cd4d/" class="sidebar-link">Java 枚举和注解</a></li><li><a href="/pages/59d732/" class="sidebar-link">Java 异常-Exception</a></li><li><a href="/pages/1f9b73/" class="sidebar-link">Java 常用类</a></li><li><a href="/pages/e7e17e/" class="sidebar-link">Java 集合</a></li><li><a href="/pages/6a0f85/" class="sidebar-link">Java 泛型</a></li><li><a href="/pages/005d24/" class="sidebar-link">Java 多线程</a></li><li><a href="/pages/25d9ee/" class="sidebar-link">Java IO流</a></li><li><a href="/pages/c5fffc/" class="sidebar-link">Java 网络编程</a></li><li><a href="/pages/13e019/" class="sidebar-link">Java 多用户即时通信系统</a></li><li><a href="/pages/630cd1/" class="sidebar-link">Java 反射</a></li><li><a href="/pages/fdf000/" class="sidebar-link">Java JDBC和数据库连接池</a></li><li><a href="/pages/61ff69/" class="sidebar-link">Java 正则表达式</a></li><li><a href="/JavaEE/java/Java8Newfeatures/" class="sidebar-link">Java 8新特性</a></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/note/Java/#Java 基础" data-v-06225672>Java 基础</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2021-12-20</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Java 数组、排序和查找<!----></h1>  <div class="theme-vdoing-content content__default"><h1 id="java-数组、排序和查找"><a href="#java-数组、排序和查找" class="header-anchor">#</a> Java 数组、排序和查找</h1> <h2 id="为什么需要数组"><a href="#为什么需要数组" class="header-anchor">#</a> 为什么需要数组</h2> <p>一个养鸡场有 6 只鸡，它们的体重分别是 3kg,5kg,1kg,3.4kg,2kg,50kg 。请问这六只鸡的总体重是多少?平
均体重是多少? 请你编一个程序。</p> <p>思路：</p> <p>定义 6 个变量 , 加起来 总体重， 求出平均体重.引出 -&gt;数组</p> <h3 id="数组介绍"><a href="#数组介绍" class="header-anchor">#</a> 数组介绍</h3> <p>数组可以存放多个同一类型的数据。数组也是一种数据类型，是引用类型。</p> <p>即：数(数据)组(一组)就是一组数据</p> <h3 id="数组快速入门"><a href="#数组快速入门" class="header-anchor">#</a> 数组快速入门</h3> <p>比如，我们可以用数组来解决上一个问题。</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">//数组的引出</span>
<span class="token comment">//</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Array01</span> <span class="token punctuation">{</span>
	<span class="token comment">//编写一个 main 方法</span>
	<span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token comment">/*
	它们的体重分别是 3kg,5kg,1kg,3.4kg,2kg,50kg 。
	请问这六只鸡的总体重是多少?平均体重是多少?
	思路分析
	1. 定义六个变量 double , 求和 得到总体重
	2. 平均体重 = 总体重 / 6
	3. 分析传统实现的方式问题. 6-&gt;600-&gt;566
	4. 引出新的技术 -&gt; 使用数
	*/</span>
        <span class="token comment">// double hen1 = 3;</span>
        <span class="token comment">// double hen2 = 5;</span>
        <span class="token comment">// double hen3 = 1;</span>
        <span class="token comment">// double hen4 = 3.4;</span>
        <span class="token comment">// double hen5 = 2;</span>
        <span class="token comment">// double hen6 = 50;</span>

EE/04.png" alt="04"></p> <h2 id="排序的介绍"><a href="#排序的介绍" class="header-anchor">#</a> 排序的介绍</h2> <p>排序是将多个数据，依指定的顺序进行排列的过程</p> <h3 id="内部排序"><a href="#内部排序" class="header-anchor">#</a> 内部排序</h3> <p>指将需要处理的所有数据都加载到内部存储器中进行排序。包括(交换式排序法、选择式排序法和插入式排序法)；</p> <h3 id="外部排序法"><a href="#外部排序法" class="header-anchor">#</a> 外部排序法</h3> <p>数据量过大，无法全部加载到内存中，需要借助外部存储进行排序。包括(合并排序法和直接合并排序法)。</p> <h2 id="冒泡排序法"><a href="#冒泡排序法" class="header-anchor">#</a> 冒泡排序法</h2> <p>冒泡排序（Bubble Sorting）的基本思想是：通过对待排序序列从后向前（从下标较大的元素开始），依次比较相邻元素的值，若发现逆序则交换，使值较大的元素逐渐从前移向后部，就象水底下的气泡一样逐渐向上冒。</p> <p>冒泡排序法案例：</p> <p>下面我们举一个具体的案例来说明冒泡法。我们将五个无序：24,69,80,57,13 使用冒泡排序法将其排成一个从小到大的有序数列。</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/JavaEE/05.png" alt="05"></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">BubbleSort</span> <span class="token punctuation">{</span>

mber">102</span><br><span class="line-number">103</span><br><span class="line-number">104</span><br><span class="line-number">105</span><br><span class="line-number">106</span><br><span class="line-number">107</span><br></div></div><h2 id="查找"><a href="#查找" class="header-anchor">#</a> 查找</h2> <h3 id="案例演示"><a href="#案例演示" class="header-anchor">#</a> 案例演示</h3> <ol><li>有一个数列：白眉鹰王、金毛狮王、紫衫龙王、青翼蝠王猜数游戏：从键盘中任意输入一个名称，判断数列中是否包含此名称【顺序查找】 要求: 如果找到了，就提示找到，并给出下标值。</li></ol> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">SeqSearch</span> <span class="token punctuation">{</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>比如:</p> <p><img src="https://cdn.statically.io/gh/xustudyxu/image-hosting@master/studynotes/java/images/arr/09.png" alt="09"></p> <ul><li>解读</li></ul> <ol><li>定义了一个二维数组 arr</li> <li>arr 有三个元素(每个元素都是一维数组)</li> <li>第一个一维数组有 3 个元素 , 第二个一维数组有 3 个元素, 第三个一维数组有 1 个元素</li></ol> <h3 id="案例演示-2"><a href="#案例演示-2" class="header-anchor">#</a> 案例演示</h3> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">int</span> arr<span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token operator">=</span><span class="token punctuation">{</span><span class="token punctuation">{</span><span class="token number">4</span><span class="token punctuation">,</span><span class="token number">6</span><span class="token punctuation">}</span><span class="token punctuation">,</span><span class="token punctuation">{</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">4</span><span class="token punctuation">,</span><span class="token number">5</span><span class="token punctuation">,</span><span class="token number">7</span><span class="token punctuation">}</span><span class="token punctuation">,</span><span class="token punctuation">{</span><span class="token operator">-</span><span class="token number">2</span><span class="token punctuation">}</span><span class="token punctuation">}</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>遍历该二维数组，并得到和</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">TwoDimeensionalArray04</span> <span class="token punctuation">{</span>

	<span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token comment">// TODO Auto-generated method stub</span>
		<span class="token comment">/*
		 * int arr[][]={{4,6},{1,4,5,7},{-2}};遍历该二维数组，并得到和

		 1.遍历二维数组，并将各个值累计到 int sum
		 
		 */</span>
		<span class="token keyword">int</span> arr<span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token operator">=</span><span class="token punctuation">{</span><span class="token punctuation">{</span><span class="token number">4</span><span class="token punctuation">,</span><span class="token number">6</span><span class="token punctuation">}</span><span class="token punctuation">,</span><span class="token punctuation">{</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">4</span><span class="token punctuation">,</span><span class="token number">5</span><span class="token punctuation">,</span><span class="token number">7</span><span class="token punctuation">}</span><span class="token punctuation">,</span><span class="token punctuation">{</span><span class="token operator">-</span><span class="token number">2</span><span class="token punctuation">}</span><span class="token punctuation">}</span><span class="token punctuation">;</span>
		<span class="token keyword">int</span> sum<span class="token operator">=</span><span class="token number">0</span><span class="token punctuation">;</span>
         <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token keyword">int</span> i<span class="token operator">=</span><span class="token number">0</span><span class="token punctuation">;</span>i<span class="token operator">&lt;</span>arr<span class="token punctuation">.</span>length<span class="token punctuation">;</span>i<span class="token operator">++</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        	 <span class="token comment">//遍历每个一维数组</span>
        	 <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token keyword">int</span> j<span class="token operator">=</span><span class="token number">0</span><span class="token punctuation">;</span>j<span class="token operator">&lt;</span>arr<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">.</span>length<span class="token punctuation">;</span>j<span class="token operator">++</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        		 sum<span class="token operator">+=</span>arr<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">[</span>j<span class="token punctuation">]</span><span class="token punctuation">;</span>
        	 <span class="token punctuation">}</span>
         <span class="token punctuation">}</span>

	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div></li> <li><p>二维数组的声明方式有:</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code>	<span class="token keyword">int</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">[</span><span class="token punctuation">]</span> y  或者 <span class="token keyword">int</span> y<span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">[</span><span class="token punctuation">]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div></li> <li><p>二维数组实际上是由多个一维数组组成的，它的各个一维数组的长度可以相同，也可以不相同。比如： map[][] 是一个二维数组</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code> <span class="token keyword">int</span> map <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">[</span><span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token punctuation">{</span><span class="token punctuation">{</span><span class="token number">1</span><span class="token punctuation">,</span><span class="token number">2</span><span class="token punctuation">}</span><span class="token punctuation">,</span><span class="token punctuation">{</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token number">4</span><span class="token punctuation">,</span><span class="token number">5</span><span class="token punctuation">}</span><span class="token punctuation">}</span>
<span class="token comment">//由 map[0] 是一个含有两个元素的一维数组 ，map[1] 是一个含有三个元素的一维数组构成，我们也称为列数不等的二维数组</span>
