a href="/pages/3750a4/" class="sidebar-link">服务注册组件搭建采集接口信息</a></li><li><a href="/pages/46c35f/" class="sidebar-link">应用服务接口注册到注册中心</a></li><li><a href="/pages/bb3695/" class="sidebar-link">订阅服务注册消息驱动网关映射</a></li><li><a href="/pages/2d7dcf/" class="sidebar-link">网关运营管理后台框架搭建</a></li><li><a href="/pages/6936ee/" class="sidebar-link">前后端分离应用的跨域接口调用</a></li><li><a href="/pages/13559a/" class="sidebar-link">网关Nginx负载模型配置</a></li><li><a href="/pages/918d1a/" aria-current="page" class="active sidebar-link">动态刷新网关Nginx负载均衡配置</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level2"><a href="/pages/918d1a/#学习方法" class="sidebar-link">学习方法</a></li><li class="sidebar-sub-header level2"><a href="/pages/918d1a/#方案设计" class="sidebar-link">方案设计</a></li><li class="sidebar-sub-header level2"><a href="/pages/918d1a/#方案实现" class="sidebar-link">方案实现</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level3"><a href="/pages/918d1a/#nginx-配置服务" class="sidebar-link">Nginx 配置服务</a></li><li class="sidebar-sub-header level3"><a href="/pages/918d1a/#刷新文件建模" class="sidebar-link">刷新文件建模</a></li><li class="sidebar-sub-header level3"><a href="/pages/918d1a/#刷新文件实现" class="sidebar-link">刷新文件实现</a></li><li class="sidebar-sub-header level3"><a href="/pages/918d1a/#应用容器部署" class="sidebar-link">应用容器部署</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/pages/918d1a/#测试验证" class="sidebar-link">测试验证</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level3"><a href="/pages/918d1a/#_3套-api-模拟服务" class="sidebar-link">3套 API 模拟服务</a></li><li class="sidebar-sub-header level3"><a href="/pages/918d1a/#nginx-初始配置" class="sidebar-link">Nginx 初始配置</a></li><li class="sidebar-sub-header level3"><a href="/pages/918d1a/#刷新配置" class="sidebar-link">刷新配置</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/pages/918d1a/#扩展介绍" class="sidebar-link">扩展介绍</a></li><li class="sidebar-sub-header level2"><a href="/pages/918d1a/#本章小结" class="sidebar-link">本章小结</a></li><li class="sidebar-sub-header level2"><a href="/pages/918d1a/#扩展内容" class="sidebar-link">扩展内容</a></li></ul></li><li><a href="/pages/dea686/" class="sidebar-link">实现网关算力节点动态负载功能</a></li><li><a href="/pages/1bdcba/" class="sidebar-link">网关组件工程模块合并</a></li><li><a href="/pages/d9cb43/" class="sidebar-link">功能完善(算力关联、接口上报、调用反馈)</a></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/note/Gateway/#《API网关设计与实现》" data-v-06225672>《API网关设计与实现》</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2023-09-28</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->动态刷新网关Nginx负载均衡配置<!----></h1>  <div class="theme-vdoing-content content__default"><h2 id="学习方法"><a href="#学习方法" class="header-anchor">#</a> <strong>学习方法</strong></h2> <p>用于承载 HTTP 请求转换协议泛化调用 RPC 服务的网关算力不可能只有一组服务，而是一个网关算力集群化的设计实现。而对于这样一个诉求的实现，基本的核心模型结构就是负载的配置和轮训策略的使用。而这也是为什么我们会在第25章先进行 Nginx 的负载模型构建。那么在本章将继续带着大家扩展这部分内容，让Nginx可以被动态的变更并重载配置文件。这样就可以满足当有新的网关注册、下线、调整时可以自动的生效Nginx配置。</p> <h2 id="方案设计"><a href="#方案设计" class="header-anchor">#</a> <strong>方案设计</strong></h2> <p>动态刷新负载配置策略的实施方案会受到服务部署方式的影响，本文以服务在Docker容器中部署为例，通过Java调用容器命令来执行刷新操作。以下是方案的详细设计：</p> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-blogs/image-20231007102813768.png" alt="image-20231007102813768"></p> <ul><li><p>在进行网关算力的动态配置和刷新时，需要考虑根据服务的注册来动态更新Nginx配置文件并使其生效。这将涉及到Nginx配置文件的修改和刷新，以及如何通过Java程序进行控制的问题。</p></li> <li><p>举例来说，考虑当前的服务部署在Docker容器中。Docker是嵌套在Linux服务器内的，每个镜像实例都在隔离的环境中运行。在这种情况下，解决的关键问题是如何实现配置文件的互通和指令的调用。</p></li></ul> <h2 id="方案实现"><a href="#方案实现" class="header-anchor">#</a> <strong>方案实现</strong></h2> <p>对于方案设计中提到的问题，我们做出对应的实现：</p> <ul><li><p>问题1：Nginx 的配置文件如何被其他应用程序获取并修改，这里需要用到文件挂载操作。我们把存放在 Linux 服务器上的 <a href="http://nginx.conf/" target="_blank" rel="noopener noreferrer">nginx.conf<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 所在的文件夹📂挂在到 api-gateway-center 上，之后把 <a href="http://nginx.conf/" target="_blank" rel="noopener noreferrer">nginx.conf<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 配置文件挂在 Nginx 服务上。这样就打通第一个要解决的配置文件问题。之后再 api-gateway-center 服务上就可以通过 IO 流更新 <a href="http://nginx.conf/" target="_blank" rel="noopener noreferrer">nginx.conf<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 文件。</p></li> <li><p>问题2：如何通过 api-gateway-center 程序对 Nginx 进行调用。这里因为我们是在 Docker 场景下，所以需要通过 Java 控制并获取 Docker 容器中 Nginx 的服务，并对其进行操作。这里还会涉及到网络的问题，否则在容器中服务1不能调用服务2。</p></li></ul> <h3 id="nginx-配置服务"><a href="#nginx-配置服务" class="header-anchor">#</a> <strong>Nginx 配置服务</strong></h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># 运行新的容器</span>
<span class="token function">docker</span> run <span class="token punctuation">\</span>
<span class="token parameter variable">--name</span> Nginx <span class="token punctuation">\</span>
<span class="token parameter variable">-d</span> <span class="token punctuation">\</span>
<span class="token parameter variable">-v</span> /opt/api-gateway/api-gateway-center/doc/data/html:/usr/share/nginx/html <span class="token punctuation">\</span>
<span class="token parameter variable">-v</span> /opt/api-gateway/api-gateway-center/doc/data/nginx/nginx.conf:/etc/nginx/nginx.conf <span class="token punctuation">\</span>
<span class="token parameter variable">-p</span> <span class="token number">8090</span>:80 <span class="token punctuation">\</span>
nginx
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><ul><li>nginx 配置上一章已经讲解过文件的挂载，可以回到对应章节参考。</li></ul> <h3 id="刷新文件建模"><a href="#刷新文件建模" class="header-anchor">#</a> <strong>刷新文件建模</strong></h3> <p>更新Nginx的配置，需要先通过Java程序创建或者更新Nginx配置，之后再启动刷新指令。这段功能逻辑代码使用模板模式，来定义标准的执行流程，并做实现。</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">abstract</span> <span class="token keyword">class</span> <span class="token class-name">AbstractLoadBalancing</span> <span class="token keyword">implements</span> <span class="token class-name">ILoadBalancingService</span> <span class="token punctuation">{</span>

    <span class="token keyword">private</span> <span class="token class-name">Logger</span> logger <span class="token operator">=</span> <span class="token class-name">LoggerFactory</span><span class="token punctuation">.</span><span class="token function">getLogger</span><span class="token punctuation">(</span><span class="token class-name">AbstractLoadBalancing</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">updateNginxConfig</span><span class="token punctuation">(</span><span class="token class-name">NginxConfig</span> nginxConfig<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">Exception</span> <span class="token punctuation">{</span>
        <span class="token comment">// 1. 创建 Nginx 配置文件</span>
        <span class="token class-name">String</span> nginxConfigFile <span class="token operator">=</span> <span class="token function">createNginxConfigFile</span><span class="token punctuation">(</span>nginxConfig<span class="token punctuation">)</span><span class="token punctuation">;</span>
        logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;步骤1：创建 Nginx 配置文件 containerFilePath：{}&quot;</span><span class="token punctuation">,</span> nginxConfigFile<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 2. 复制 Nginx 配置文件</span>
        <span class="token comment">// copyDockerFile(nginxConfig.getApplicationName(), containerFilePath, nginxConfig.getLocalNginxPath());</span>
        <span class="token comment">// logger.info(&quot;步骤2：拷贝 Nginx 配置文件 localPath：{}&quot;, nginxConfig.getLocalNginxPath());</span>
        <span class="token comment">// 3. 刷新 Nginx 配置文件</span>
        <span class="token function">refreshNginxConfig</span><span class="token punctuation">(</span>nginxConfig<span class="token punctuation">.</span><span class="token function">getNginxName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;步骤2：刷新 Nginx 配置文件 Done！&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token punctuation">}</span>

    <span class="token keyword">protected</span> <span class="token keyword">abstract</span> <span class="token class-name">String</span> <span class="token function">createNginxConfigFile</span><span class="token punctuation">(</span><span class="token class-name">NginxConfig</span> nginxConfig<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">IOException</span><span class="token punctuation">;</span>

    <span class="token keyword">protected</span> <span class="token keyword">abstract</span> <span class="token keyword">void</span> <span class="token function">copyDockerFile</span><span class="token punctuation">(</span><span class="token class-name">String</span> applicationName<span class="token punctuation">,</span> <span class="token class-name">String</span> containerFilePath<span class="token punctuation">,</span> <span class="token class-name">String</span> localNginxPath<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">InterruptedException</span><span class="token punctuation">,</span> <span class="token class-name">IOException</span><span class="token punctuation">;</span>

    <span class="token keyword">protected</span> <span class="token keyword">abstract</span> <span class="token keyword">void</span> <span class="token function">refreshNginxConfig</span><span class="token punctuation">(</span><span class="token class-name">String</span> nginxName<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">InterruptedException</span><span class="token punctuation">,</span> <span class="token class-name">IOException</span><span class="token punctuation">;</span>


<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br></div></div><ul><li><p>实现流程分为3块，包括；文件的创建、文件的复制、文件的刷新。但鉴于我们已经通过文件的挂在到相同目录下，解决了复制 <code>Docker</code> 应用程序创建出来的 <code>Nginx</code>  配置文件到本地，所以这里就不需要自己在复制了。</p></li> <li><p>文件刷新配置会涉及到镜像容器部署的一些指令，在下文中会有体现。</p></li></ul> <h3 id="刷新文件实现"><a href="#刷新文件实现" class="header-anchor">#</a> <strong>刷新文件实现</strong></h3> <p>本身部署在 Docker 容器的 Nginx 文件，在刷新时候需要通过指令；<code>docker exec Nginx nginx -s rolad</code> 那么这里我们通过 Java 程序控制，就需要连接 Docker 容器，找到对应的服务，在执行容器指令。</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">protected</span> <span class="token keyword">void</span> <span class="token function">refreshNginxConfig</span><span class="token punctuation">(</span><span class="token class-name">String</span> nginxName<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">InterruptedException</span><span class="token punctuation">,</span> <span class="token class-name">IOException</span> <span class="token punctuation">{</span>
    <span class="token comment">// Docker client</span>
    <span class="token class-name">DockerClientConfig</span> config <span class="token operator">=</span> <span class="token class-name">DefaultDockerClientConfig</span><span class="token punctuation">.</span><span class="token function">createDefaultConfigBuilder</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">withDockerHost</span><span class="token punctuation">(</span><span class="token string">&quot;unix:///var/run/docker.sock&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">DockerClient</span> dockerClient <span class="token operator">=</span> <span class="token class-name">DockerClientBuilder</span><span class="token punctuation">.</span><span class="token function">getInstance</span><span class="token punctuation">(</span>config<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">String</span> containerId <span class="token operator">=</span> dockerClient<span class="token punctuation">.</span><span class="token function">listContainersCmd</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">withNameFilter</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">ArrayList</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span><span class="token punctuation">{</span>
                <span class="token function">add</span><span class="token punctuation">(</span>nginxName<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">exec</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">ExecCreateCmdResponse</span> execCreateCmdResponse <span class="token operator">=</span> dockerClient
            <span class="token punctuation">.</span><span class="token function">execCreateCmd</span><span class="token punctuation">(</span>containerId<span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">withCmd</span><span class="token punctuation">(</span><span class="token string">&quot;nginx&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;-s&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;reload&quot;</span><span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">exec</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    dockerClient<span class="token punctuation">.</span><span class="token function">execStartCmd</span><span class="token punctuation">(</span>execCreateCmdResponse<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
            <span class="token punctuation">.</span><span class="token function">exec</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">ResultCallback<span class="token punctuation">.</span>Adapter</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">awaitCompletion</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    dockerClient<span class="token punctuation">.</span><span class="token function">close</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br></div></div><ul><li>这一段代码中包括了连接的创建、服务的查找、指令的执行和关闭连接的操作。你也可以只做单元测试进行。NginxTest 类中有对应的代码。</li></ul> <h3 id="应用容器部署"><a href="#应用容器部署" class="header-anchor">#</a> <strong>应用容器部署</strong></h3> <p>这里需要注意，为了开启Docker容器中的Java应用连接Docker，需要开启对应的网络服务。这个服务在配置容器时即可开启；</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment">#启动</span>
<span class="token function">docker</span> run <span class="token parameter variable">-p</span> <span class="token number">8001</span>:8001 <span class="token punctuation">\</span>
<span class="token parameter variable">-v</span> /opt/api-gateway/api-gateway-center/doc/data/nginx:/data/nginx <span class="token punctuation">\</span>
<span class="token parameter variable">-v</span> /var/run/docker.sock:/var/run/docker.sock <span class="token punctuation">\</span>
<span class="token parameter variable">--name</span> api-gateway-center <span class="token punctuation">\</span>
<span class="token parameter variable">-d</span> <span class="token number">192.168</span>.1.19/api-gateway/api-gateway-center:1.0.0 CP4-LISTEN:8001,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock TCP4-LISTEN:8001,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock

<span class="token comment">#停止并删除容器和容器镜像</span>
<span class="token function">docker</span> stop api-gateway-center <span class="token operator">&amp;&amp;</span> <span class="token function">docker</span> <span class="token function">rm</span> api-gateway-center <span class="token operator">&amp;&amp;</span> <span class="token function">docker</span> rmi <span class="token number">192.168</span>.1.19/api-gateway/api-gateway-center:1.0.0
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><ul><li><p>-v 设置对应的挂在文件夹和docker的映射文件</p></li> <li><p>另外还需要开启监听端口，否则不能在docker容器中的java应用对另外一个服务操作。</p> <ul><li><p><strong>CP4-LISTEN</strong>：这个命令通常用于设置一个自定义的网络监听端口，以便容器内的应用程序可以接受传入的连接。它的语法可能如下所示：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>CP4-LISTEN:&lt;端口号&gt;,&lt;选项&gt;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li><code>&lt;端口号&gt;</code>：指定要监听的端口号。</li> <li><code>&lt;选项&gt;</code>：可以包括一些选项，如 &quot;fork&quot;（分叉处理连接）和 &quot;reuseaddr&quot;（重用地址）。这些选项通常根据应用程序的需求进行设置。</li></ul> <p>示例：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>CP4-LISTEN:8000,fork,reuseaddr
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div></li> <li><p><strong>TCP4-LISTEN</strong>：与 <code>CP4-LISTEN</code> 类似，这个命令用于设置TCP网络监听。它的语法也包括端口号和选项：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>TCP4-LISTEN:&lt;端口号&gt;,&lt;选项&gt;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li><code>&lt;端口号&gt;</code>：指定要监听的TCP端口号。</li> <li><code>&lt;选项&gt;</code>：可以包括一些选项，如 &quot;fork&quot;（分叉处理连接）和 &quot;reuseaddr&quot;（重用地址），根据应用程序的需求进行设置。</li></ul> <p>示例：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>TCP4-LISTEN:8080,reuseaddr
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div></li></ul> <blockquote><p>Docker 开启 2375 端口，并且只允许某些指定的ip 才能访问。</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">vim</span> /usr/lib/systemd/system/docker.service

<span class="token punctuation">[</span>Service<span class="token punctuation">]</span>
<span class="token assign-left variable">Type</span><span class="token operator">=</span>notify
<span class="token comment"># the default is not to use systemd for cgroups because the delegate issues still</span>
<span class="token comment"># exists and systemd currently does not support the cgroup feature set required</span>
<span class="token comment"># for containers run by docker</span>
<span class="token comment"># ExecStart=/usr/bin/dockerd -H fd:// --containerd=/run/containerd/containerd.sock # 注掉</span>
<span class="token assign-left variable">ExecStart</span><span class="token operator">=</span>/usr/bin/dockerd <span class="token parameter variable">-H</span> tcp://0.0.0.0:2375 <span class="token parameter variable">-H</span> unix:///var/run/docker.sock    <span class="token comment"># 新增  </span>
<span class="token assign-left variable">ExecReload</span><span class="token operator">=</span>/bin/kill <span class="token parameter variable">-s</span> HUP <span class="token variable">$MAINPID</span>
<span class="token assign-left variable">TimeoutSec</span><span class="token operator">=</span><span class="token number">0</span>
<span class="token assign-left variable">RestartSec</span><span class="token operator">=</span><span class="token number">2</span>
<span class="token assign-left variable">Restart</span><span class="token operator">=</span>always
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment">#重启</span>
systemctl daemon-reload
systemctl restart <span class="token function">docker</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><div class="language- line-numbers-mode"><pre class="language-text"><code>docker -H tcp://192.168.1.19:2375 version
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>一种常用的方法是使用<code>iptables-save</code>和<code>iptables-restore</code>命令来保存和加载规则。下面是如何执行这些操作的步骤：</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">sudo</span> iptables <span class="token parameter variable">-A</span> INPUT <span class="token parameter variable">-p</span> tcp <span class="token parameter variable">--dport</span> <span class="token number">4610</span> <span class="token parameter variable">-s</span> <span class="token number">192.168</span>.1.107 <span class="token parameter variable">-j</span> ACCEPT
<span class="token function">sudo</span> iptables <span class="token parameter variable">-A</span> INPUT <span class="token parameter variable">-p</span> tcp <span class="token parameter variable">--dport</span> <span class="token number">4610</span> <span class="token parameter variable">-s</span> <span class="token number">192.168</span>.1.216 <span class="token parameter variable">-j</span> ACCEPT
<span class="token function">sudo</span> iptables <span class="token parameter variable">-A</span> INPUT <span class="token parameter variable">-p</span> tcp <span class="token parameter variable">--dport</span> <span class="token number">4610</span> <span class="token parameter variable">-s</span> <span class="token number">192.168</span>.1.218 <span class="token parameter variable">-j</span> ACCEPT
<span class="token function">sudo</span> iptables <span class="token parameter variable">-A</span> INPUT <span class="token parameter variable">-p</span> tcp <span class="token parameter variable">--dport</span> <span class="token number">4610</span> <span class="token parameter variable">-s</span> <span class="token number">192.168</span>.1.18 <span class="token parameter variable">-j</span> ACCEPT
<span class="token function">sudo</span> iptables <span class="token parameter variable">-A</span> INPUT <span class="token parameter variable">-p</span> tcp <span class="token parameter variable">--dport</span> <span class="token number">4610</span> <span class="token parameter variable">-j</span> DROP
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><ol><li><p><strong>保存规则</strong>：</p> <p>使用以下命令将当前的<code>iptables</code>规则保存到文件中：</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">sudo</span> iptables-save <span class="token operator">&gt;</span> /etc/iptables/rules.v4  <span class="token comment"># IPv4规则</span>
<span class="token function">sudo</span> ip6tables-save <span class="token operator">&gt;</span> /etc/iptables/rules.v6  <span class="token comment"># IPv6规则（如果适用）</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>这将把规则保存到指定的文件中。</p></li> <li><p><strong>加载规则</strong>：</p> <p>当系统重新启动后，可以使用以下命令将保存的规则加载回来：</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">sudo</span> iptables-restore <span class="token operator">&lt;</span> /etc/iptables/rules.v4  <span class="token comment"># IPv4规则</span>
<span class="token function">sudo</span> ip6tables-restore <span class="token operator">&lt;</span> /etc/iptables/rules.v6  <span class="token comment"># IPv6规则（如果适用）</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>这将从指定的文件中加载规则，以便它们在系统启动时自动应用。</p></li> <li><p><strong>自动加载规则</strong>：</p> <p>要在系统启动时自动加载规则，你可以将加载规则的命令添加到启动脚本中。在不同的Linux发行版上，可以使用不同的方法来实现自动加载规则。以下是一些示例：</p> <ul><li><p><strong>Ubuntu</strong>：使用<code>iptables-persistent</code>软件包来保存和加载规则。</p> <p>安装软件包：</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">sudo</span> <span class="token function">apt-get</span> update
<span class="token function">sudo</span> <span class="token function">apt-get</span> <span class="token function">install</span> iptables-persistent
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>在安装过程中，你将被提示保存当前的规则。以后，规则将在系统启动时自动加载。</p></li> <li><p><strong>CentOS/RHEL</strong>：在<code>/etc/rc.d/rc.local</code>文件中添加加载规则的命令，确保文件具有可执行权限。</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>
<span class="token function">sudo</span> <span class="token function">nano</span> /etc/rc.d/rc.local
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>在文件中添加以下内容：</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># 加载iptables规则</span>
/sbin/iptables-restore <span class="token operator">&lt;</span> /etc/iptables/rules.v4
/sbin/ip6tables-restore <span class="token operator">&lt;</span> /etc/iptables/rules.v6
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>然后，为文件赋予可执行权限：</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>
<span class="token function">sudo</span> <span class="token function">chmod</span> +x /etc/rc.d/rc.local
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div></li></ul> <p>请根据你使用的Linux发行版选择适合的方法，并根据需要调整规则文件的路径和名称。</p></li></ol></blockquote></li></ul> <h2 id="测试验证"><a href="#测试验证" class="header-anchor">#</a> <strong>测试验证</strong></h2> <p>准备事项；</p> <ol><li>使用 <code>Java WebSocke</code>t 模拟3组 API 服务。个人测试注意IP变更</li> <li>在 Docker 容器配置好 Nginx 服务，并确定挂载文件 <a href="http://nginx.conf/" target="_blank" rel="noopener noreferrer">nginx.conf<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li>在 Docker 容器，打包、部署 api-gateway-center 服务，记得要做先构建再打包再部署。部署的时候使用上文提到的指令。</li></ol> <h3 id="_3套-api-模拟服务"><a href="#_3套-api-模拟服务" class="header-anchor">#</a> <strong>3套 API 模拟服务</strong></h3> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-blogs/image-20231007150649656.png" alt="image-20231007150649656"></p> <h3 id="nginx-初始配置"><a href="#nginx-初始配置" class="header-anchor">#</a> <strong>Nginx 初始配置</strong></h3> <div class="language-nginx line-numbers-mode"><pre class="language-nginx"><code><span class="token directive"><span class="token keyword">user</span>  nginx</span><span class="token punctuation">;</span>
<span class="token directive"><span class="token keyword">worker_processes</span>  auto</span><span class="token punctuation">;</span>

<span class="token directive"><span class="token keyword">error_log</span>  /var/log/nginx/error.log notice</span><span class="token punctuation">;</span>
<span class="token directive"><span class="token keyword">pid</span>        /var/run/nginx.pid</span><span class="token punctuation">;</span>


<span class="token directive"><span class="token keyword">events</span></span> <span class="token punctuation">{</span>
    <span class="token directive"><span class="token keyword">worker_connections</span>  <span class="token number">1024</span></span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>


<span class="token directive"><span class="token keyword">http</span></span> <span class="token punctuation">{</span>
    <span class="token directive"><span class="token keyword">include</span>       /etc/nginx/mime.types</span><span class="token punctuation">;</span>
    <span class="token directive"><span class="token keyword">default_type</span>  application/octet-stream</span><span class="token punctuation">;</span>

    <span class="token directive"><span class="token keyword">log_format</span>  main  <span class="token string">'<span class="token variable">$remote_addr</span> - <span class="token variable">$remote_user</span> [<span class="token variable">$time_local]</span> &quot;<span class="token variable">$request</span>&quot; '</span>
                      <span class="token string">'<span class="token variable">$status</span> <span class="token variable">$body_bytes_sent</span> &quot;<span class="token variable">$http_referer</span>&quot; '</span>
                      <span class="token string">'&quot;<span class="token variable">$http_user_agent</span>&quot; &quot;<span class="token variable">$http_x_forwarded_for</span>&quot;'</span></span><span class="token punctuation">;</span>

    <span class="token directive"><span class="token keyword">access_log</span>  /var/log/nginx/access.log  main</span><span class="token punctuation">;</span>

    <span class="token directive"><span class="token keyword">sendfile</span>        <span class="token boolean">on</span></span><span class="token punctuation">;</span>
    <span class="token comment">#tcp_nopush     on;</span>

    <span class="token directive"><span class="token keyword">keepalive_timeout</span>  <span class="token number">65</span></span><span class="token punctuation">;</span>

    <span class="token comment">#gzip  on;</span>

    <span class="token directive"><span class="token keyword">include</span> /etc/nginx/conf.d/*.conf</span><span class="token punctuation">;</span>

    <span class="token comment"># 设定负载均衡的服务器列表</span>
    <span class="token directive"><span class="token keyword">upstream</span> api01</span> <span class="token punctuation">{</span>

        <span class="token directive"><span class="token keyword">least_conn</span></span><span class="token punctuation">;</span>

        <span class="token directive"><span class="token keyword">server</span> 192.168.1.216:9001</span><span class="token punctuation">;</span>
        <span class="token comment">#server 192.168.1.216:9002;</span>
    <span class="token punctuation">}</span>

    <span class="token comment"># 设定负载均衡的服务器列表</span>
    <span class="token directive"><span class="token keyword">upstream</span> api02</span> <span class="token punctuation">{</span>
        <span class="token directive"><span class="token keyword">server</span> 192.168.1.216:9003</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment"># HTTP服务器</span>
    <span class="token directive"><span class="token keyword">server</span></span> <span class="token punctuation">{</span>
        <span class="token comment"># 监听80端口，用于HTTP协议</span>
        <span class="token directive"><span class="token keyword">listen</span>  <span class="token number">80</span></span><span class="token punctuation">;</span>

        <span class="token comment"># 定义使用IP/域名访问</span>
        <span class="token directive"><span class="token keyword">server_name</span> 192.168.1.19</span><span class="token punctuation">;</span>

        <span class="token comment"># 首页</span>
        <span class="token directive"><span class="token keyword">index</span> index.html</span><span class="token punctuation">;</span>

        <span class="token comment"># 反向代理的路径（upstream绑定），location 后面设置映射的路径</span>
        <span class="token directive"><span class="token keyword">location</span> /</span> <span class="token punctuation">{</span>
            <span class="token directive"><span class="token keyword">proxy_pass</span> http://192.168.1.216:9001</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>

        <span class="token directive"><span class="token keyword">location</span> /api01/</span> <span class="token punctuation">{</span>
            <span class="token directive"><span class="token keyword">proxy_pass</span> http://api01</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>

         <span class="token directive"><span class="token keyword">location</span> /api02/</span> <span class="token punctuation">{</span>
            <span class="token directive"><span class="token keyword">proxy_pass</span> http://api02</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><ul><li>此内容来自于 docker-java https://github.com/docker-java/docker-java/issues/991 可以扩展学习</li></ul> <h2 id="本章小结"><a href="#本章小结" class="header-anchor">#</a> <strong>本章小结</strong></h2> <p>本节内容涵盖了以下核心主题：</p> <p><strong>文件挂载与访问</strong>：我们深入研究了如何在 Docker 容器中挂载文件，以及如何确保其他应用程序可以访问这些挂载的文件。这对于容器内外的数据共享和协作至关重要。</p> <p><strong>Java 指令与 Docker 容器</strong>：我们介绍了如何使用 Java 指令来实现对在 Docker 容器中运行的服务进行动态操作。这种技能在 DevOps 流程中非常普遍，有助于开发团队更高效地管理服务的生命周期。</p> <p><strong>智能化操作与 DevOps</strong>：实际上，类似自动化和智能化操作在大型组织中非常常见，尤其是在服务上线和 DevOps 流程中。通过简单的配置和自动化脚本，可以完成各种复杂的任务，从而解放了研发团队的双手。</p> <p><strong>深入了解核心原理</strong>：然而，如果研发人员没有对底层原理有足够的了解，可能会受限于他们可以执行的任务和做出的决策。因此，了解底层工作原理对于职业发展至关重要，以避免成为纯粹的“工具人”。</p> <h2 id="扩展内容"><a href="#扩展内容" class="header-anchor">#</a> <strong>扩展内容</strong></h2> <p>如果不是部署到 Docker 容器，那么通过Java程序操作Nginx会更简单；</p> <ol><li><p>在 Java 程序中读取 Nginx 的配置文件，比如 &quot;/etc/nginx/<a href="http://nginx.conf/" target="_blank" rel="noopener noreferrer">nginx.conf<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>&quot; 文件。</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">File</span> configFile <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">File</span><span class="token punctuation">(</span><span class="token string">&quot;/etc/nginx/nginx.conf&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">String</span> configContent <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">String</span><span class="token punctuation">(</span><span class="token class-name">Files</span><span class="token punctuation">.</span><span class="token function">readAllBytes</span><span class="token punctuation">(</span>configFile<span class="token punctuation">.</span><span class="token function">toPath</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div></li> <li><p>修改配置文件内容，比如添加一条新的反向代理配置。</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">String</span> newConfig <span class="token operator">=</span> configContent <span class="token operator">+</span> <span class="token string">&quot;\n&quot;</span> <span class="token operator">+</span>
                  <span class="token string">&quot;location /app {\n&quot;</span> <span class="token operator">+</span>
                  <span class="token string">&quot;  proxy_pass http://localhost:8080/app;\n&quot;</span> <span class="token operator">+</span>
                  <span class="token string">&quot;}&quot;</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div></li> <li><p>将修改后的配置文件写入到 Nginx 配置目录下的一个新文件中，比如 &quot;/etc/nginx/<a href="http://nginx.conf.new/" target="_blank" rel="noopener noreferrer">nginx.conf<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>&quot; 文件。</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">File</span> newConfigFile <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">File</span><span class="token punctuation">(</span><span class="token string">&quot;/etc/nginx/nginx.conf.new&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">Files</span><span class="token punctuation">.</span><span class="token function">write</span><span class="token punctuation">(</span>newConfigFile<span class="token punctuation">.</span><span class="token function">toPath</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> newConfig<span class="token punctuation">.</span><span class="token function">getBytes</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div></li> <li><p>通过执行操作系统命令来重载 Nginx 配置。</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">ProcessBuilder</span> pb <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ProcessBuilder</span><span class="token punctuation">(</span><span class="token string">&quot;nginx&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;-t&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
pb<span class="token punctuation">.</span><span class="token function">redirectErrorStream</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">Process</span> process <span class="token operator">=</span> pb<span class="token punctuation">.</span><span class="token function">start</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
process<span class="token punctuation">.</span><span class="token function">waitFor</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">if</span> <span class="token punctuation">(</span>process<span class="token punctuation">.</span><span class="token function">exitValue</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
   <span class="token class-name">ProcessBuilder</span> pbReload <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ProcessBuilder</span><span class="token punctuation">(</span><span class="token string">&quot;nginx&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;-s&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;reload&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
   pbReload<span class="token punctuation">.</span><span class="token function">redirectErrorStream</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
   <span class="token class-name">Process</span> processReload <span class="token operator">=</span> pbReload<span class="token punctuation">.</span><span class="token function">start</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
   processReload<span class="token punctuation">.</span><span class="token function">waitFor</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>以上代码中，首先使用 &quot;nginx -t&quot; 命令来检查新的配置文件是否有语法错误，如果检查通过，则使用 &quot;nginx -s reload&quot; 命令来重载 Nginx 配置。注意，这些命令需要在执行 Java 程序的操作系统中已经安装了 Nginx。</p></li> <li><p>最后，您可以将新的配置文件重命名为原来的文件名，以覆盖原来的配置文件。</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code>configFile<span class="token punctuation">.</span><span class="token function">delete</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
newConfigFile<span class="token punctuation">.</span><span class="token function">renameTo</span><span class="token punctuation">(</span>configFile<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>通过以上步骤，就可以通过 Java 程序更新 Nginx 配置文件并重载配置了。当然，这只是一个简单的实现，您还需要考虑一些异常情况，比如在写入新配置文件时出现错误等等。</p></li></ol></div></div>  <div class="page-edit"><div class="edit-link"><a href="https://github.com/lixuanfengs/cactus-vuepress-sc/edit/master/docs/《API网关设计与实现》/30.动态刷新网关Nginx负载均衡配置.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <div class="tags"><a href="/tags/?tag=gateway" title="标签">#gateway</a></div> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2023/10/09, 17:38:07</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/13559a/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">网关Nginx负载模型配置</div></a> <a href="/pages/dea686/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">实现网关算力节点动态负载功能</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
