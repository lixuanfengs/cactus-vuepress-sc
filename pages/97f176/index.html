href="/pages/97f176/#工程结构" class="sidebar-link">工程结构</a></li><li class="sidebar-sub-header level3"><a href="/pages/97f176/#配置文件" class="sidebar-link">配置文件</a></li><li class="sidebar-sub-header level3"><a href="/pages/97f176/#注册调用" class="sidebar-link">注册调用</a></li><li class="sidebar-sub-header level3"><a href="/pages/97f176/#应用监听" class="sidebar-link">应用监听</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/pages/97f176/#测试验证" class="sidebar-link">测试验证</a></li><li class="sidebar-sub-header level2"><a href="/pages/97f176/#本章小结" class="sidebar-link">本章小结</a></li></ul></li><li><a href="/pages/851b37/" class="sidebar-link">网关映射聚合信息查询实现</a></li><li><a href="/pages/46b1c6/" class="sidebar-link">服务配置拉取和组件使用验证</a></li><li><a href="/pages/5d5836/" class="sidebar-link">网络通信配置提取</a></li><li><a href="/pages/bdae4e/" class="sidebar-link">核心通信组件管理和处理服务映射</a></li><li><a href="/pages/c2f223/" class="sidebar-link">容器关闭监听和异常管理</a></li><li><a href="/pages/81289e/" class="sidebar-link">网关引擎打包镜像部署</a></li><li><a href="/pages/3750a4/" class="sidebar-link">服务注册组件搭建采集接口信息</a></li><li><a href="/pages/46c35f/" class="sidebar-link">应用服务接口注册到注册中心</a></li><li><a href="/pages/bb3695/" class="sidebar-link">订阅服务注册消息驱动网关映射</a></li><li><a href="/pages/2d7dcf/" class="sidebar-link">网关运营管理后台框架搭建</a></li><li><a href="/pages/6936ee/" class="sidebar-link">前后端分离应用的跨域接口调用</a></li><li><a href="/pages/13559a/" class="sidebar-link">网关Nginx负载模型配置</a></li><li><a href="/pages/918d1a/" class="sidebar-link">动态刷新网关Nginx负载均衡配置</a></li><li><a href="/pages/dea686/" class="sidebar-link">实现网关算力节点动态负载功能</a></li><li><a href="/pages/1bdcba/" class="sidebar-link">网关组件工程模块合并</a></li><li><a href="/pages/d9cb43/" class="sidebar-link">功能完善(算力关联、接口上报、调用反馈)</a></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/note/Gateway/#《API网关设计与实现》" data-v-06225672>《API网关设计与实现》</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2023-06-26</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->服务发现组件搭建和注册网关连接<!----></h1>  <div class="theme-vdoing-content content__default"><h2 id="学习方法"><a href="#学习方法" class="header-anchor">#</a> <strong>学习方法</strong></h2> <p>在软件开发中，封装和抽象是非常重要的概念，不能把所有的功能逻辑都直接暴露给外部。一个好的API网关需要提供清晰的API接口和文档，同时对底层服务进行合理的封装和抽象，保证整个系统具有稳定性和可维护性。这样，即使底层服务发生变化，接口和文档也可以保持不变，极大地减少了维护成本。</p> <h2 id="组件封装"><a href="#组件封装" class="header-anchor">#</a> <strong>组件封装</strong></h2> <p>本章的最大目的在于搭建起用于封装网关算力服务的 api-gateway-core 系统为目的，提供网关服务注册发现能力。那么之所以要开发一个这样的组件，也就是 SpringBoot Starter。是因为我们希望把这样的统一公用能力进行一致的管理，如果没有这样的组件服务，那么将需要每一个 SpringBoot 服务都要做类似这样的事情，整体来看就会耗费很大的成本，所以要把这样的功能进行封装整合。</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/image-20230628094638965.png" alt="image-20230628094638965"></p> <ul><li><p>api-gateway-core 是网关的算力服务，api-gateway-center 是网关的注册中心，那么为了把这块服务链接起来，中间则需要一套 api-gateway-engin 网关的引擎，用于启动网关的算力服务。</p></li> <li><p>但由于启动网关的算力服务还需要一些功能的整合，来包装网关算力到注册中心的连接，所以这部分需要整合到 api-gateway-assist 这个辅助组件，它是一个 SpringBoot Starter 起到包装和连接的作用。</p></li></ul> <h2 id="功能实现"><a href="#功能实现" class="header-anchor">#</a> <strong>功能实现</strong></h2> <h3 id="工程结构"><a href="#工程结构" class="header-anchor">#</a> <strong>工程结构</strong></h3> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/image-20230628105853365.png" alt="image-20230628105853365"></p> <ul><li>源码：------</li></ul> <h3 id="配置文件"><a href="#配置文件" class="header-anchor">#</a> <strong>配置文件</strong></h3> <p><strong>源码详见：cn.cactusli.gateway.assist.config.GatewayServiceProperties</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@ConfigurationProperties</span><span class="token punctuation">(</span><span class="token string">&quot;api-gateway&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">GatewayServiceProperties</span> <span class="token punctuation">{</span>

    <span class="token comment">/** 注册中心地址 */</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> address<span class="token punctuation">;</span>
    <span class="token comment">/** 分组ID */</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> groupId<span class="token punctuation">;</span>
    <span class="token comment">/** 网关ID */</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> gatewayId<span class="token punctuation">;</span>
    <span class="token comment">/** 网关名称 */</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> gatewayName<span class="token punctuation">;</span>
    <span class="token comment">/** 网关地址 */</span>
