p> <ul class="sidebar-links sidebar-group-items"><li><a href="/pages/8510bd/" class="sidebar-link">集群环境准备</a></li><li><a href="/pages/9eda68/" aria-current="page" class="active sidebar-link">安装第三方服务</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level2"><a href="/pages/9eda68/#时区设置" class="sidebar-link">时区设置</a></li><li class="sidebar-sub-header level2"><a href="/pages/9eda68/#安装docker" class="sidebar-link">安装Docker</a></li><li class="sidebar-sub-header level2"><a href="/pages/9eda68/#安装docker-compose" class="sidebar-link">安装Docker compose</a></li><li class="sidebar-sub-header level2"><a href="/pages/9eda68/#安装mysql、redis" class="sidebar-link">安装MySQL、Redis</a></li><li class="sidebar-sub-header level2"><a href="/pages/9eda68/#安装elk" class="sidebar-link">安装ELK</a></li><li class="sidebar-sub-header level2"><a href="/pages/9eda68/#小结" class="sidebar-link">小结</a></li></ul></li><li><a href="/pages/9a7908/" class="sidebar-link">Kubeadm搭建K8S 1.16.2集群</a></li><li><a href="/pages/f5823d/" class="sidebar-link">NFS服务器搭建</a></li><li><a href="/pages/144dd2/" class="sidebar-link">搭建Docker镜像仓库Harbor</a></li><li><a href="/pages/fa213a/" class="sidebar-link">K8S构建高可用Nacos</a></li><li><a href="/pages/12c6d7/" class="sidebar-link">K8S构建FEBS Cloud服务集群</a></li><li><a href="/pages/91f545/" class="sidebar-link">部署前端测试</a></li><li><a href="/pages/4836d0/" class="sidebar-link">K8S实践总结</a></li></ul></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>分布式事务</span> <span class="arrow right"></span></p> <!----></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/note/SpringCloud-febs/#《SpringCloud微服务权限系统搭建》笔记" data-v-06225672>《SpringCloud微服务权限系统搭建》笔记</a></li><li data-v-06225672><a href="/note/SpringCloud-febs/#K8S集群部署" data-v-06225672>K8S集群部署</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2022-05-10</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->安装第三方服务<!----></h1>  <div class="theme-vdoing-content content__default"><p>这一节我们需要安装的内容较多，包括Docker、Docker Compose、MySQL、Redis、ELK等软件。</p> <h2 id="时区设置"><a href="#时区设置" class="header-anchor">#</a> 时区设置</h2> <p>调整master、node1、node2、node3、nfs和extend这几台虚拟机的时区：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>yum -y install ntp
#通过阿里云时间服务器校准时间
ntpdate ntp1.aliyun.com
# 设置时区为上海
timedatectl set-timezone Asia/Shanghai
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>因为时区不正确的话，会影响令牌有效性校验。</p> <p>设置后，使用<code>timedatectl</code>命令查看下时间是否和当前北京时间相符合。</p> <h2 id="安装docker"><a href="#安装docker" class="header-anchor">#</a> 安装Docker</h2> <p>后续需要安装的kubernetes集群版本为1.16.2，该版本的kubernetes最高支持的docker版本为18.09。可以通过该地址查看kubernetes和docker的版本对应关系：https://github.com/kubernetes/kubernetes/blob/master/CHANGELOG-1.16.md#downloads-for-v1160：</p> <p><img src="https://s2.ax1x.com/2019/12/06/QYNyXF.png" alt="525.png"></p> <p>需要安装Docker的虚拟机有：master、node1、node2、node3和extend，下面以master为例，演示如何安装Docker 18.09。</p> <p>使用<code>vagrant ssh master</code>命令连接master虚拟机，然后通过<code>sudo -s</code>命令切换到root账号。</p> <p>安装必要依赖:</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>yum install -y yum-utils \
  device-mapper-persistent-data \
  lvm2
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>添加docker稳定版仓库：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>yum-config-manager \
    --add-repo \
    https://download.docker.com/linux/centos/docker-ce.repo
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>安装18.09版本：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>yum -y install docker-ce-18.09.0 docker-ce-cli-18.09.0 containerd.io
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>启动docker，并设置开机自启：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>systemctl enable docker &amp;&amp; systemctl start docker
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>修改/etc/docker/daemon.json文件:</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>vi /etc/docker/daemon.json
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>添加国内镜像加速地址：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>{
  &quot;registry-mirrors&quot;: [
    &quot;https://dockerhub.azk8s.cn&quot;,
    &quot;https://reg-mirror.qiniu.com&quot;,
    &quot;https://registry.docker-cn.com&quot;
  ]
}
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>重启docker：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>systemctl daemon-reload
systemctl restart docker
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>验证下是否安装成功：</p> <p><img src="https://s2.ax1x.com/2019/12/06/QYUr4I.png" alt="526.png"></p> <h2 id="安装docker-compose"><a href="#安装docker-compose" class="header-anchor">#</a> 安装Docker compose</h2> <p>需要安装Docker Compose的虚拟机有：master和extend。以master为例：</p> <p>下载Docker Compose文档版本：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>sudo curl -L &quot;https://github.com/docker/compose/releases/download/1.25.0/docker-compose-$(uname -s)-$(uname -m)&quot; -o /usr/local/bin/docker-compose
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>对下载的文件添加可执行权限：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>sudo chmod +x /usr/local/bin/docker-compose
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>创建软连接：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>测试一下是否安装成功：</p> <p><img src="https://s2.ax1x.com/2019/12/06/QYajQf.png" alt="527.png"></p> <h2 id="安装mysql、redis"><a href="#安装mysql、redis" class="header-anchor">#</a> 安装MySQL、Redis</h2> <p>在extend虚拟机上安装MySQL和Redis服务。</p> <p>登录extend虚拟机后，在当前目录（/home/vagrant）下创建mysql-redis.yml配置文件：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>vi mysql-redis.yml
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>文件内容如下所示：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>version: '3'

services:
  mysql:
    image: mysql:5.7.24 # MySQL镜像
    container_name: mysql # MySQL容器名称
    environment:
      MYSQL_ROOT_PASSWORD: 123456 # MySQL ROOT账号密码
    ports:
      - 3306:3306 # 端口映射
    volumes:
      - /febs/mysql/data:/var/lib/mysql #挂载 MySQL数据
  redis:
    image: redis:4.0.14 # Redis镜像
    container_name: redis # Redis容器名称
    command: redis-server /usr/local/etc/redis/redis.conf --appendonly yes # 表示通过挂载配置文件追加配置
    volumes:
      - /febs/redis/data:/data #挂载 Redis数据
      - /febs/redis/conf/redis.conf:/usr/local/etc/redis/redis.conf #挂载 Redis配置
    ports:
      - 6379:6379 # 端口映射
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br></div></div><p>然后创建这些挂载目录：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>mkdir -p /febs/mysql/data /febs/redis/data /febs/redis/conf
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>创建redis挂载的配置文件redis.conf：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>vi /febs/redis/conf/redis.conf
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>添加如下内容：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>requirepass 123456
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>然后运行如下命令创建MySQL和Redis容器：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>docker-compose -f mysql-redis.yml up -d
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>启动好后，查看Docker容器状态：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>docker ps -a | grep -E &quot;mysql|redis&quot;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><img src="https://s2.ax1x.com/2019/12/06/QY0Nid.png" alt="528.png"></p> <p>启动顺利，在Windows上使用Navicat测试下MySQL的连通性：</p> <p><img src="https://s2.ax1x.com/2019/12/06/QY0xOK.png" alt="529.png"></p> <p>在MySQL下新建febs_cloud_base数据库：</p> <p><img src="https://s2.ax1x.com/2019/12/06/QYBG60.png" alt="530.png"></p> <p>然后导入FEBS Cloud项目febs_cloud_base.sql脚本。</p> <p>接着测试Redis的连通性，在windows下使用RedisDesktopManager连接Redis：</p> <p><img src="https://s2.ax1x.com/2019/12/06/QYBHnf.png" alt="531.png"></p> <p>连接成功。</p> <h2 id="安装elk"><a href="#安装elk" class="header-anchor">#</a> 安装ELK</h2> <p>在extend虚拟机的/home/vagrant目录下新建elk.yml配置文件：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>vi elk.yml
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>内容如下所示：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>version: '3'

services:
  elasticsearch:
    image: elasticsearch:6.4.1
    container_name: elasticsearch
    restart: always
    environment:
      - cluster.name=elasticsearch
      - xpack.security.enabled=false
      - &quot;ES_JAVA_OPTS=-Xms512m -Xmx512m&quot;
      - node.name=elasticsearch_node_1
      - &quot;TZ=Asia/Shanghai&quot;
    volumes:
      - /febs/elasticsearch/data:/usr/share/elasticsearch/data
      - /febs/elasticsearch/logs:/usr/share/elasticsearch/logs
      - /febs/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    ports:
      - 9200:9200
      - 9300:9300
  kibana:
    image: kibana:6.4.1
    container_name: kibana
    links:
      - elasticsearch:es
    depends_on:
      - elasticsearch
    environment:
      - &quot;elasticsearch.hosts=http://es:9200&quot;
    ports:
      - 5601:5601
  logstash:
    image: logstash:6.4.1
    container_name: logstash
    volumes:
      - /febs/logstash/logstash-febs.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch
    links:
      - elasticsearch:es
    ports:
      - 4560:4560
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br></div></div><p>ELK配置文件在前面的章节中都有介绍过，所以这里就不再赘述每个配置含义了。</p> <p>同样的，在启动这些容器之前，我们先创建相应的挂载目录和配置文件：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code># 创建挂载目录
mkdir -p /febs/elasticsearch/data /febs/elasticsearch/logs /febs/logstash
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>对Elasticsearch的挂载目录授予最高权限：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>chmod 777 -R /febs/elasticsearch
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>创建Elasticsearch配置文件elasticsearch.yml：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>vi /febs/elasticsearch/elasticsearch.yml
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>添加如下内容：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>http.host: 0.0.0.0
http.cors.enabled: true
http.cors.allow-origin: &quot;*&quot;
transport.host: 0.0.0.0
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>接着创建Logstash配置文件logstash-febs.conf：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>vi /febs/logstash/logstash-febs.conf
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>添加如下内容：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>input {
  tcp {
    mode =&gt; &quot;server&quot;
    host =&gt; &quot;0.0.0.0&quot;
    port =&gt; 4560
    codec =&gt; json_lines
  }
}
output {
  elasticsearch {
    hosts =&gt; &quot;es:9200&quot;
    index =&gt; &quot;febs-logstash-%{+YYYY.MM.dd}&quot;
  }
}
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>Elasticsearch默认使用mmapfs目录来存储索引。操作系统默认的mmap计数太低可能导致内存不足，我们可以使用下面这条命令来增加内存：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>sysctl -w vm.max_map_count=262144
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>准备完毕后，运行下面这条命令创建这些容器：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>docker-compose -f elk.yml up -d
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>启动的时候要拉取镜像，稍等片刻后，查看容器状态：</p> <p><img src="https://s2.ax1x.com/2019/12/12/QyQRHK.png" alt="532.png"></p> <p>可以看到容器都处于UP状态。</p> <p>在Windows下使用浏览器访问：http://192.168.33.16:9200/：</p> <p><img src="https://s2.ax1x.com/2019/12/07/Qt5t5n.png" alt="533.png"></p> <p>这说明Elasticsearch启动成功。</p> <p>浏览器访问：http://192.168.33.16:5601/：</p> <p><img src="https://s2.ax1x.com/2019/12/07/Qt5Xxf.png" alt="535.png"></p> <p>说明Kibana启动成功。</p> <p>接着回到extend虚拟机，使用如下命令进入到Logstash容器中：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>docker exec -it logstash sh
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>切换到/bin目录，安装json_lines插件，然后退出：</p> <p><img src="https://s2.ax1x.com/2019/12/07/QtI1Rx.png" alt="536.png"></p> <h2 id="小结"><a href="#小结" class="header-anchor">#</a> 小结</h2> <p>到这里，我们已经安装的服务有：</p> <table><thead><tr><th style="text-align:left;">服务名</th> <th style="text-align:left;">IP地址</th> <th style="text-align:left;">端口号</th></tr></thead> <tbody><tr><td style="text-align:left;">MySQL</td> <td style="text-align:left;">192.168.33.16</td> <td style="text-align:left;">3306</td></tr> <tr><td style="text-align:left;">Redis</td> <td style="text-align:left;">192.168.33.16</td> <td style="text-align:left;">6379</td></tr> <tr><td style="text-align:left;">logstash</td> <td style="text-align:left;">192.168.33.16</td> <td style="text-align:left;">4560</td></tr> <tr><td style="text-align:left;">kibana</td> <td style="text-align:left;">192.168.33.16</td> <td style="text-align:left;">5601</td></tr> <tr><td style="text-align:left;">elasticsearch</td> <td style="text-align:left;">192.168.33.16</td> <td style="text-align:left;">9200、9300</td></tr></tbody></table> <p>接下来，我们开始搭建K8S集群。</p></div></div>  <div class="page-edit"><div class="edit-link"><a href="https://github.com/lixuanfengs/cactus-vuepress-sc/edit/master/docs/《SpringCloud微服务权限系统搭建》笔记/09.K8S集群部署/02.安装第三方服务.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <!----> <div class="last-updated"><span class="prefi
