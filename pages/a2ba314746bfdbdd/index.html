</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p><strong>（2）Atomics.exchange()</strong></p> <p>Worker 线程如果要写入数据，可以使用上面的<code>Atomics.store()</code>方法，也可以使用<code>Atomics.exchange()</code>方法。它们的区别是，<code>Atomics.store()</code>返回写入的值，而<code>Atomics.exchange()</code>返回被替换的值。</p> <div class="language-javascript line-numbers-mode"><pre class="language-javascript"><code><span class="token comment">// Worker 线程</span>
self<span class="token punctuation">.</span><span class="token function">addEventListener</span><span class="token punctuation">(</span><span class="token string">'message'</span><span class="token punctuation">,</span> <span class="token punctuation">(</span><span class="token parameter">event</span><span class="token punctuation">)</span> <span class="token operator">=&gt;</span> <span class="token punctuation">{</span>
  <span class="token keyword">const</span> sharedArray <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Int32Array</span><span class="token punctuation">(</span>event<span class="token punctuation">.</span>data<span class="token punctuation">)</span><span class="token punctuation">;</span>
  <span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token keyword">let</span> i <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> <span class="token number">10</span><span class="token punctuation">;</span> i<span class="token operator">++</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">if</span> <span class="token punctuation">(</span>i <span class="token operator">%</span> <span class="token number">2</span> <span class="token operator">===</span> <span class="token number">0</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
      <span class="token keyword">const</span> storedValue <span class="token operator">=</span> Atomics<span class="token punctuation">.</span><span class="token function">store</span><span class="token punctuation">(</span>sharedArray<span class="token punctuation">,</span> i<span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
      console<span class="token punctuation">.</span><span class="token function">log</span><span class="token punctuation">(</span><span class="token template-string"><span class="token template-punctuation string">`</span><span class="token string">The item at array index </span><span class="token interpolation"><span class="token interpolation-punctuation punctuation">${</span>i<span class="token interpolation-punctuation punctuation">}</span></span><span class="token string"> is now </span><span class="token interpolation"><span class="token interpolation-punctuation punctuation">${</span>storedValue<span class="token interpolation-punctuation punctuation">}</span></span><span class="token template-punctuation string">`</span></span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
      <span class="token keyword">const</span> exchangedValue <span class="token operator">=</span> Atomics<span class="token punctuation">.</span><span class="token function">exchange</span><span class="token punctuation">(</span>sharedArray<span class="token punctuation">,</span> i<span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
      console<span class="token punctuation">.</span><span class="token function">log</span><span class="token punctuation">(</span><span class="token template-string"><span class="token template-punctuation string">`</span><span class="token string">The item at array index </span><span class="token interpolation"><span class="token interpolation-punctuation punctuation">${</span>i<span class="token interpolation-punctuation punctuation">}</span></span><span class="token string"> was </span><span class="token interpolation"><span class="token interpolation-punctuation punctuation">${</span>exchangedValue<span class="token interpolation-punctuation punctuation">}</span></span><span class="token string">, now 2</span><span class="token template-punctuation string">`</span></span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token boolean">false</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>上面代码将共享内存的偶数位置的值改成<code>1</code>，奇数位置的值改成<code>2</code>。</p> <p><strong>（3）Atomics.wait()，Atomics.wake()</strong></p> <p>使用<code>while</code>循环等待主线程的通知，不是很高效，如果用在主线程，就会造成卡顿，<code>Atomics</code>对象提供了<code>wait()</code>和<code>wake()</code>两个方法用于等待通知。这两个方法相当于锁内存，即在一个线程进行操作时，让其他线程休眠（建立锁），等到操作结束，再唤醒那些休眠的线程（解除锁）。</p> <div class="language-javascript line-numbers-mode"><pre class="language-javascript"><code><span class="token comment">// Worker 线程</span>
self<span class="token punctuation">.</span><span class="token function">addEventListener</span><span class="token punctuation">(</span><span class="token string">'message'</span><span class="token punctuation">,</span> <span class="token punctuation">(</span><span class="token parameter">event</span><span class="token punctuation">)</span> <span class="token operator">=&gt;</span> <span class="token punctuation">{</span>
  <span class="token keyword">const</span> sharedArray <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Int32Array</span><span class="token punctuation">(</span>event<span class="token punctuation">.</span>data<span class="token punctuation">)</span><span class="token punctuation">;</span>
  <span class="token keyword">const</span> arrayIndex <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>
  <span class="token keyword">const</span> expectedStoredValue <span class="token operator">=</span> <span class="token number">50</span><span class="token punctuation">;</span>
  Atomics<span class="token punctuation">.</span><span class="token function">wait</span><span class="token punctuation">(</span>sharedArray<span class="token punctuation">,</span> arrayIndex<span class="token punctuation">,</span> expectedStoredValue<span class="token punctuation">)</span><span class="token punctuation">;</span>
  console<span class="token punctuation">.</span><span class="token function">log</span><span class="token punctuation">(</span>Atomics<span class="token punctuation">.</span><span class="token function">load</span><span class="token punctuation">(</span>sharedArray<span class="token punctuation">,</span> arrayIndex<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token boolean">false</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>上面代码中，<code>Atomics.wait()</code>方法等同于告诉 Worker 线程，只要满足给定条件（<code>sharedArray</code>的<code>0</code>号位置等于<code>50</code>），就在这一行 Worker 线程进入休眠。</p> <p>主线程一旦更改了指定位置的值，就可以唤醒 Worker 线程。</p> <div class="language-javascript line-numbers-mode"><pre class="language-javascript"><code><span class="token comment">// 主线程</span>
<span class="token keyword">const</span> newArrayValue <span class="token operator">=</span> <span class="token number">100</span><span class="token punctuation">;</span>
Atomics<span class="token punctuation">.</span><span class="token function">store</span><span class="token punctuation">(</span>sharedArray<span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> newArrayValue<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">const</span> arrayIndex <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>
<span class="token keyword">const</span> queuePos <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span>
Atomics<span class="token punctuation">.</span><span class="token function">wake</span><span class="token punctuation">(</span>sharedArray<span class="token punctuation">,</span> arrayIndex<span class="token punctuation">,</span> queuePos<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>上面代码中，<code>sharedArray</code>的<code>0</code>号位置改为<code>100</code>，然后就执行<code>Atomics.wake()</code>方法，唤醒在<code>sharedArray</code>的<code>0</code>号位置休眠队列里的一个线程。</p> <p><code>Atomics.wait()</code>方法的使用格式如下。</p> <div class="language-javascript line-numbers-mode"><pre class="language-javascript"><code>Atomics<span class="token punctuation">.</span><span class="token function">wait</span><span class="token punctuation">(</span>sharedArray<span class="token punctuation">,</span> index<span class="token punctuation">,</span> value<span class="token punctuation">,</span> timeout<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>它的四个参数含义如下。</p> <ul><li>sharedArray：共享内存的视图数组。</li> <li>index：视图数据的位置（从0开始）。</li> <li>value：该位置的预期值。一旦实际值等于预期值，就进入休眠。</li> <li>timeout：整数，表示过了这个时间以后，就自动唤醒，单位毫秒。该参数可选，默认值是<code>Infinity</code>，即无限期的休眠，只有通过<code>Atomics.wake()</code>方法才能唤醒。</li></ul> <p><code>Atomics.wait()</code>的返回值是一个字符串，共有三种可能的值。如果<code>sharedArray[index]</code>不等于<code>value</code>，就返回字符串<code>not-equal</code>，否则就进入休眠。如果<code>Atomics.wake()</code>方法唤醒，就返回字符串<code>ok</code>；如果因为超时唤醒，就返回字符串<code>timed-out</code>。</p> <p><code>Atomics.wake()</code>方法的使用格式如下。</p> <div class="language-javascript line-numbers-mode"><pre class="language-javascript"><code>Atomics<span class="token punctuation">.</span><span class="token function">wake</span><span class="token punctuation">(</span>sharedArray<span class="token punctuation">,</span> index<span class="token punctuation">,</span> count<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>它的三个参数含义如下。</p> <ul><li>sharedArray：共享内存的视图数组。</li> <li>index：视图数据的位置（从0开始）。</li> <li>count：需要唤醒的 Worker 线程的数量，默认为<code>Infinity</code>。</li></ul> <p><code>Atomics.wake()</code>方法一旦唤醒休眠的 Worker 线程，就会让它继续往下运行。</p> <p>请看一个例子。</p> <div class="language-javascript line-numbers-mode"><pre class="language-javascript"><code><span class="token comment">// 主线程</span>
console<span class="token punctuation">.</span><span class="token function">log</span><span class="token punctuation">(</span>ia<span class="token punctuation">[</span><span class="token number">37</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">;</span>  <span class="token comment">// 163</span>
Atomics<span class="token punctuation">.</span><span class="token function">store</span><span class="token punctuation">(</span>ia<span class="token punctuation">,</span> <span class="token number">37</span><span class="token punctuation">,</span> <span class="token number">123456</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
Atomics<span class="token punctuation">.</span><span class="token function">wake</span><span class="token punctuation">(</span>ia<span class="token punctuation">,</span> <span class="token number">37</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// Worker 线程</span>
Atomics<span class="token punctuation">.</span><span class="token function">wait</span><span class="token punctuation">(</span>ia<span class="token punctuation">,</span> <span class="token number">37</span><span class="token punctuation">,</span> <span class="token number">163</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
console<span class="token punctuation">.</span><span class="token function">log</span><span class="token punctuation">(</span>ia<span class="token punctuation">[</span><span class="token number">37</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">;</span>  <span class="token comment">// 123456</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>上面代码中，视图数组<code>ia</code>的第 37 号位置，原来的值是<code>163</code>。Worker 线程使用<code>Atomics.wait()</code>方法，指定只要<code>ia[37]</code>等于<code>163</code>，就进入休眠状态。主线程使用<code>Atomics.store()</code>方法，将<code>123456</code>写入<code>ia[37]</code>，然后使用<code>Atomics.wake()</code>方法唤醒 Worker 线程。</p> <p>另外，基于<code>wait</code>和<code>wake</code>这两个方法的锁内存实现，可以看 Lars T Hansen 的 <a href="https://github.com/lars-t-hansen/js-lock-and-condition" target="_blank" rel="noopener noreferrer">js-lock-and-condition<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 这个库。</p> <p>注意，浏览器的主线程不宜设置休眠，这会导致用户失去响应。而且，主线程实际上会拒绝进入休眠。</p> <p><strong>（4）运算方法</strong></p> <p>共享内存上面的某些运算是不能被打断的，即不能在运算过程中，让其他线程改写内存上面的值。Atomics 对象提供了一些运算方法，防止数据被改写。</p> <div class="language-javascript line-numbers-mode"><pre class="language-javascript"><code>Atomics<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span>sharedArray<span class="token punctuation">,</span> index<span class="token punctuation">,</span> value<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><code>Atomics.add</code>用于将<code>value</code>加到<code>sharedArray[index]</code>，返回<code>sharedArray[index]</code>旧的值。</p> <div class="language-javascript line-numbers-mode"><pre class="language-javascript"><code>Atomics<span class="token punctuation">.</span><span class="token function">sub</span><span class="token punctuation">(</span>sharedArray<span class="token punctuation">,</span> index<span class="token punctuation">,</span> value<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><code>Atomics.sub</code>用于将<code>value</code>从<code>sharedArray[index]</code>减去，返回<code>sharedArray[index]</code>旧的值。</p> <div class="language-javascript line-numbers-mode"><pre class="language-javascript"><code>Atomics<span class="token punctuation">.</span><span class="token function">and</span><span class="token punctuation">(</span>sharedArray<span class="token punctuation">,</span> index<span class="token punctuation">,</span> value<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><code>Atomics.and</code>用于将<code>value</code>与<code>sharedArray[index]</code>进行位运算<code>and</code>，放入<code>sharedArray[index]</code>，并返回旧的值。</p> <div class="language-javascript line-numbers-mode"><pre class="language-javascript"><code>Atomics<span class="token punctuation">.</span><span class="token function">or</span><span class="token punctuation">(</span>sharedArray<span class="token punctuation">,</span> index<span class="token punctuation">,</span> value<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><code>Atomics.or</code>用于将<code>value</code>与<code>sharedArray[index]</code>进行位运算<code>or</code>，放入<code>sharedArray[index]</code>，并返回旧的值。</p> <div class="language-javascript line-numbers-mode"><pre class="language-javascript"><code>Atomics<span class="token punctuation">.</span><span class="token function">xor</span><span class="token punctuation">(</span>sharedArray<span class="token punctuation">,</span> index<span class="token punctuation">,</span> value<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><code>Atomic.xor</code>用于将<code>vaule</code>与<code>sharedArray[index]</code>进行位运算<code>xor</code>，放入<code>sharedArray[index]</code>，并返回旧的值。</p> <p><strong>（5）其他方法</strong></p> <p><code>Atomics</code>对象还有以下方法。</p> <ul><li><code>Atomics.compareExchange(sharedArray, index, oldval, newval)</code>：如果<code>sharedArray[index]</code>等于<code>oldval</code>，就写入<code>newval</code>，返回<code>oldval</code>。</li> <li><code>Atomics.isLockFree(size)</code>：返回一个布尔值，表示<code>Atomics</code>对象是否可以处理某个<code>size</code>的内存锁定。如果返回<code>false</code>，应用程序就需要自己来实现锁定。</li></ul> <p><code>Atomics.compareExchange</code>的一个用途是，从 SharedArrayBuffer 读取一个值，然后对该值进行某个操作，操作结束以后，检查一下 SharedArrayBuffer 里面原来那个值是否发生变化（即被其他线程改写过）。如果没有改写过，就将它写回原来的位置，否则读取新的值，再重头进行一次操作。</p></div></div>  <div class="page-edit"><div class="edit-link"><a href="https://github.com/lixuanfengs/cactus-vuepress-sc/edit/master/docs/《ES6 教程》笔记/28.ArrayBuffer.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <div class="tags"><a href="/tags/?tag=ES6" title="标签">#ES6</a></div> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2022/04/29, 14:36:52</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/16121351be68691b/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">异步遍历器</div></a> <a href="/pages/7188882b8d65af1b/" class="page-nav-cent
