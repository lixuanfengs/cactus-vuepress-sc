是如何绑定的？</a></li><li><a href="/pages/a30d58/" aria-current="page" class="active sidebar-link">SpringBoot内置的各种Starter是怎样构建的？</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level2"><a href="/pages/a30d58/#_1-温故而知新" class="sidebar-link">1 温故而知新</a></li><li class="sidebar-sub-header level2"><a href="/pages/a30d58/#_2-引言" class="sidebar-link">2 引言</a></li><li class="sidebar-sub-header level2"><a href="/pages/a30d58/#_3-maven传递依赖的optional标签" class="sidebar-link">3 Maven传递依赖的optional标签</a></li><li class="sidebar-sub-header level2"><a href="/pages/a30d58/#_4-springboot内置的各种starter是怎样构建的" class="sidebar-link">4 SpringBoot内置的各种Starter是怎样构建的？</a></li><li class="sidebar-sub-header level2"><a href="/pages/a30d58/#_5-模仿springboot包结构自定义一个starter" class="sidebar-link">5 模仿SpringBoot包结构自定义一个Starter</a></li><li class="sidebar-sub-header level2"><a href="/pages/a30d58/#_6-小结" class="sidebar-link">6 小结</a></li></ul></li><li><a href="/pages/0dbcc9/" class="sidebar-link">SpringBoot的启动流程是怎样的？</a></li><li><a href="/pages/6a857a/" class="sidebar-link">SpringApplication对象是如何构建的？</a></li><li><a href="/pages/c9edcd/" class="sidebar-link">SpringBoot事件监听机制</a></li><li><a href="/pages/d23c3e/" class="sidebar-link">SpringBoot内置生命周期事件详解</a></li></ul></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Netty</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Dubbo</span> <span class="arrow right"></span></p> <!----></section></li></ul></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/Java/#后端" data-v-06225672>后端</a></li><li data-v-06225672><a href="/Java/#阅读源码系列" data-v-06225672>阅读源码系列</a></li><li data-v-06225672><a href="/Java/#Spring Boot" data-v-06225672>Spring Boot</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2022-05-11</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->SpringBoot内置的各种Starter是怎样构建的？<!----></h1>  <div class="theme-vdoing-content content__default"><p><strong>注：该源码分析对应SpringBoot版本为2.1.0.RELEASE</strong></p> <h2 id="_1-温故而知新"><a href="#_1-温故而知新" class="header-anchor">#</a> 1 温故而知新</h2> <p>本篇接 <a href="https://juejin.cn/post/6844904090439270408" target="_blank" rel="noopener noreferrer">外部配置属性值是如何被绑定到XxxProperties类属性上的？--SpringBoot源码（五）<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>温故而知新，我们来简单回顾一下上篇的内容，上一篇我们分析了SpringBoot<strong>外部配置属性值是如何被绑定到XxxProperties类属性上</strong>的相关源码，现将外部属性绑定的重要步骤总结如下：</p> <ol><li>首先是<code>@EnableConfigurationProperties</code>注解<code>import</code>了<code>EnableConfigurationPropertiesImportSelector</code>后置处理器；</li> <li><code>EnableConfigurationPropertiesImportSelector</code>后置处理器又向<code>Spring</code>容器中注册了<code>ConfigurationPropertiesBeanRegistrar</code>和<code>ConfigurationPropertiesBindingPostProcessorRegistrar</code>这两个<code>bean</code>；</li> <li>其中<code>ConfigurationPropertiesBeanRegistrar</code>向<code>Spring</code>容器中注册了<code>XxxProperties</code>类型的<code>bean</code>；<code>ConfigurationPropertiesBindingPostProcessorRegistrar</code>向<code>Spring</code>容器中注册了<code>ConfigurationBeanFactoryMetadata</code>和<code>ConfigurationPropertiesBindingPostProcessor</code>两个后置处理器；</li> <li><code>ConfigurationBeanFactoryMetadata</code>后置处理器在初始化<code>bean</code> <code>factory</code>时将<code>@Bean</code>注解的元数据存储起来，以便在后续的外部配置属性绑定的相关逻辑中使用；</li> <li><code>ConfigurationPropertiesBindingPostProcessor</code>后置处理器将外部配置属性值绑定到<code>XxxProperties</code>类属性的逻辑委托给<code>ConfigurationPropertiesBinder</code>对象，然后<code>ConfigurationPropertiesBinder</code>对象又最终将属性绑定的逻辑委托给<code>Binder</code>对象来完成。</li></ol> <p>可见，重要的是上面的<strong>第5步</strong>。</p> <h2 id="_2-引言"><a href="#_2-引言" class="header-anchor">#</a> 2 引言</h2> <p>我们都知道，SpringBoot内置了各种<code>Starter</code>起步依赖，我们使用非常方便，大大减轻了我们的开发工作。有了<code>Starter</code>起步依赖，我们不用去考虑这个项目需要什么库，这个库的<code>groupId</code>和<code>artifactId</code>是什么？更不用担心引入这个版本的库后会不会跟其他依赖有没有冲突。</p> <p><strong>举个栗子</strong>：现在我们想开发一个web项目，那么只要引入<code>spring-boot-starter-web</code>这个起步依赖就可以了，不用考虑要引入哪些版本的哪些依赖了。像以前我们还要考虑引入哪些依赖库，比如要引入<code>spring-web</code>和<code>spring-webmvc</code>依赖等；此外，还要考虑引入这些库的哪些版本才不会跟其他库冲突等问题。</p> <p>那么我们今天暂时不分析SpringBoot自动配置的源码，由于起步依赖跟自动配置的关系是如影随形的关系，因此本篇先站在maven项目构建的角度来宏观分析下我们平时使用的<strong>SpringBoot内置的各种</strong><code>**Starter**</code><strong>是怎样构建的？</strong></p> <h2 id="_3-maven传递依赖的optional标签"><a href="#_3-maven传递依赖的optional标签" class="header-anchor">#</a> 3 Maven传递依赖的optional标签</h2> <p>在分析SpringBoot内置的各种<code>Starter</code>构建原理前，我们先来认识下Maven的<code>optional</code>标签，因为这个标签起到至关重要的作用。 Maven的<code>optional</code>标签表示可选依赖即不可传递的意思，下面直接举个栗子来说明。</p> <p>比如有<code>A</code>,<code>B</code>和<code>C</code>三个库，<code>C</code>依赖<code>B</code>，<code>B</code>依赖<code>A</code>。下面看下这三个库的<code>pom.xml</code>文件：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// A的pom.xml</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br><span class="line-number">47</span><br><span class="line-number">48</span><br><span class="line-number">49</span><br><span class="line-number">50</span><br><span class="line-number">51</span><br><span class="line-number">52</span><br></div></div><p>上面三个<code>A</code>,<code>B</code>和<code>C</code>库的<code>pom.xml</code>可知，<code>B</code>库依赖<code>A</code>库，然后<code>C</code>库又依赖了<code>B</code>库，那么请想一下，<strong>Maven打包构建</strong><code>**C**</code><strong>库后，</strong><code>**A**</code><strong>库有没有被引进来？</strong></p> <p>答案肯定是<strong>没有</strong>，因为<code>B</code>库引入<code>A</code>库依赖时使用了<code>&lt;optional&gt;true&lt;/optional&gt;</code>，即将Maven的<code>optional</code>标签值设为了<code>true</code>，此时<code>C</code>库再引入<code>B</code>库依赖时，<code>A</code>库是不会被引入到<code>C</code>库的。</p> <p>同时跟Maven传递依赖有关的还有一个<code>exclusions</code>标签，这个表示将某个库的某个子依赖排除掉，这里不再详述。</p> <h2 id="_4-springboot内置的各种starter是怎样构建的"><a href="#_4-springboot内置的各种starter是怎样构建的" class="header-anchor">#</a> 4 SpringBoot内置的各种Starter是怎样构建的？</h2> <p>我们现在来探究SpringBoot内置的各种<code>Starter</code>到底是怎样构建的呢？</p> <p>还记得<a href="https://juejin.cn/post/6844904070818463751" target="_blank" rel="noopener noreferrer">如何分析SpringBoot源码模块及结构？<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>这篇文章分析的SpringBoot内部的模块之间的关系吗？先来回顾一下SpringBoot源码内部模块图：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/5022695728261373679fda99556c5c2a.webp" alt="img"></p> <p>图1</p> <p>我们都知道，SpringBoot的<code>Starter</code>的构建的原理实质就是自动配置，因此由图1可以看到SpringBoot源码项目内部跟<code>Starter</code>及其自动配置有关的模块有四个：<code>spring-boot-starters</code>,<code>spring-boot-actuator-autoconfigure</code>,<code>spring-boot-autoconfigure</code>和<code>spring-boot-test-autoconfigure</code>。 每个模块的作用请看<a href="https://juejin.cn/post/6844904070818463751" target="_blank" rel="noopener noreferrer">如何分析SpringBoot源码模块及结构？<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>这篇文章，这里不再赘述。</p> <p>那么，<code>spring-boot-starters</code>模块跟后面三个自动配置有关的模块<code>xxx-autoconfigure</code>模块的关系是怎样的呢？</p> <p>此时我们先来看看<code>spring-boot-starters</code>模块里面的结构是怎样的？</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/0c5742ee6a7e90694a4959bbd4c695e3.webp" alt="img"></p> <p>图2</p> <p>由图2可以看到<code>spring-boot-starters</code>模块包含了SpringBoot内置的各种<code>starter</code>：<code>spring-boot-starter-xxx</code>。由于SpringBoot内置的各种<code>starter</code>太多，以我们常用的<code>spring-boot-starter-web</code>起步依赖来探究好了。</p> <p>我们首先看下<code>spring-boot-starter-web</code>模块内部结构：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/be1c41065e2f724efbb938ca99b71443.webp" alt="img"></p> <p>图3</p> <p>可以看到<code>spring-boot-starter-web</code>模块里面只有<code>.flattened-pom.xml</code>和<code>pom.xml</code>文件，<strong>而没有任何代码</strong>！有点出乎我们意料。我们都知道若要用到SpringBoot的web功能时引入<code>spring-boot-starter-web</code>起步依赖即可，而现在<code>spring-boot-starter-web</code>模块里面没有一行代码，那么<code>spring-boot-starter-web</code>究竟是如何构建的呢？会不会跟图1所示的<code>spring-boot-autoconfigure</code>自动配置模块有关？</p> <p>此时我们就需要看下<code>spring-boot-starter-web</code>模块的<code>pom.xml</code>文件内容：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/947159bb161815d87d5a585e9273183f.webp" alt="img"></p> <p>图4</p> <p>由图4可以看到，<code>spring-boot-starter-web</code>模块依赖了<code>spring-boot-starter</code>,<code>spring-boot-starter-tomcat</code>,<code>spring-web</code>和<code>spring-webmvc</code>等模块，居然没有依赖<code>spring-boot-autoconfigure</code>自动配置模块!</p> <p>由于<code>spring-boot-starter-web</code>模块肯定跟<code>spring-boot-autoconfigure</code>自动配置模块有关，所以<code>spring-boot-starter-web</code>模块肯定是间接依赖了<code>spring-boot-autoconfigure</code>自动配置模块。</p> <p>图4标有标注&quot;重点关注&quot;的<code>spring-boot-starter</code>模块是绝大部分<code>spring-boot-starter-xxx</code>模块依赖的基础模块，是核心的<code>Starter</code>，包括了自动配置，日志和<code>YAML</code>支持。我们此时来关注下<code>spring-boot-starter</code>的<code>pom.xml</code>文件，也许其依赖了了<code>spring-boot-autoconfigure</code>自动配置模块。</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/74770c7144609c004f4a9c86b3eb38d4.webp" alt="img"></p> <p>图5</p> <p>由图5可以看到，我们前面的猜想没有错，<strong>正是</strong><code>**spring-boot-starter**</code><strong>模块依赖了</strong><code>**spring-boot-autoconfigure**</code>**自动配置模块！***<em><strong>因此，到了这里我们就可以得出结论了：</strong></em><code>***spring-boot-starter-web***</code><em><strong>模块没有一行代码，但是其通过</strong></em><code>***spring-boot-starter***</code>***模块****<strong>间接</strong>依赖了<code>spring-boot-autoconfigure</code>自动配置模块，从而实现了其起步依赖的功能。</p> <p>此时我们再来看下<code>spring-boot-autoconfigure</code>自动配置模块的内部包结构：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/fcb8e73aa3eaf1171c102f858453b474.webp" alt="img"></p> <p>图6</p> <p>由图6红框处，我们可以知道<code>spring-boot-starter-web</code>起步依赖的自动配置功能原来是由<code>spring-boot-autoconfigure</code>模块的<code>web</code>包下的类实现的。</p> <p>到了这里<code>spring-boot-starter-web</code>起步依赖的构建基本原理我们就搞清楚了，但是还有一个特别重要的关键点我们还没Get到。这个关键点跟Maven的<code>optional</code>标签有的作用有关。</p> <p>为了Get到这个点，我们先来思考一个问题：平时我们开发<code>web</code>项目为什么引入了<code>spring-boot-starter-web</code>这个起步依赖后，<code>spring-boot-autoconfigure</code>模块的<code>web</code>相关的自动配置类就会起自动起作用呢？</p> <p>我们应该知道，某个自动配置类起作用往往是由于<code>classpath</code>中存在某个类，这里以<code>DispatcherServletAutoConfiguration</code>这个自动配置类为切入点去Get这个点好了。 先看下<code>DispatcherServletAutoConfiguration</code>能够自动配置的条件是啥？</p> <p><img src="https://img-blog.csdnimg.cn/img_convert/a5d25e066adbe8986d2d3bbc2be7e613.webp?x-oss-process=image/format,png" alt="img"></p> <p>图7</p> <p>由图7所示，<code>DispatcherServletAutoConfiguration</code>能够自动配置的条件之一是<code>@ConditionalOnClass(DispatcherServlet.class)</code>，即只有<code>classpath</code>中存在<code>DispatcherServlet.class</code>这个类，那么<code>DispatcherServletAutoConfiguration</code>自动配置相关逻辑才能起作用。</p> <p>而<code>DispatcherServlet</code>这个类是在<code>spring-webmvc</code>这个依赖库中的，如下图所示：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/f9787c27dc0410f9443018b4b0566aa7.webp" alt="img"></p> <p>图8</p> <p>此时我们再看下<code>spring-boot-autoconfigure</code>模块的<code>pom.xml</code>文件引入<code>spring-webmvc</code>这个依赖的情况：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/7a4a3c1268add74cd59202a32a92d551.webp" alt="img"></p> <p>图9</p> <p>由图9所示，<code>spring-boot-autoconfigure</code>模块引入的<code>spring-webmvc</code>这个依赖时<code>optional</code>被设置为<code>true</code>，原来是可选依赖。即<code>spring-webmvc</code>这个依赖库只会被导入到<code>spring-boot-autoconfigure</code>模块中，而不会被导入到间接依赖<code>spring-boot-autoconfigure</code>模块的<code>spring-boot-starter-web</code>这个起步依赖中。</p> <p>此时，我们再来看看<code>spring-boot-starter-web</code>的<code>pom.xml</code>文件的依赖情况：</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/18889b6e01000a053b7130a6caba29a8.webp" alt="img"></p> <p>图10</p> <p>由图10所示，<code>spring-boot-starter-web</code>起步依赖<strong>显式</strong>引入了<code>spring-webmvc</code>这个依赖库，即引入<code>spring-webmvc</code>  时没有<code>optional</code>这个标签，又因为<code>DispatcherServlet</code>这个类是在<code>spring-webmvc</code>这个依赖库中的,从而<code>classpath</code>中存在<code>DispatcherServlet</code>这个类，因此<code>DispatcherServletAutoConfiguration</code>这个自动配置类就生效了。当然，<code>web</code>相关的其他自动配置类生效也是这个原理。</p> <p>至此，我们也明白了<code>spring-boot-autoconfigure</code>模块为什么要把引入的<code>spring-webmvc</code>这个依赖作为可选依赖了，其目的就是为了在<code>spring-boot-starter-web</code>起步依赖中能显式引入<code>spring-webmvc</code>这个依赖（这个起决定性作用），从而我们开发web项目只要引入了<code>spring-boot-starter-web</code>起步依赖，那么web相关的自动配置类就生效，从而可以开箱即用这个就是<code>spring-boot-starter-web</code>这个起步依赖的构建原理了。</p> <p>前面提到的<code>spring-boot-starter-actuator</code>,<code>spring-boot-starter-test</code>及其他内置的<code>spring-boot-starter-xxx</code>的起步依赖的构建原理也是如此，只不过<code>spring-boot-starter-actuator</code>依赖的是<code>spring-boot-actuator-autoconfigure</code>，<code>spring-boot-starter-test</code>依赖的是<code>spring-boot-test-autoconfigure</code>模块罢了，这里不再详述。</p> <p><strong>思考</strong>：<code>spring-boot-actuator-autoconfigure</code>的<code>pom.xml</code>文件引入了20多个可选依赖，而为什么<code>spring-boot-starter-actuator</code>起步依赖只引入了<code>micrometer-core</code>这个依赖呢？</p> <h2 id="_5-模仿springboot包结构自定义一个starter"><a href="#_5-模仿springboot包结构自定义一个starter" class="header-anchor">#</a> 5 模仿SpringBoot包结构自定义一个Starter</h2> <p>前面分析了SpringBoot内置的各种<code>Starter</code>的构建原理，理论联系实践，那么如果能够动手实践一下自定义<code>Starter</code>那就更好了。</p> <p>下面提供一个自定义<code>Starter</code>的一个简单<code>Demo</code>，这个<code>Demo</code>完全模仿<code>SpringBoot</code>内置<code>Starter</code>的内部包结构来编写，对于进一步了解SpringBoot内置的各种<code>Starter</code>的构建原理很有帮助。</p> <p>下面是这个<code>Demo</code>的github地址，推荐给有兴趣的小伙伴们。 <a href="https://github.com/jinyue233/mock-spring-boot-autoconfiguration" target="_blank" rel="noopener noreferrer">模仿springboot内部结构自定义Starter<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>。此外，如何自定义一个<code>Starter</code>，可以参考下Mybatis的<a href="https://github.com/mybatis/spring-boot-starter" target="_blank" rel="noopener noreferrer">spring-boot-starter<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>是如何编写的。</p> <h2 id="_6-小结"><a href="#_6-小结" class="header-anchor">#</a> 6 小结</h2> <p>好了，SpringBoot内置的各种<code>Starter</code>的构建原理分析就到此结束了，现将关键点总结下：</p> <ol><li><code>spring-boot-starter-xxx</code>起步依赖没有一行代码，而是直接或间接依赖了<code>xxx-autoconfigure</code>模块，而<code>xxx-autoconfigure</code>模块承担了<code>spring-boot-starter-xxx</code>起步依赖自动配置的实现；</li> <li><code>xxx-autoconfigure</code>自动配置模块引入了一些可选依赖，这些可选依赖不会被传递到<code>spring-boot-starter-xxx</code>起步依赖中，这是起步依赖构建的<strong>关键点</strong>；</li> <li><code>spring-boot-starter-xxx</code>起步依赖<strong>显式</strong>引入了一些对自动配置起作用的可选依赖；</li> <li>经过前面3步的准备，我们项目只要引入了某个起步依赖后，就可以开箱即用了，而不用手动去创建一些<code>bean</code>等。</li></ol></div></div>  <div class="page-edit"><div class="edit-link"><a href="https://github.com/lixuanfengs/cactus-vuepress-sc/edit/master/docs/07.后端/110.阅读源码系列/10.Spring Boot/06.SpringBoot内置的各种Starter是怎样构建的？.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,5
