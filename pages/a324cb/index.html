6225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/note/Kubernetes/#《Kubernetes教程》笔记" data-v-06225672>《Kubernetes教程》笔记</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2022-05-09</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Kubernetes-服务、负载均衡和网络<!----></h1>  <div class="theme-vdoing-content content__default"><center><h1>
    Kubernetes 网络和负载均衡
    </h1></center> <h2 id="一、kubernetes网络"><a href="#一、kubernetes网络" class="header-anchor">#</a> 一、Kubernetes网络</h2> <p>Kubernetes 网络解决四方面的问题：</p> <ul><li>一个 Pod 中的容器之间通过<strong>本地回路（loopback）通信。</strong></li> <li>集群网络在不同 pod 之间提供通信。Pod和Pod之间互通</li> <li>Service 资源允许你对外暴露 Pods 中运行的应用程序，以支持来自于集群外部的访问。Service和Pod要通</li> <li>可以使用 Services 来发布仅供集群内部使用的服务。</li></ul> <h3 id="_1、k8s网络架构图"><a href="#_1、k8s网络架构图" class="header-anchor">#</a> 1、k8s网络架构图</h3> <h4 id="_1、架构图"><a href="#_1、架构图" class="header-anchor">#</a> 1、架构图</h4> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/1620208232664.png" alt="1620208232664"></p> <h4 id="_2、访问流程"><a href="#_2、访问流程" class="header-anchor">#</a> 2、访问流程</h4> <p>门面。所有的零散层上再抽取一个聚合层。</p> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/1620106769755.png" alt="1620106769755"></p> <h3 id="_2、网络连通原理"><a href="#_2、网络连通原理" class="header-anchor">#</a> 2、网络连通原理</h3> <h4 id="_1、container-to-container"><a href="#_1、container-to-container" class="header-anchor">#</a> 1、Container To Container</h4> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/pod-namespace.5098bb9c.png" alt="pod_network_namespace"></p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">ip</span> netns <span class="token function">add</span> ns1  <span class="token comment">#添加网络名称空间</span>
<span class="token function">ls</span> /var/run/netns <span class="token comment">#查看所有网络名词空间</span>
<span class="token function">ip</span> netns 		  <span class="token comment">#查看所有网络名词空间</span>
<span class="token comment"># Linux 将所有的进程都分配到 root network namespace，以使得进程可以访问外部网络</span>
<span class="token comment"># Kubernetes 为每一个 Pod 都创建了一个 network namespace</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h4 id="_2、pod-to-pod"><a href="#_2、pod-to-pod" class="header-anchor">#</a> 2、Pod To Pod</h4> <h5 id="_1、同节点"><a href="#_1、同节点" class="header-anchor">#</a> 1、同节点</h5> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/20220507135936.png" alt="同节点上Pod之间发送数据包"></p> <h5 id="_2、跨节点"><a href="#_2、跨节点" class="header-anchor">#</a> 2、跨节点</h5> <p><img src="assets/pod-to-pod-different-nodes.4187b249.gif" alt="跨节点上Pod之间发送数据包"></p> <h3 id="_3、pod-to-service"><a href="#_3、pod-to-service" class="header-anchor">#</a> 3、Pod-To-Service</h3> <h4 id="_1、pod-to-service"><a href="#_1、pod-to-service" class="header-anchor">#</a> 1、Pod To Service</h4> <p><img src="assets/pod-to-service.6718b584.gif" alt="Pod-to-Service"></p> <h4 id="_2、service-to-pod"><a href="#_2、service-to-pod" class="header-anchor">#</a> 2、Service-To-Pod</h4> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/20220507165700.png" alt="service-to-pod"></p> <h3 id="_4、internet-to-service"><a href="#_4、internet-to-service" class="header-anchor">#</a> 4、Internet-To-Service</h3> <h4 id="_1、pod-to-internet"><a href="#_1、pod-to-internet" class="header-anchor">#</a> 1、Pod-To-Internet</h4> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/_20220507165841.png" alt="pod-to-internet"></p> <h4 id="_2、internet-to-pod-loadbalancer-layer4"><a href="#_2、internet-to-pod-loadbalancer-layer4" class="header-anchor">#</a> 2、Internet-To-Pod（LoadBalancer -- Layer4）</h4> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/20220507170000.png" alt="internet-to-service"></p> <h4 id="_3、internet-to-pod-ingress-layer7"><a href="#_3、internet-to-pod-ingress-layer7" class="header-anchor">#</a> 3、Internet-To-Pod（Ingress-- Layer7）</h4> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/20220509091059.png" alt="Ingress_Controller_Design"></p> <h2 id="二、service"><a href="#二、service" class="header-anchor">#</a> 二、Service</h2> <p>负载均衡服务。让一组Pod可以被别人进行服务发现。</p> <p>Service   --- &gt;&gt;  选择一组Pod</p> <p>别人只需要访问这个Service。Service还会基于Pod的探针机制（ReadinessProbe：就绪探针）完成Pod的自动剔除和上线工作。</p> <ul><li><p>Service即使无头服务。别人（Pod）不能用ip访问，但是可以用service名当成域名访问。</p></li> <li><p><strong>Service的名字还能当成域名被Pod解析</strong></p></li></ul> <h3 id="_1、基础概念"><a href="#_1、基础概念" class="header-anchor">#</a> 1、基础概念</h3> <p>将运行在一组 <a href="https://kubernetes.io/docs/concepts/workloads/pods/pod-overview/" target="_blank" rel="noopener noreferrer">Pods<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 上的应用程序公开为网络服务的抽象方法。</p> <blockquote><p><strong>云原生服务发现</strong></p> <p>service中的type可选值如下，代表四种不同的服务发现类型</p> <ul><li>ExternalName</li> <li>ClusterIP: 为当前Service分配或者不分配集群IP。负载均衡一组Pod</li> <li>NodePort：  外界也可以使用机器ip+暴露的NodePort端口 访问。
<ul><li>nodePort端口由kube-proxy开在机器上</li> <li>机器ip+暴露的NodePort 流量先来到  kube-proxy</li></ul></li> <li>LoadBalancer.</li></ul></blockquote> <ul><li><strong><code>ClusterIP</code></strong> ：通过集群的内部 IP 暴露服务，选择该值时服务只能够在集群内部访问。 这也是默认的 <code>ServiceType</code>。</li> <li><a href="https://kubernetes.io/zh/docs/concepts/services-networking/service/#nodeport" target="_blank" rel="noopener noreferrer"><code>NodePort</code><span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>：通过每个节点上的 IP 和静态端口（<code>NodePort</code>）暴露服务。 <code>NodePort</code> 服务会路由到自动创建的 <code>ClusterIP</code> 服务。 通过请求 <code>&lt;节点 IP&gt;:&lt;节点端口&gt;</code>，你可以从集群的外部访问一个 <code>NodePort</code> 服务。</li> <li><a href="https://kubernetes.io/zh/docs/concepts/services-networking/service/#loadbalancer" target="_blank" rel="noopener noreferrer"><code>LoadBalancer</code><span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>：使用云提供商的负载均衡器向外部暴露服务。 外部负载均衡器可以将流量路由到自动创建的 <code>NodePort</code> 服务和 <code>ClusterIP</code> 服务上。</li> <li><a href="https://kubernetes.io/zh/docs/concepts/services-networking/service/#externalname" target="_blank" rel="noopener noreferrer"><code>ExternalName</code><span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>：通过返回 <code>CNAME</code> 和对应值，可以将服务映射到 <code>externalName</code> 字段的内容（例如，<code>foo.bar.example.com</code>）。 无需创建任何类型代理。</li></ul> <h4 id="_1、创建简单service"><a href="#_1、创建简单service" class="header-anchor">#</a> 1、创建简单Service</h4> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">apiVersion</span><span class="token punctuation">:</span> v1
<span class="token key atrule">kind</span><span class="token punctuation">:</span> Service
<span class="token key atrule">metadata</span><span class="token punctuation">:</span>
  <span class="token key atrule">name</span><span class="token punctuation">:</span> my<span class="token punctuation">-</span>service
<span class="token key atrule">spec</span><span class="token punctuation">:</span>
  <span class="token key atrule">selector</span><span class="token punctuation">:</span>
    <span class="token key atrule">app</span><span class="token punctuation">:</span> MyApp   <span class="token comment">## 使用选择器选择所有Pod</span>
 <span class="token comment"># type: ClusterIP  ##type很重要，不写默认是ClusterIP</span>
  <span class="token key atrule">ports</span><span class="token punctuation">:</span>
    <span class="token punctuation">-</span> <span class="token key atrule">protocol</span><span class="token punctuation">:</span> TCP
      <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">80</span>
      <span class="token key atrule">targetPort</span><span class="token punctuation">:</span> <span class="token number">9376</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><ul><li>Service 创建完成后，会对应一组EndPoint。可以kubectl get ep 进行查看</li> <li>type有四种，每种对应不同服务发现机制</li> <li>Servvice可以利用Pod的就绪探针机制，只负载就绪了的Pod。自动剔除没有就绪的Pod</li></ul> <h4 id="_2、创建无selector的service"><a href="#_2、创建无selector的service" class="header-anchor">#</a> 2、创建无Selector的Service</h4> <ul><li>我们可以创建Service不指定Selector</li> <li>然后手动创建EndPoint，指定一组Pod地址。</li> <li>此场景用于我们负载均衡其他中间件场景。</li></ul> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token comment"># 无selector的svc</span>
<span class="token key atrule">apiVersion</span><span class="token punctuation">:</span> v1
<span class="token key atrule">kind</span><span class="token punctuation">:</span> Service
<span class="token key atrule">metadata</span><span class="token punctuation">:</span>
  <span class="token key atrule">name</span><span class="token punctuation">:</span> my<span class="token punctuation">-</span>service<span class="token punctuation">-</span>no<span class="token punctuation">-</span>selector
<span class="token key atrule">spec</span><span class="token punctuation">:</span>
  <span class="token key atrule">ports</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> <span class="token key atrule">protocol</span><span class="token punctuation">:</span> TCP
    <span class="token key atrule">name</span><span class="token punctuation">:</span> http  <span class="token comment">###一定注意，name可以不写，</span>
    <span class="token comment">###但是这里如果写了name，那么endpoint里面的ports必须有同名name才能绑定</span>
    <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">80</span>  <span class="token comment"># service 80</span>
    <span class="token key atrule">targetPort</span><span class="token punctuation">:</span> <span class="token number">80</span>  <span class="token comment">#目标80</span>
<span class="token punctuation">---</span>    
<span class="token key atrule">apiVersion</span><span class="token punctuation">:</span> v1
<span class="token key atrule">kind</span><span class="token punctuation">:</span> Endpoints
<span class="token key atrule">metadata</span><span class="token punctuation">:</span>
  <span class="token key atrule">name</span><span class="token punctuation">:</span> my<span class="token punctuation">-</span>service<span class="token punctuation">-</span>no<span class="token punctuation">-</span>selector  <span class="token comment">### ep和svc的绑定规则是：和svc同名同名称空间，port同名或同端口</span>
  <span class="token key atrule">namespace</span><span class="token punctuation">:</span> default
<span class="token key atrule">subsets</span><span class="token punctuation">:</span>
<span class="token punctuation">-</span> <span class="token key atrule">addresses</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> <span class="token key atrule">ip</span><span class="token punctuation">:</span> 220.181.38.148
  <span class="token punctuation">-</span> <span class="token key atrule">ip</span><span class="token punctuation">:</span> 39.156.69.79
  <span class="token punctuation">-</span> <span class="token key atrule">ip</span><span class="token punctuation">:</span> 192.168.169.165
  <span class="token key atrule">ports</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">80</span>
    <span class="token key atrule">name</span><span class="token punctuation">:</span> http  <span class="token comment">## svc有name这里一定要有</span>
    <span class="token key atrule">protocol</span><span class="token punctuation">:</span> TCP

<span class="token key atrule">ClusterIP</span><span class="token punctuation">:</span> 手动指定/None/&quot;&quot;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><ul><li>手动指定的ClusterIP必须在合法范围内</li> <li>None会创建出没有ClusterIP的<strong>headless service（无头服务）</strong>，Pod需要用服务的域名访问</li></ul> <h3 id="_3、nodeport"><a href="#_3、nodeport" class="header-anchor">#</a> 3、NodePort</h3> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">apiVersion</span><span class="token punctuation">:</span> v1
<span class="token key atrule">kind</span><span class="token punctuation">:</span> Service
<span class="token key atrule">metadata</span><span class="token punctuation">:</span>

<span class="token key atrule">type</span><span class="token punctuation">:</span> NodePort

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><ul><li>如果将 <code>type</code> 字段设置为 <code>NodePort</code>，则 Kubernetes 将在 <code>--service-node-port-range</code> 标志指定的范围内分配端口（默认值：30000-32767）</li> <li>k8s集群的所有机器都将打开监听这个端口的数据，访问任何一个机器，都可以访问这个service对应的Pod</li> <li>使用 nodePort 自定义端口</li></ul> <h3 id="_4、externalname"><a href="#_4、externalname" class="header-anchor">#</a> 4、ExternalName</h3> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">apiVersion</span><span class="token punctuation">:</span> v1

  <span class="token key atrule">type</span><span class="token punctuation">:</span> LoadBalancer
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><h3 id="_6、扩展-externalip"><a href="#_6、扩展-externalip" class="header-anchor">#</a> 6、扩展 - externalIP</h3> <p>在 Service 的定义中， <code>externalIPs</code> 可以和任何类型的 <code>.spec.type</code> 一通使用。在下面的例子中，客户端可通过 <code>80.11.12.10:80</code> （externalIP:port） 访问<code>my-service</code></p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">apiVersion</span><span class="token punctuation">:</span> v1

 <span class="token comment">####    - 其他机器的ip</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>黑名单？？？？</p> <h3 id="_7、扩展-pod的dns"><a href="#_7、扩展-pod的dns" class="header-anchor">#</a> 7、扩展 - Pod的DNS</h3> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">apiVersion</span><span class="token punctuation">:</span> v1

<ul><li>同名称空间
<ul><li>ping pod-host-name.service-name 即可</li></ul></li> <li>不同名称空间
<ul><li>ping pod-host-name.service-name.namespace 即可</li></ul></li></ul></li></ul> <p>busybox-1.<strong><em>default-subdomain</em>.default</strong>**</p> <p>Pod的hostName.service的名.名称空间的名</p> <p>想要使用域名访问的模式，必须加Service网络的名字</p> <h2 id="三、ingress"><a href="#三、ingress" class="header-anchor">#</a> 三、Ingress</h2> <p>为什么需要Ingress？</p> <ul><li>Service可以使用NodePort暴露集群外访问端口，但是性能低下不安全</li> <li>缺少<strong>Layer7</strong>的统一访问入口，可以负载均衡、限流等</li> <li><a href="https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.21/#ingress-v1beta1-networking-k8s-io" target="_blank" rel="noopener noreferrer">Ingress<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 公开了从集群外部到集群内<a href="https://kubernetes.io/zh/docs/concepts/services-networking/service/" target="_blank" rel="noopener noreferrer">服务<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>的 HTTP 和 HTTPS 路由。 流量路由由 Ingress 资源上定义的规则控制。</li> <li>我们使用Ingress作为整个集群统一的入口，配置Ingress规则转到对应的Service</li></ul> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/1620209422465.png" alt="1620209422465"></p> <h3 id="_1、ingress-nginx和nginx-ingress"><a href="#_1、ingress-nginx和nginx-ingress" class="header-anchor">#</a> 1、Ingress nginx和nginx ingress</h3> <h4 id="_1、nginx-ingress"><a href="#_1、nginx-ingress" class="header-anchor">#</a> 1、nginx ingress</h4> <p>这是nginx官方做的，适配k8s的，分为<strong>开源版</strong>和<strong>nginx plus版（收费）</strong>。<a href="https://docs.nginx.com/nginx-ingress-controller/overview/" target="_blank" rel="noopener noreferrer">文档地址<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>https://www.nginx.com/products/nginx-ingress-controller</p> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/20220509091310.png" alt="1620101082048"></p> <h4 id="_2、ingress-nginx"><a href="#_2、ingress-nginx" class="header-anchor">#</a> 2、ingress nginx</h4> <p><a href="https://kubernetes.io/zh/docs/concepts/services-networking/ingress/#ingress-%E6%98%AF%E4%BB%80%E4%B9%88" target="_blank" rel="noopener noreferrer">https://kubernetes.io/zh/docs/concepts/services-networking/ingress/#ingress-%E6%98%AF%E4%BB%80%E4%B9%88<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>这是k8s官方做的，适配nginx的。这个里面会及时更新一些特性，而且性能很高，也被广泛采用。<a href="https://kubernetes.github.io/ingress-nginx/deploy/" target="_blank" rel="noopener noreferrer">文档地址<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token comment">## 默认安装使用这个镜像</span>

<span class="token key atrule">spec</span><span class="token punctuation">:</span>

            <span class="token key atrule">port</span><span class="token punctuation">:</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><ul><li><a href="https://kubernetes.io/zh/docs/concepts/services-networking/ingress/#path-types" target="_blank" rel="noopener noreferrer">pathType 详细<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>：
<ul><li><code>Prefix</code>：基于以 <code>/</code> 分隔的 URL 路径前缀匹配。匹配区分大小写，并且对路径中的元素逐个完成。 路径元素指的是由 <code>/</code> 分隔符分隔的路径中的标签列表。 如果每个 <em>p</em> 都是请求路径 <em>p</em> 的元素前缀，则请求与路径 <em>p</em> 匹配。</li> <li><code>Exact</code>：精确匹配 URL 路径，且区分大小写。</li> <li><code>ImplementationSpecific</code>：对于这种路径类型，匹配方法取决于 IngressClass。 具体实现可以将其作为单独的 <code>pathType</code> 处理或者与 <code>Prefix</code> 或 <code>Exact</code> 类型作相同处理。</li></ul></li></ul> <p>ingress规则会生效到所有按照了IngressController的机器的nginx配置。</p> <h4 id="_2、默认后端"><a href="#_2、默认后端" class="header-anchor">#</a> 2、默认后端</h4> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">apiVersion</span><span class="token punctuation">:</span> networking.k8s.io/v1

  <span class="token key atrule">name</span><span class="token punctuation">:</span> itdachang<span class="token punctuation">-</span>ingress
  <span class="token key atrule">namespace</span><span class="token punctuation">:</span> default
<span class="token key atrule">spec</span><span class="token punctuation">:</span>
  <span class="token key atrule">defaultBackend</span><span class="token punctuation">:</span>  <span class="token comment">## 指定所有未匹配的默认后端</span>
    <span class="token key atrule">service</span><span class="token punctuation">:</span>
      <span class="token key atrule">name</span><span class="token punctuation">:</span> php<span class="token punctuation">-</span>apache
      <span class="token key atrule">port</span><span class="token punctuation">:</span> 
        <span class="token key atrule">number</span><span class="token punctuation">:</span> <span class="token number">80</span>
  <span class="token key atrule">rules</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> <span class="token key atrule">host</span><span class="token punctuation">:</span> itdachang.com
    <span class="token key atrule">http</span><span class="token punctuation">:</span>
      <span class="token key atrule">paths</span><span class="token punctuation">:</span>

        <span class="token key atrule">pathType</span><span class="token punctuation">:</span> Prefix
        <span class="token key atrule">backend</span><span class="token punctuation">:</span>
          <span class="token key atrule">service</span><span class="token punctuation">:</span>

="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br><span class="line-number">62</span><br><span class="line-number">63</span><br><span class="line-number">64</span><br><span class="line-number">65</span><br><span class="line-number">66</span><br><span class="line-number">67</span><br><span class="line-number">68</span><br><span class="line-number">69</span><br><span class="line-number">70</span><br><span class="line-number">71</span><br><span class="line-number">72</span><br></div></div><h4 id="_7、会话保持-session亲和性"><a href="#_7、会话保持-session亲和性" class="header-anchor">#</a> 7、会话保持-Session亲和性</h4> <p>https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#session-affinity</p> <p>第一次访问，ingress-nginx会返回给浏览器一个Cookie，以后浏览器带着这个Cookie，保证访问总是抵达之前的Pod；</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token comment">## 部署一个三个Pod的Deployment并设置Service</span>

  <span class="token key atrule">annotations</span><span class="token punctuation">:</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br></div></div><h2 id="四、networkpolicy"><a href="#四、networkpolicy" class="header-anchor">#</a> 四、NetworkPolicy</h2> <p>网络策略（网络隔离策略）</p> <p>https://kubernetes.io/zh/docs/concepts/services-networking/network-policies/</p> <p>指定Pod间的网络隔离策略，默认是所有互通。</p> <p>Pod 之间互通，是通过如下三个标识符的组合来辩识的：</p> <ol><li>其他被允许的 Pods（例外：Pod 无法阻塞对自身的访问）</li> <li>被允许的名称空间</li> <li>IP 组块（例外：与 Pod 运行所在的节点的通信总是被允许的， 无论 Pod 或节点的 IP 地址）</li></ol> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/1620287789319.png" alt="1620287789319"></p> <h3 id="_1、pod隔离与非隔离"><a href="#_1、pod隔离与非隔离" class="header-anchor">#</a> 1、Pod隔离与非隔离</h3> <ul><li><p>默认情况下，Pod网络都是非隔离的（non-isolated），可以接受来自任何请求方的网络请求。</p></li> <li><p>如果一个 NetworkPolicy 的标签选择器选中了某个 Pod，则该 Pod 将变成隔离的（isolated），并将拒绝任何不被 NetworkPolicy 许可的网络连接。</p></li></ul> <h3 id="_2、规约"><a href="#_2、规约" class="header-anchor">#</a> 2、规约</h3> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">apiVersion</span><span class="token punctuation">:</span> networking.k8s.io/v1
<span class="token key atrule">kind</span><span class="token punctuation">:</span> NetworkPolicy
<span class="token key atrule">metadata</span><span class="token punctuation">:</span>
  <span class="token key atrule">name</span><span class="token punctuation">:</span> test<span class="token punctuation">-</span>network<span class="token punctuation">-</span>policy
  <span class="token key atrule">namespace</span><span class="token punctuation">:</span> default
<span class="token key atrule">spec</span><span class="token punctuation">:</span>
  <span class="token key atrule">podSelector</span><span class="token punctuation">:</span>  <span class="token comment">## 选中指定Pod</span>
    <span class="token key atrule">matchLabels</span><span class="token punctuation">:</span>
      <span class="token key atrule">role</span><span class="token punctuation">:</span> db
  <span class="token key atrule">policyTypes</span><span class="token punctuation">:</span>  <span class="token comment">## 定义上面Pod的入站出站规则</span>
  <span class="token punctuation">-</span> Ingress
  <span class="token punctuation">-</span> Egress
  <span class="token key atrule">ingress</span><span class="token punctuation">:</span>    <span class="token comment">## 定义入站白名单</span>
  <span class="token punctuation">-</span> <span class="token key atrule">from</span><span class="token punctuation">:</span>   
    <span class="token punctuation">-</span> <span class="token key atrule">ipBlock</span><span class="token punctuation">:</span>
        <span class="token key atrule">cidr</span><span class="token punctuation">:</span> 172.17.0.0/16
        <span class="token key atrule">except</span><span class="token punctuation">:</span>
        <span class="token punctuation">-</span> 172.17.1.0/24
    <span class="token punctuation">-</span> <span class="token key atrule">namespaceSelector</span><span class="token punctuation">:</span>
        <span class="token key atrule">matchLabels</span><span class="token punctuation">:</span>
          <span class="token key atrule">project</span><span class="token punctuation">:</span> myproject
    <span class="token punctuation">-</span> <span class="token key atrule">podSelector</span><span class="token punctuation">:</span>
        <span class="token key atrule">matchLabels</span><span class="token punctuation">:</span>
          <span class="token key atrule">role</span><span class="token punctuation">:</span> frontend
    <span class="token key atrule">ports</span><span class="token punctuation">:</span>
    <span class="token punctuation">-</span> <span class="token key atrule">protocol</span><span class="token punctuation">:</span> TCP
      <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">6379</span>
  <span class="token key atrule">egress</span><span class="token punctuation">:</span>  <span class="token comment">## 定义出站白名单</span>
  <span class="token punctuation">-</span> <span class="token key atrule">to</span><span class="token punctuation">:</span>
    <span class="token punctuation">-</span> <span class="token key atrule">ipBlock</span><span class="token punctuation">:</span>
        <span class="token key atrule">cidr</span><span class="token punctuation">:</span> 10.0.0.0/24
    <span class="token key atrule">ports</span><span class="token punctuation">:</span>
    <span class="token punctuation">-</span> <span class="token key atrule">protocol</span><span class="token punctuation">:</span> TCP
      <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">5978</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br></div></div><ul><li><strong>基本信息：</strong> 同其他的 Kubernetes 对象一样，<code>NetworkPolicy</code> 需要 <code>apiVersion</code>、<code>kind</code>、<code>metadata</code> 字段</li> <li>spec：<code>NetworkPolicy</code>的spec字段包含了定义网络策略的主要信息：
<ul><li><strong>podSelector：</strong> 同名称空间中，符合此标签选择器 <code>.spec.podSelector</code> 的 Pod 都将应用这个 <code>NetworkPolicy</code>。上面的 Example中的 podSelector 选择了 <code>role=db</code> 的 Pod。如果该字段为空，则将对名称空间中所有的 Pod 应用这个 <code>NetworkPolicy</code></li> <li><strong>policyTypes：</strong> <code>.spec.policyTypes</code> 是一个数组类型的字段，该数组中可以包含 <code>Ingress</code>、<code>Egress</code> 中的一个，也可能两个都包含。该字段标识了此 <code>NetworkPolicy</code> 是否应用到 入方向的网络流量、出方向的网络流量、或者两者都有。如果不指定 <code>policyTypes</code> 字段，该字段默认将始终包含 <code>Ingress</code>，当 <code>NetworkPolicy</code> 中包含出方向的规则时，<code>Egress</code> 也将被添加到默认值。</li> <li>ingress：ingress是一个数组，代表入方向的白名单规则。每一条规则都将允许与<code>from</code>和<code>ports</code>匹配的入方向的网络流量发生。例子中的<code>ingress</code>包含了一条规则，允许的入方向网络流量必须符合如下条件：
<ul><li>Pod 的监听端口为 <code>6379</code></li> <li>请求方可以是如下三种来源当中的任意一种：
<ul><li>ipBlock 为 <code>172.17.0.0/16</code> 网段，但是不包括 <code>172.17.1.0/24</code> 网段</li> <li>namespaceSelector 标签选择器，匹配标签为 <code>project=myproject</code></li> <li>podSelector 标签选择器，匹配标签为 <code>role=frontend</code></li></ul></li></ul></li> <li>egress：<code>egress</code>是一个数组，代表出方向的白名单规则。每一条规则都将允许与<code>to</code>和<code>ports</code>匹配的出方向的网络流量发生。例子中的<code>egress</code>允许的出方向网络流量必须符合如下条件：
<ul><li>目标端口为 <code>5978</code></li> <li>目标 ipBlock 为 <code>10.0.0.0/24</code> 网段</li></ul></li></ul></li></ul> <p>因此，例子中的 <code>NetworkPolicy</code> 对网络流量做了如下限制：</p> <ol><li>隔离了 <code>default</code> 名称空间中带有 <code>role=db</code> 标签的所有 Pod 的入方向网络流量和出方向网络流量</li> <li>Ingress规则（入方向白名单规则）：
<ul><li>当请求方是如下三种来源当中的任意一种时，允许访问<code>default</code>名称空间中所有带<code>role=db</code>标签的 Pod 的6379端口：
<ul><li>ipBlock 为 <code>172.17.0.0/16</code> 网段，但是不包括 <code>172.17.1.0/24</code> 网段</li> <li>namespaceSelector 标签选择器，匹配标签为 <code>project=myproject</code></li> <li>podSelector 标签选择器，匹配标签为 <code>role=frontend</code></li></ul></li></ul></li> <li>Egress规则（出方向白名单规则）：
<ul><li>当如下条件满足时，允许出方向的网络流量：
<ul><li>目标端口为 <code>5978</code></li> <li>目标 ipBlock 为 <code>10.0.0.0/24</code> 网段</li></ul></li></ul></li></ol> <h3 id="_3、to和from选择器的行为"><a href="#_3、to和from选择器的行为" class="header-anchor">#</a> 3、to和from选择器的行为</h3> <p>NetworkPolicy 的 <code>.spec.ingress.from</code> 和 <code>.spec.egress.to</code> 字段中，可以指定 4 种类型的标签选择器：</p> <ul><li><strong>podSelector</strong> 选择与 <code>NetworkPolicy</code> 同名称空间中的 Pod 作为入方向访问控制规则的源或者出方向访问控制规则的目标</li> <li><strong>namespaceSelector</strong> 选择某个名称空间（其中所有的Pod）作为入方向访问控制规则的源或者出方向访问控制规则的目标</li> <li><strong>namespaceSelector</strong> 和 <strong>podSelector</strong> 在一个 <code>to</code> / <code>from</code> 条目中同时包含 <code>namespaceSelector</code> 和 <code>podSelector</code> 将选中指定名称空间中的指定 Pod。此时请特别留意 YAML 的写法，如下所示：</li></ul> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code>  <span class="token punctuation">...</span>
  <span class="token key atrule">ingress</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> <span class="token key atrule">from</span><span class="token punctuation">:</span>
    <span class="token punctuation">-</span> <span class="token key atrule">namespaceSelector</span><span class="token punctuation">:</span>
        <span class="token key atrule">matchLabels</span><span class="token punctuation">:</span>
          <span class="token key atrule">user</span><span class="token punctuation">:</span> alice
      <span class="token key atrule">podSelector</span><span class="token punctuation">:</span>
        <span class="token key atrule">matchLabels</span><span class="token punctuation">:</span>
          <span class="token key atrule">role</span><span class="token punctuation">:</span> client
  <span class="token punctuation">...</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>该例子中，podSelector 前面没有 <code>-</code> 减号，namespaceSelector 和 podSelector 是同一个 from 元素的两个字段，将选中带 <code>user=alice</code> 标签的名称空间中所有带 <code>role=client</code> 标签的 Pod。但是，下面的这个 NetworkPolicy 含义是不一样的：</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code>  <span class="token punctuation">...</span>
  <span class="token key atrule">ingress</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> <span class="token key atrule">from</span><span class="token punctuation">:</span>
    <span class="token punctuation">-</span> <span class="token key atrule">namespaceSelector</span><span class="token punctuation">:</span>
        <span class="token key atrule">matchLabels</span><span class="token punctuation">:</span>
          <span class="token key atrule">user</span><span class="token punctuation">:</span> alice
    <span class="token punctuation">-</span> <span class="token key atrule">podSelector</span><span class="token punctuation">:</span>
        <span class="token key atrule">matchLabels</span><span class="token punctuation">:</span>
          <span class="token key atrule">role</span><span class="token punctuation">:</span> client
  <span class="token punctuation">...</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>后者，podSelector 前面带 <code>-</code> 减号，说明 namespaceSelector 和 podSelector 是 from 数组中的两个元素，他们将选中 NetworkPolicy 同名称空间中带 <code>role=client</code> 标签的对象，以及带 <code>user=alice</code> 标签的名称空间的所有 Pod。</p> <blockquote><p>前者是交集关系（且），后者是并集关系（或）</p></blockquote> <ul><li><strong>ipBlock</strong> 可选择 IP CIDR 范围作为入方向访问控制规则的源或者出方向访问控制规则的目标。这里应该指定的是集群外部的 IP，因为集群内部 Pod 的 IP 地址是临时分配的，且不可预测。</li></ul> <p>集群的入方向和出方向网络机制通常需要重写网络报文的 source 或者 destination IP。kubernetes 并未定义应该在处理 <code>NetworkPolicy</code> 之前还是之后再修改 source / destination IP，因此，在不同的云供应商、使用不同的网络插件时，最终的行为都可能不一样。这意味着：</p> <ul><li>对于入方向的网络流量，某些情况下，你可以基于实际的源 IP 地址过滤流入的报文；在另外一些情况下，NetworkPolicy 所处理的 &quot;source IP&quot; 可能是 LoadBalancer 的 IP 地址，或者其他地址</li> <li>对于出方向的网络流量，<strong>基于 ipBlock 的策略可能有效，也可能无效</strong></li></ul> <h3 id="_4、场景"><a href="#_4、场景" class="header-anchor">#</a> 4、场景</h3> <p>https://kubernetes.io/zh/docs/concepts/services-networking/network-policies/#default-policies</p></div></div>  <div class="page-edit"><div class="edit-link"><a href="https://github.com/lixuanfengs/cactus-vuepress-sc/edit/master/docs/《Kubernetes教程》笔记/27.Kubernetes-服务负载均衡和网络.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77
