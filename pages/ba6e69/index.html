ss="sidebar-sub-header level4"><a href="/pages/ba6e69/#_7、可视化界面-portainer" class="sidebar-link">7、可视化界面-Portainer</a></li><li class="sidebar-sub-header level5"><a href="/pages/ba6e69/#_1、什么是portainer" class="sidebar-link">1、什么是Portainer</a></li><li class="sidebar-sub-header level5"><a href="/pages/ba6e69/#_2、安装" class="sidebar-link">2、安装</a></li></ul></li></ul></li><li><a href="/pages/04f84d/" class="sidebar-link">Docker命令复习</a></li><li><a href="/pages/7085e7/" class="sidebar-link">Docker网络和存储原理</a></li><li><a href="/pages/76386c/" class="sidebar-link">深入Dockerfile</a></li><li><a href="/pages/2fb61f/" class="sidebar-link">熟悉docker-compose</a></li><li><a href="/pages/e38561/" class="sidebar-link">docker swarm</a></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/note/Docker/#《Docker教程》笔记" data-v-06225672>《Docker教程》笔记</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2022-04-27</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Docker实验笔记<!----></h1>  <div class="theme-vdoing-content content__default"><h1 id="一、基本概念"><a href="#一、基本概念" class="header-anchor">#</a> 一、基本概念</h1> <h2 id="_1、docker架构"><a href="#_1、docker架构" class="header-anchor">#</a> 1、Docker架构</h2> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/docker-1.png" alt="">
K8S：CRI（Container Runtime Interface）
Client： 客户端；操作docker服务器的客户端（命令行或者界面） Docker_Host：Docker主机；安装Docker服务的主机Docker_Daemon：后台进程；运行在Docker服务器的后台进程
Containers：容器；在Docker服务器中的容器（一个容器一般是一个应用实例，容器间互相隔离）
Images：镜像、映像、程序包；Image是只读模板，其中包含创建Docker容器的说明。容器是由Image运行而来，Image固定不变。
Registries：仓库；存储Docker Image的地方。官方远程仓库地址： https://hub.docker.com/search</p> <blockquote><p>Docker用Go编程语言编写，并利用Linux内核的多种功能来交付其功能。 Docker使用一种称为名称空间的技术来提供容器的隔离工作区。 运行容器时，Docker会为该容器创建一组名称空间。 这些名称空间提供了一层隔离。 容器的每个方面都在单独的名称空间中运行，并且对其的访问仅限于该名称空间。</p></blockquote> <table><thead><tr><th><strong>Docker</strong></th> <th><strong>面向对象</strong></th></tr></thead> <tbody><tr><td>镜像（Image）</td> <td>类</td></tr> <tr><td>容器（Container）</td> <td>对象（实例）</td></tr></tbody></table> <p><strong>容器与虚拟机</strong></p> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-vuepress-img/docker-2.png" alt=""></p> <h2 id="_2、docker隔离原理"><a href="#_2、docker隔离原理" class="header-anchor">#</a> 2、Docker隔离原理</h2> <ul><li><strong>namespace 6项隔离 （资源隔离）</strong></li></ul> <table><thead><tr><th><strong>namespace</strong></th> <th><strong>系统调用参数</strong></th> <th><strong>隔离内容</strong></th></tr></thead> <tbody><tr><td>UTS</td> <td>CLONE_NEWUTS</td> <td>主机和域名</td></tr> <tr><td>IPC</td> <td>CLONE_NEWIPC</td> <td>信号量、消息队列和共享内存</td></tr> <tr><td>PID</td> <td>CLONE_NEWPID</td> <td>进程编号</td></tr> <tr><td>Network</td> <td>CLONE_NEWNET</td> <td>网络设备、网络栈、端口等</td></tr> <tr><td>Mount</td> <td>CLONE_NEWNS</td> <td>挂载点(文件系统)</td></tr> <tr><td>User</td> <td>CLONE_NEWUSER</td> <td>用户和用户组</td></tr></tbody></table> <ul><li><strong>cgroups资源限制 （资源限制）</strong></li></ul> <p>cgroup提供的主要功能如下：</p> <ol><li>资源限制：限制任务使用的资源总额，并在超过这个配额时发出提示</li> <li>优先级分配：分配CPU时间片数量及磁盘IO带宽大小、控制任务运行的优先级资源统计：统计系统资源使用量，如CPU使用时长、内存用量等</li> <li>任务控制：对任务执行挂起、恢复等操作</li></ol> <blockquote><p>cgroup资源控制系统，每种子系统独立地控制一种资源。功能如下</p></blockquote> <table><thead><tr><th><strong>子系统</strong></th> <th><strong>功能</strong></th></tr></thead> <tbody><tr><td>cpu</td> <td>使用调度程序控制任务对CPU的使用。</td></tr> <tr><td>cpuacct(CPU Accounting)</td> <td>自动生成cgroup中任务对CPU资源使用情况的报告。</td></tr> <tr><td>cpuset</td> <td>为cgroup中的任务分配独立的CPU(多处理器系统时)和内存。</td></tr> <tr><td>devices</td> <td>开启或关闭cgroup中任务对设备的访问</td></tr> <tr><td>freezer</td> <td>挂起或恢复cgroup中的任务</td></tr> <tr><td>memory</td> <td>设定cgroup中任务对内存使用量的限定，并生成这些任务对内存资源使用情况的报告</td></tr> <tr><td>perf_event(Linux CPU性能探测器)</td> <td>使cgroup中的任务可以进行统一的性能测试</td></tr> <tr><td>net_cls(Docker未使用)</td> <td>通过等级识别符标记网络数据包，从而允许Linux流量监控程序(Traffic Controller)识别从具体cgroup中生成的数据包</td></tr></tbody></table> <h2 id="_3、docker安装"><a href="#_3、docker安装" class="header-anchor">#</a> <strong>3、Docker安装</strong></h2> <blockquote><p>以下以centos为例；</p> <p>更多其他安装方式，详细参照文档： <a href="https://docs.docker.com/engine/install/centos/" target="_blank" rel="noopener noreferrer"><strong>https://docs.docker.com/engine/install/centos/</strong><span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <h3 id="_1、移除旧版本"><a href="#_1、移除旧版本" class="header-anchor">#</a> 1、移除旧版本</h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">sudo</span> yum remove docker*
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="_2、设置docker-yum源"><a href="#_2、设置docker-yum源" class="header-anchor">#</a> 2、设置docker yum源</h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">sudo</span> yum <span class="token function">install</span> <span class="token parameter variable">-y</span> yum-utils
<span class="token function">sudo</span> yum-config-manager <span class="token punctuation">\</span>
--add-repo <span class="token punctuation">\</span>
https://download.docker.com/linux/centos/docker-ce.repo
<span class="token comment">#此处可以百度 docker yum aliyun 切换为ali的yum源</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h3 id="_3、安装最新docker-engine"><a href="#_3、安装最新docker-engine" class="header-anchor">#</a> 3、安装最新docker engine</h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">sudo</span> yum <span class="token function">install</span> docker-ce docker-ce-cli containerd.io
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="_4、安装指定版本docker-engine"><a href="#_4、安装指定版本docker-engine" class="header-anchor">#</a> 4、安装指定版本docker engine</h3> <h4 id="_1、在线安装"><a href="#_1、在线安装" class="header-anchor">#</a> 1、在线安装</h4> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment">#找到所有可用docker版本列表</span>
yum list docker-ce <span class="token parameter variable">--showduplicates</span> <span class="token operator">|</span> <span class="token function">sort</span> <span class="token parameter variable">-r</span>
<span class="token comment"># 安装指定版本，用上面的版本号替换&lt;VERSION_STRING&gt;</span>
<span class="token function">sudo</span> yum <span class="token function">install</span> docker-ce-<span class="token operator">&lt;</span>VERSION_STRING<span class="token operator">&gt;</span>.x86_64 docker-ce-cli-<span class="token operator">&lt;</span>VERSION_STRING<span class="token operator">&gt;</span>.x86_64 containerd.io 
<span class="token comment">#例如：</span>
<span class="token comment">#yum install docker-ce-3:20.10.5-3.el7.x86_64 docker-ce-cli-3:20.10.5- 3.el7.x86_64 containerd.io</span>
<span class="token comment">#注意加上 .x86_64 大版本号</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><h4 id="_2、离线安装"><a href="#_2、离线安装" class="header-anchor">#</a> 2、离线安装</h4> <p>https://download.docker.com/linux/centos/7/x86_64/stable/Packages/</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">rpm</span> <span class="token parameter variable">-ivh</span> xxx.rpm
<span class="token comment">#可以下载 tar解压启动即可</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>https://docs.docker.com/engine/install/binaries/#install-daemon-and-client-binaries-on-linux</p> <h4 id="_5、启动服务"><a href="#_5、启动服务" class="header-anchor">#</a> 5、启动服务</h4> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>systemctl start <span class="token function">docker</span>
systemctl <span class="token builtin class-name">enable</span> <span class="token function">docker</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><h4 id="_6、镜像加速"><a href="#_6、镜像加速" class="header-anchor">#</a> 6、镜像加速</h4> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">sudo</span> <span class="token function">mkdir</span> <span class="token parameter variable">-p</span> /etc/docker
<span class="token function">sudo</span> <span class="token function">tee</span> /etc/docker/daemon.json <span class="token operator">&lt;&lt;-</span><span class="token string">'EOF'</span>
<span class="token punctuation">{</span>
<span class="token string">&quot;registry-mirrors&quot;</span><span class="token builtin class-name">:</span> <span class="token punctuation">[</span><span class="token string">&quot;https://82m9ar63.mirror.aliyuncs.com&quot;</span><span class="token punctuation">]</span>
<span class="token punctuation">}</span> EOF
<span class="token function">sudo</span> systemctl daemon-reload
<span class="token function">sudo</span> systemctl restart docke
<span class="token comment">#以后docker下载直接从阿里云拉取相关镜像</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><blockquote><p>/etc/docker/daemon.json 是Docker的核心配置文件。</p></blockquote> <h4 id="_7、可视化界面-portainer"><a href="#_7、可视化界面-portainer" class="header-anchor">#</a> 7、可视化界面-Portainer</h4> <h5 id="_1、什么是portainer"><a href="#_1、什么是portainer" class="header-anchor">#</a> 1、什么是Portainer</h5> <p>https://documentation.portainer.io/</p> <p>Portainer社区版2.0拥有超过50万的普通用户，是功能强大的开源工具集，可让您轻松地在Docker， Swarm，Kubernetes和Azure ACI中构建和管理容器。 Portainer的工作原理是在易于使用的GUI后面隐藏使管理容器变得困难的复杂性。通过消除用户使用CLI，编写YAML或理解清单的需求，Portainer使部署 应用程序和解决问题变得如此简单，任何人都可以做到。 Portainer开发团队在这里为您的Docker之旅提供帮助；</p> <h5 id="_2、安装"><a href="#_2、安装" class="header-anchor">#</a> 2、安装</h5> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># 服务端部署</span>
<span class="token function">docker</span> run <span class="token parameter variable">-d</span> <span class="token parameter variable">-p</span> <span class="token number">8000</span>:8000 <span class="token parameter variable">-p</span> <span class="token number">9000</span>:9000 <span class="token parameter variable">--name</span><span class="token operator">=</span>portainer <span class="token parameter variable">--restart</span><span class="token operator">=</span>always <span class="token parameter variable">-v</span>
/var/run/docker.sock:/var/run/docker.sock <span class="token parameter variable">-v</span> portainer_data:/data portainer/portainer-ce
<span class="token comment"># 访问 9000 端口即可</span>

<span class="token comment">#agent端部署</span>
<span class="token function">docker</span> run <span class="token parameter variable">-d</span> <span class="token parameter variable">-p</span> <span class="token number">9001</span>:9001 <span class="token parameter variable">--name</span> portainer_agent <span class="token parameter variable">--restart</span><span class="token operator">=</span>always <span class="token parameter variable">-v</span>
/var/run/docker.sock:/var/run/docker.sock <span class="token parameter variable">-v</span>
/var/lib/docker/volumes:/var/lib/docker/volumes portainer/agent
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div></div></div>  <div class="page-edit"><div class="edit-link"><a href="https://github.com/lixuanfengs/cactus-vuepress-sc/edit/master/docs/《Docker教程》笔记/05.Docker实验笔记.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2022/07/06, 10:17:30</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><!----> <a href="/pages/04f84d/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Docker命令复习</div></a></div> <div class="page-nav"><p class="inner"><!----> <span class="next"><a href="/pages/04f84d/">Docker命令复习</a>→
