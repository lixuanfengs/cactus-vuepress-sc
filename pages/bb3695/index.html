href="/pages/6936ee/" class="sidebar-link">前后端分离应用的跨域接口调用</a></li><li><a href="/pages/13559a/" class="sidebar-link">网关Nginx负载模型配置</a></li><li><a href="/pages/918d1a/" class="sidebar-link">动态刷新网关Nginx负载均衡配置</a></li><li><a href="/pages/dea686/" class="sidebar-link">实现网关算力节点动态负载功能</a></li><li><a href="/pages/1bdcba/" class="sidebar-link">网关组件工程模块合并</a></li><li><a href="/pages/d9cb43/" class="sidebar-link">功能完善(算力关联、接口上报、调用反馈)</a></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/note/Gateway/#《API网关设计与实现》" data-v-06225672>《API网关设计与实现》</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2023-09-11</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->订阅服务注册消息驱动网关映射<!----></h1>  <div class="theme-vdoing-content content__default"><h2 id="学习方法"><a href="#学习方法" class="header-anchor">#</a> <strong>学习方法</strong></h2> <p>设计的主要目标是解决各种微观细节问题。</p> <p>在软件服务或应用程序的开发过程中，如果忽略了一些小细节，那么就会导致需要与所有用户进行信息沟通，并且所有用户都会因设计缺陷而增加额外工作负担。</p> <p>举例来说，当您开发一个组件时，其中可能存在需要特别注意的配置项。如果配置错误，系统将无法正常运行。或许在最初开发这个组件时，您可能没有意识到这个问题，因为一个配置错误似乎不会对沟通产生太大成本。但随着越来越多的用户使用这个组件，您的设计缺陷会分摊到每个用户身上，造成的成本将会非常显著。</p> <h2 id="消息监听"><a href="#消息监听" class="header-anchor">#</a> <strong>消息监听</strong></h2> <p>在本章中，我们将探讨一个重要的开发需求，该需求涉及到我们的网关算力服务在启动时如何获取和处理注册中心的接口信息，以便在访问网关接口时能够实现对应的 RPC 服务泛化调用。让我们深入了解这个需求的背景和解决方案。</p> <p><strong>背景需求</strong>：网关算力服务在启动过程中的一个关键步骤是拉取注册中心的接口信息并在网关算法中进行注册操作。这个步骤至关重要，因为只有通过这个过程，我们才能够在访问网关接口时实现对应的泛化 RPC 服务调用。</p> <p><strong>解决方案考虑</strong>：在网关算力服务已经部署在 Docker 容器中后，当新的服务或接口注册到网关注册中心时，我们需要考虑如何获取这些信息并完成网关的映射。</p> <ul><li><p><strong>方案1: 接口轮询</strong></p> <p>在网关算力的 <code>api-gateway-assist</code> 助手服务中，我们可以通过定期向网关中心请求接口信息的方式，将需要注册的接口拉取到本地。此外，我们可以在已经拉取的服务接口上记录数据到 Redis 中，以减少重复拉取。但需要注意，这种方式可能会给网关中心带来一定的压力。</p></li> <li><p><strong>方案2: 服务连接</strong></p> <p>另一种方式是，在网关助手类与网关中心建立 Netty 服务连接。当网关中心接收到新的接口注册时，通过这个连接通知网关算力。然而，需要注意的是，这样的长连接可能会占用较多的资源。</p></li> <li><p><strong>方案3: 事件通知</strong></p> <p>最后，通过事件通知是一个更合适的方式。我们可以使用消息队列（MQ）、ZooKeeper（ZK）等方式，也可以使用 Redis 的发布和订阅功能。当接口发生变化时，通过消息的推送，通知网关算力获取新的接口信息并进行注册处理。本文采用了 Redis 来实现这个事件通知机制。</p></li></ul> <p>通过以上方案的讨论，我们能更好地理解如何在容器化环境中高效地处理新接口的注册情况，以确保网关算力服务能够与最新的接口信息保持同步，从而实现平滑的服务调用。</p> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-blogs/image-20230914112159655.png" alt="image-20230914112159655"></p> <p>api-gateway-assist、api-gateway-center、api-gateway-sdk，都是本章节中所涉及要改动的工程；</p> <ul><li>在 api-gateway-center 工程中添加 Redis 发布消息模块，并提供应用服务注册后的事件通知操作。这个通知只会通知给对应的网关算力服务，不会全局通知。</li> <li>在 api-gateway-assist 工程中开发 Redis 订阅消息模块，当收到注册中心的消息推送时，则根据系统的标识信息进行拉取服务。<strong>注意这里你可以进行细化，只把变更的信息一条条推送给网关注册，减少接口的拉取</strong></li> <li>在 api-gateway-sdk 工程中添加对网关注册中心接口的调用，当所有的服务注册完成后，调用接口进行通知。</li></ul> <h2 id="注册中心"><a href="#注册中心" class="header-anchor">#</a> <strong>注册中心</strong></h2> <h3 id="工程结构"><a href="#工程结构" class="header-anchor">#</a> <strong>工程结构</strong></h3> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-blogs/image-20230915155533241.png" alt="image-20230915155533241"></p> <ul><li>源码：------</li></ul> <h3 id="消息发布"><a href="#消息发布" class="header-anchor">#</a> <strong>消息发布</strong></h3> <p>在 api-gateway-center 注册中心服务中提供 Redis 的发布模块，并在应用服务注册接口中调用该方法。</p> <p>POM配置</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token generics"><span class="token punctuation">&lt;</span>dependency<span class="token punctuation">&gt;</span></span>
    <span class="token generics"><span class="token punctuation">&lt;</span>groupId<span class="token punctuation">&gt;</span></span>org<span class="token punctuation">.</span>springframework<span class="token punctuation">.</span>boot<span class="token operator">&lt;</span><span class="token operator">/</span>groupId<span class="token operator">&gt;</span>
    <span class="token generics"><span class="token punctuation">&lt;</span>artifactId<span class="token punctuation">&gt;</span></span>spring<span class="token operator">-</span>boot<span class="token operator">-</span>starter<span class="token operator">-</span>data<span class="token operator">-</span>redis<span class="token operator">&lt;</span><span class="token operator">/</span>artifactId<span class="token operator">&gt;</span>
<span class="token operator">&lt;</span><span class="token operator">/</span>dependency<span class="token operator">&gt;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>yml配置</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code>redis<span class="token operator">:</span>
    host<span class="token operator">:</span> <span class="token number">192.168</span><span class="token number">.1</span><span class="token number">.18</span>
    port<span class="token operator">:</span> <span class="token number">6380</span>
    password<span class="token operator">:</span> <span class="token class-name">Nstr</span><span class="token punctuation">.</span>@#$<span class="token number">808</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><h4 id="消息发布-2"><a href="#消息发布-2" class="header-anchor">#</a> <strong>消息发布</strong></h4> <p><strong>源码详见：cn.cactusli.gateway.center.domain.message.Publisher</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Publisher</span> <span class="token punctuation">{</span>

    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">RedisTemplate</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> redisMessageTemplate<span class="token punctuation">;</span>

    <span class="token annotation punctuation">@Autowired</span>
    <span class="token keyword">public</span> <span class="token class-name">Publisher</span><span class="token punctuation">(</span><span class="token class-name">RedisTemplate</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> redisMessageTemplate<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>redisMessageTemplate <span class="token operator">=</span> redisMessageTemplate<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">pushMessage</span><span class="token punctuation">(</span><span class="token class-name">String</span> topic<span class="token punctuation">,</span> <span class="token class-name">Object</span> message<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        redisMessageTemplate<span class="token punctuation">.</span><span class="token function">convertAndSend</span><span class="token punctuation">(</span>topic<span class="token punctuation">,</span> message<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><ul><li>在 domain/message 包下，提供了 Redis 的消息发布功能模块。当有注册服务接口变更的时候，可以通过消息发布模块推送出去。</li></ul> <h4 id="事件通知"><a href="#事件通知" class="header-anchor">#</a> <strong>事件通知</strong></h4> <p>**源码详见：cn.cactusli.gateway.center.interfaces.RpcRegisterManage#registerEvent **</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@PostMapping</span><span class="token punctuation">(</span>value <span class="token operator">=</span> <span class="token string">&quot;registerEvent&quot;</span><span class="token punctuation">,</span> produces <span class="token operator">=</span> <span class="token string">&quot;application/json;charset=utf-8&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token class-name">Result</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Boolean</span><span class="token punctuation">&gt;</span></span> <span class="token function">registerEvent</span><span class="token punctuation">(</span><span class="token annotation punctuation">@RequestParam</span> <span class="token class-name">String</span> systemId<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">try</span> <span class="token punctuation">{</span>
        logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;应用信息注册完成通知 systemId：{}&quot;</span><span class="token punctuation">,</span> systemId<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 推送消息</span>
        <span class="token class-name">String</span> gatewayId <span class="token operator">=</span> configManageService<span class="token punctuation">.</span><span class="token function">queryGatewayDistribution</span><span class="token punctuation">(</span>systemId<span class="token punctuation">)</span><span class="token punctuation">;</span>
        messageService<span class="token punctuation">.</span><span class="token function">pushMessage</span><span class="token punctuation">(</span>gatewayId<span class="token punctuation">,</span> systemId<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">Result</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token class-name">ResponseCode</span><span class="token punctuation">.</span><span class="token constant">SUCCESS</span><span class="token punctuation">.</span><span class="token function">getCode</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token class-name">ResponseCode</span><span class="token punctuation">.</span><span class="token constant">SUCCESS</span><span class="token punctuation">.</span><span class="token function">getInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token boolean">true</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        logger<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;应用信息注册完成通知失败 systemId：{}&quot;</span><span class="token punctuation">,</span> systemId<span class="token punctuation">,</span> e<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">Result</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token class-name">ResponseCode</span><span class="token punctuation">.</span><span class="token constant">UN_ERROR</span><span class="token punctuation">.</span><span class="token function">getCode</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> e<span class="token punctuation">.</span><span class="token function">getMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token boolean">false</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><ul><li>这里通了一个注册事件，既可以被 api-gateway-sdk 使用，也可以被运用平台调用，进行消息推送，让网关服务拉取最新的系统信息。</li></ul> <h2 id="网关助手"><a href="#网关助手" class="header-anchor">#</a> <strong>网关助手</strong></h2> <h3 id="工程结构-2"><a href="#工程结构-2" class="header-anchor">#</a> <strong>工程结构</strong></h3> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-blogs/image-20230915155646909.png" alt="image-20230915155646909"></p> <ul><li>源码：------</li></ul> <h3 id="连接服务"><a href="#连接服务" class="header-anchor">#</a> <strong>连接服务</strong></h3> <p>为了接收来自注册中心的消息推送，网关助手服务需要建立与相应 Redis 服务的连接。在这个过程中，用户无需手动配置 Redis 连接信息在网关助手类中，而是通过一种更智能的方式，从注册中心获取 Redis 连接信息并将其注册到网关助手中。这种优化的方式有助于减轻用户的配置负担，同时实现了连接信息的统一管理。</p> <p><strong>源码详见：cn.cactusli.gateway.assist.config.GatewayAutoConfig#redisConnectionFactory</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Bean</span>
<span class="token keyword">public</span> <span class="token class-name">RedisConnectionFactory</span> <span class="token function">redisConnectionFactory</span><span class="token punctuation">(</span><span class="token class-name">GatewayServiceProperties</span> properties<span class="token punctuation">,</span> <span class="token class-name">GatewayCenterService</span> gatewayCenterService<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 1. 拉取注册中心的 Redis 配置信息</span>
    <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> redisConfig <span class="token operator">=</span> gatewayCenterService<span class="token punctuation">.</span><span class="token function">queryRedisConfig</span><span class="token punctuation">(</span>properties<span class="token punctuation">.</span><span class="token function">getAddress</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 2. 创建 Redis 连接服务</span>
    <span class="token class-name">RedisStandaloneConfiguration</span> standaloneConfiguration <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">RedisStandaloneConfiguration</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    standaloneConfiguration<span class="token punctuation">.</span><span class="token function">setHostName</span><span class="token punctuation">(</span>redisConfig<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;host&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    standaloneConfiguration<span class="token punctuation">.</span><span class="token function">setPort</span><span class="token punctuation">(</span><span class="token class-name">Integer</span><span class="token punctuation">.</span><span class="token function">parseInt</span><span class="token punctuation">(</span>redisConfig<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;port&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    standaloneConfiguration<span class="token punctuation">.</span><span class="token function">setPassword</span><span class="token punctuation">(</span>redisConfig<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token string">&quot;password&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 3. 默认配置信息：一般这些配置可以被抽取出来</span>

    // 2. 拉取网关配置；每个网关算力都会在注册中心分配上需要映射的RPC服务信息，包括；系统、接口、方法
    ApplicationSystemRichInfo applicationSystemRichInfo = gatewayCenterService.pullApplicationSystemRichInfo(properties.getAddress(), properties.getGatewayId(), systemId);
    List&lt;ApplicationSystemVO&gt; applicationSystemVOList = applicationSystemRichInfo.getApplicationSystemVOList();
    if (applicationSystemVOList.isEmpty()) {
        logger.warn(&quot;网关{}服务注册映射为空，请排查 gatewayCenterService.pullApplicationSystemRichInfo 是否检索到此网关算力需要拉取的配置数据。&quot;, systemId);
        return;
    }
    for (ApplicationSystemVO systemVO : applicationSystemVOList) {
        List&lt;ApplicationInterfaceVO&gt; interfaceList = systemVO.getInterfaceList();
        for (ApplicationInterfaceVO interfaceVO : interfaceList) {
            // 2.1 创建配置信息加载注册
            configuration.registryConfig(systemVO.getSystemId(), systemVO.getSystemRegistry(), interfaceVO.getInterfaceId(), interfaceVO.getInterfaceVersion());
            // 2.2 注册系统服务接口信息
            for (ApplicationInterfaceMethodVO methodVO : interfaceVO.getMethodList()) {
                HttpStatement httpStatement = new HttpStatement(
                        systemVO.getSystemId(),
                        interfaceVO.getInterfaceId(),
                        methodVO.getMethodId(),
                        methodVO.getParameterType(),
                        methodVO.getUri(),
                        HttpCommandType.valueOf(methodVO.getHttpCommandType()),
                        methodVO.isAuth());
                configuration.addMapper(httpStatement);
                logger.info(&quot;网关服务注册映射 系统：{} 接口：{} 方法：{}&quot;, systemVO.getSystemId(), methodVO.getInterfaceId(), methodVO.getMethodId());
            }
        }
    }
}

public void receiveMessage(Object message) {
    logger.info(&quot;【事件通知】接收注册中心推送消息 message：{}&quot;, message);
    addMappers(message.toString().substring(1, message.toString().length() - 1));
}
