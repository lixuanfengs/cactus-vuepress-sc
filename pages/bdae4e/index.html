习方法</a></li><li class="sidebar-sub-header level2"><a href="/pages/bdae4e/#组件管理" class="sidebar-link">组件管理</a></li><li class="sidebar-sub-header level2"><a href="/pages/bdae4e/#功能实现" class="sidebar-link">功能实现</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level3"><a href="/pages/bdae4e/#工程结构" class="sidebar-link">工程结构</a></li><li class="sidebar-sub-header level3"><a href="/pages/bdae4e/#引入服务" class="sidebar-link">引入服务</a></li><li class="sidebar-sub-header level3"><a href="/pages/bdae4e/#服务创建" class="sidebar-link">服务创建</a></li><li class="sidebar-sub-header level3"><a href="/pages/bdae4e/#注册接口" class="sidebar-link">注册接口</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/pages/bdae4e/#测试验证" class="sidebar-link">测试验证</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level3"><a href="/pages/bdae4e/#前置条件" class="sidebar-link">前置条件</a></li><li class="sidebar-sub-header level3"><a href="/pages/bdae4e/#网关助手" class="sidebar-link">网关助手</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/pages/bdae4e/#本章小结" class="sidebar-link">本章小结</a></li></ul></li><li><a href="/pages/c2f223/" class="sidebar-link">容器关闭监听和异常管理</a></li><li><a href="/pages/81289e/" class="sidebar-link">网关引擎打包镜像部署</a></li><li><a href="/pages/3750a4/" class="sidebar-link">服务注册组件搭建采集接口信息</a></li><li><a href="/pages/46c35f/" class="sidebar-link">应用服务接口注册到注册中心</a></li><li><a href="/pages/bb3695/" class="sidebar-link">订阅服务注册消息驱动网关映射</a></li><li><a href="/pages/2d7dcf/" class="sidebar-link">网关运营管理后台框架搭建</a></li><li><a href="/pages/6936ee/" class="sidebar-link">前后端分离应用的跨域接口调用</a></li><li><a href="/pages/13559a/" class="sidebar-link">网关Nginx负载模型配置</a></li><li><a href="/pages/918d1a/" class="sidebar-link">动态刷新网关Nginx负载均衡配置</a></li><li><a href="/pages/dea686/" class="sidebar-link">实现网关算力节点动态负载功能</a></li><li><a href="/pages/1bdcba/" class="sidebar-link">网关组件工程模块合并</a></li><li><a href="/pages/d9cb43/" class="sidebar-link">功能完善(算力关联、接口上报、调用反馈)</a></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/note/Gateway/#《API网关设计与实现》" data-v-06225672>《API网关设计与实现》</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2023-08-18</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->核心通信组件管理和处理服务映射<!----></h1>  <div class="theme-vdoing-content content__default"><h2 id="学习方法"><a href="#学习方法" class="header-anchor">#</a> <strong>学习方法</strong></h2> <p>为什么你无法构建出那些优秀的架构呢？</p> <p>通常我们使用MVC作为业务开发架构，然而，当逐步接触一些源代码时，会发现这些代码并不遵循MVC架构。甚至在很多情况下，这些分层结构会显得非常陌生。但是，当我们开始深入分析和梳理时，会发现这些分层结构实际上非常优秀。</p> <p>但为什么在你开发通用的技术项目时，你的思维结构并不是这样的呢？你总是觉得自己要开始编码，然后不断地在一个service包中添加逻辑。这是因为吸收优秀框架源代码的经验太少了，你脑中唯一的印象就是MVC。你的编程视野还没有打开，所以你没有可以模仿的分层结构。</p> <p>因此，为了提升这方面的技能，你必须多学习不同类型的源代码架构，并不断地应用和实践，才能提升自己的能力。</p> <h2 id="组件管理"><a href="#组件管理" class="header-anchor">#</a> <strong>组件管理</strong></h2> <p>本章在<code>服务配置拉取和组件使用验证</code>一节的基础上，进一步完善了服务发现的相关功能。它将从注册中心获取的网关映射信息【系统、接口、方法】映射到本地通信组件中。这个步骤实现了将注册中心和本地服务进行有效连接的过程。一旦映射完成，就能够通过HTTP请求到达网关通信层，从而成功进行RPC的泛化调用。</p> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-blogs/image-20230818172139917.png" alt="image-20230818172139917"></p> <ul><li><p>首先，在实现过程中，需要将api-gateway-core-09【截止本章最新版本】引入到api-gateway-assist中。通过GatewayAutoConfig配置类，可以创建并启动网关通信组件的Bean对象。</p></li> <li><p>随后，在GatewayApplication中，可以处理从网关注册中心获取的接口信息，进行注册操作。具体即将接口注册到api-gateway-core中，完成映射操作。你可以参考api-gateway-core-09的ApiTest测试类来进行操作。</p></li></ul> <h2 id="功能实现"><a href="#功能实现" class="header-anchor">#</a> <strong>功能实现</strong></h2> <h3 id="工程结构"><a href="#工程结构" class="header-anchor">#</a> <strong>工程结构</strong></h3> <p><img src="https://lixuanfengs.github.io/blog-images/cactus-blogs/image-20230825095243448.png" alt="image-20230825095243448"></p> <ul><li>源码：------</li></ul> <h3 id="引入服务"><a href="#引入服务" class="header-anchor">#</a> <strong>引入服务</strong></h3> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token operator">&lt;</span><span class="token operator">!</span><span class="token operator">--</span> 引入网关通信组件 <span class="token operator">--</span><span class="token operator">&gt;</span>
<span class="token generics"><span class="token punctuation">&lt;</span>dependency<span class="token punctuation">&gt;</span></span>
