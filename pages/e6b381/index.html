>消息处理器链表 ChannelPipeline</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level2"><a href="/pages/e6b381/#channelpipeline-消息处理器链表" class="sidebar-link">ChannelPipeline：消息处理器链表</a></li><li class="sidebar-sub-header level2"><a href="/pages/e6b381/#io-事件-inbound-outbound" class="sidebar-link">IO 事件：Inbound &amp; Outbound</a></li><li class="sidebar-sub-header level2"><a href="/pages/e6b381/#channelpipeline-源码解读" class="sidebar-link">ChannelPipeline 源码解读</a></li></ul></li><li><a href="/pages/f6b636/" class="sidebar-link">异步操作 Future 和 Promise</a></li><li><a href="/pages/8a50ca/" class="sidebar-link">线程池 EventLoopGroup</a></li></ul></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Dubbo</span> <span class="arrow right"></span></p> <!----></section></li></ul></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/Java/#后端" data-v-06225672>后端</a></li><li data-v-06225672><a href="/Java/#阅读源码系列" data-v-06225672>阅读源码系列</a></li><li data-v-06225672><a href="/Java/#Netty" data-v-06225672>Netty</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2022-05-11</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->消息处理器链表 ChannelPipeline<!----></h1>  <div class="theme-vdoing-content content__default"><p>注：我对原文进行了格式规范和内容完善。</p> <p>原文地址：https://www.javadoop.com/post/netty-part-4</p> <p>作者：JavaDoop</p> <p><code>ChannelHandler</code> 是消息的具体处理器，主要负责处理客户端/服务端接收和发送的数据。<code>ChannelPipeline</code> 则是包含了一个或多个 <code>ChannelHandler</code> 的链表。</p> <h2 id="channelpipeline-消息处理器链表"><a href="#channelpipeline-消息处理器链表" class="header-anchor">#</a> ChannelPipeline：消息处理器链表</h2> <p>我想很多读者应该或多或少都有 Netty 中 <code>pipeline</code> 的概念。前面我们说了，使用 Netty 的时候，我们通常就只要写一些自定义的 <code>handler</code> 就可以了，我们定义的这些 <code>handler</code> 会组成一个 <code>pipeline</code>，用于处理 IO 事件，这个和我们平时接触的 <code>Filter</code> 或 <code>Interceptor</code> 表达的差不多是一个意思。</p> <p>每个 <code>Channel</code> 内部都有一个 pipeline，pipeline 由多个 <code>handler</code> 组成，<code>handler</code> 之间的顺序是很重要的，因为 IO 事件将按照顺序顺次经过 <code>pipeline</code> 上的 <code>handler</code>，这样每个 <code>handler</code> 可以专注于做一点点小事，由多个 handler 组合来完成一些复杂的逻辑。</p> <p><img src="https://www.javadoop.com/blogimages/netty-source/11.png" alt="img"></p> <p>从图中，我们知道这是一个双向链表。</p> <h2 id="io-事件-inbound-outbound"><a href="#io-事件-inbound-outbound" class="header-anchor">#</a> IO 事件：Inbound &amp; Outbound</h2> <p>首先，我们看两个重要的概念：<strong>Inbound</strong> 和 <strong>Outbound</strong>。在 Netty 中，IO 事件被分为 Inbound 事件和 Outbound 事件。</p> <p><strong>Outbound</strong> 的 <strong>out</strong> 指的是 <strong>出去</strong>，有哪些 IO 事件属于此类呢？比如 <code>connect</code>、<code>write</code>、<code>flush</code> 这些 IO 操作是往外部方向进行的，它们就属于 Outbound 事件。</p> <p>其他的，诸如 <code>accept</code>、<code>read</code> 这种就属于 Inbound 事件。</p> <p>比如客户端在发起请求的时候，需要下面几步：</p> <ol><li><code>connect</code> 到服务器;</li> <li><code>write</code> 数据传到服务器</li> <li><code>read</code> 服务器返回的数据</li></ol> <p><code>connect</code> 和 <code>write</code> 就是 <strong>out</strong> 事件，后面的 <code>read</code> 就是 <strong>in</strong> 事件。</p> <p>比如很多初学者看不懂下面的这段代码，这段代码用于服务端的 childHandler 中：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token number">1.</span> pipeline<span class="token punctuation">.</span><span class="token function">addLast</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">StringDecoder</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token number">2.</span> pipeline<span class="token punctuation">.</span><span class="token function">addLast</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">StringEncoder</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token number">3.</span> pipeline<span class="token punctuation">.</span><span class="token function">addLast</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">BizHandler</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>初学者肯定都纳闷，以为这个顺序写错了，应该是先 decode 客户端过来的数据，然后用 <code>BizHandler</code> 处理业务逻辑，最后再 encode 数据然后返回给客户端，所以添加的顺序应该是 <strong>1 -&gt; 3 -&gt; 2</strong> 才对。</p> <p>其实这里的三个 handler 是分组的，分为 Inbound（1 和 3） 和 Outbound（2）：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token number">1.</span> pipeline<span class="token punctuation">.</span><span class="token function">addLast</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">StringDecoder</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token number">2.</span> pipeline<span class="token punctuation">.</span><span class="token function">addLast</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">StringEncoder</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token number">3.</span> pipeline<span class="token punctuation">.</span><span class="token function">addLast</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">BizHandler</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><ul><li>客户端连接进来的时候，读取（read）客户端请求数据的操作是 Inbound 的，所以会先使用 1，然后是 3 对处理进行处理；</li> <li>处理完数据后，返回给客户端数据的 write 操作是 Outbound 的，此时使用的是 2。</li></ul> <p>所以虽然添加顺序有点怪，但是执行顺序其实是按照 1 -&gt; 3 -&gt; 2 进行的。</p> <p>如果我们在上面的基础上，加上下面的第四行，这是一个 OutboundHandler：</p> <p>那么执行顺序是不是就是 1 -&gt; 3 -&gt; 2 -&gt; 4 呢？答案是：不是的。</p> <p><strong>对于 Inbound 操作，按照添加顺序执行每个 Inbound 类型的</strong> <code>**handler**</code><strong>；而对于 Outbound 操作，是反着来的，从后往前，顺次执行 Outbound 类型的</strong> <code>**handler**</code><strong>。</strong></p> <p>所以，上面的顺序应该是先 1 后 3，它们是 Inbound 的，然后是 4，最后才是 2，它们两个是 Outbound 的。说实话，这种组织方式对新手应该很是头疼。</p> <p>那我们在开发的时候怎么写呢？其实也很简单，从最外层开始写，一步步写到业务处理层，把 Inbound 和 Outbound 混写在一起。比如 encode 和 decode 是属于最外层的处理逻辑，先写它们。假设 decode 以后是字符串，那再进来一层应该可以写进来和出去的日志。再进来一层可以写 字符串 &lt;=&gt; 对象 的相互转换。然后就应该写业务层了。</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token number">4.</span> pipeline<span class="token punctuation">.</span><span class="token function">addLast</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">OutboundHandlerA</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>到这里，我想大家应该都知道 Inbound 和 Outbound 了吧？下面我们来介绍它们的接口使用。</p> <p><img src="https://www.javadoop.com/blogimages/netty-source/9.png" alt="img"></p> <p>定义处理 Inbound 事件的 <code>handler</code> 需要实现 <code>ChannelInboundHandler</code>，定义处理 Outbound 事件的 <code>handler</code> 需要实现 <code>ChannelOutboundHandler</code>。最下面的三个类，是 Netty 提供的适配器，特别的，如果我们希望定义一个 handler 能同时处理 Inbound 和 Outbound 事件，可以通过继承中间的 <code>**ChannelDuplexHandler**</code> 的方式，比如 <code>**LoggingHandler**</code> 这种既可以用来处理 Inbound 也可以用来处理 Outbound 事件的 <code>handler</code>。</p> <p>下图来源于 <a href="http://tutorials.jenkov.com/netty/netty-channelpipeline.html" target="_blank" rel="noopener noreferrer">Netty ChannelPipeline<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> 。</p> <p><img src="http://tutorials.jenkov.com/images/netty/channelpipeline-1.png" alt="img"></p> <p>有了 Inbound 和 Outbound 的概念以后，我们来开始介绍 Pipeline 的源码。</p> <h2 id="channelpipeline-源码解读"><a href="#channelpipeline-源码解读" class="header-anchor">#</a> ChannelPipeline 源码解读</h2> <p>我们说过，一个 <code>Channel</code> 关联一个 pipeline，<code>NioSocketChannel</code> 和 <code>NioServerSocketChannel</code> 在执行构造方法的时候，都会走到它们的父类 <code>AbstractChannel</code> 的构造方法中：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">protected</span> <span class="token class-name">AbstractChannel</span><span class="token punctuation">(</span><span class="token class-name">Channel</span> parent<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">this</span><span class="token punctuation">.</span>parent <span class="token operator">=</span> parent<span class="token punctuation">;</span>
    <span class="token comment">// 给每个 channel 分配一个唯一 id</span>
    id <span class="token operator">=</span> <span class="token function">newId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 每个 channel 内部需要一个 Unsafe 的实例</span>
    unsafe <span class="token operator">=</span> <span class="token function">newUnsafe</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 每个 channel 内部都会创建一个 pipeline</span>
    pipeline <span class="token operator">=</span> <span class="token function">newChannelPipeline</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>上面的三行代码中，id 比较不重要，Netty 中的 <code>Unsafe</code> 实例其实挺重要的，这里简单介绍一下。</p> <p>在 JDK 的源码中，<code>sun.misc.Unsafe</code> 类提供了一些底层操作的能力，它设计出来是给 JDK 中的源码使用的，比如 <code>AQS</code>、<code>ConcurrentHashMap</code> 等，我们在之前的并发包的源码分析中也看到了很多它们使用 <code>Unsafe</code> 的场景，这个 <code>Unsafe</code> 类不是给我们的代码使用的，是给 JDK 源码使用的（需要的话，我们也是可以获取它的实例的）。</p> <p><code>Unsafe</code> 类的构造方法是 <code>private</code> 的，但是它提供了 <code>getUnsafe()</code> 这个静态方法：</p> <p>大家可以试一下，上面这行代码编译没有问题，但是执行的时候会抛 <code>java.lang.SecurityException</code> 异常，因为它就不是给我们的代码用的。</p> <p>但是如果你就是想获取 <code>Unsafe</code> 的实例，可以通过下面这个代码获取到:</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">Unsafe</span> unsafe <span class="token operator">=</span> <span class="token class-name">Unsafe</span><span class="token punctuation">.</span><span class="token function">getUnsafe</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">Field</span> f <span class="token operator">=</span> <span class="token class-name">Unsafe</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getDeclaredField</span><span class="token punctuation">(</span><span class="token string">&quot;theUnsafe&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
f<span class="token punctuation">.</span><span class="token function">setAccessible</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">Unsafe</span> unsafe <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">Unsafe</span><span class="token punctuation">)</span> f<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span><span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>Netty 中的 <code>Unsafe</code> 也是同样的意思，它封装了 Netty 中会使用到的 JDK 提供的 NIO 接口，比如将 <code>channel</code> 注册到 <code>selector</code> 上，比如 <code>bind</code> 操作，比如 <code>connect</code> 操作等，<strong>这些操作都是稍微偏底层一些</strong>。Netty 同样也是不希望我们的业务代码使用 <code>Unsafe</code> 的实例，它是提供给 Netty 中的源码使用的。</p> <p>不过，对于我们源码分析来说，我们还是会有很多时候需要分析 Unsafe 中的源码的</p> <p>关于 <code>Unsafe</code>，我们后面用到了再说，这里只要知道，它封装了大部分需要访问 JDK 的 NIO 接口的操作就好了。这里我们继续将焦点放在实例化 <code>pipeline</code> 上：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">protected</span> <span class="token class-name">DefaultChannelPipeline</span> <span class="token function">newChannelPipeline</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">DefaultChannelPipeline</span><span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>这里开始调用 <code>DefaultChannelPipeline</code> 的构造方法，并把当前 <code>channel</code> 的引用传入：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">protected</span> <span class="token class-name">DefaultChannelPipeline</span><span class="token punctuation">(</span><span class="token class-name">Channel</span> channel<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">this</span><span class="token punctuation">.</span>channel <span class="token operator">=</span> <span class="token class-name">ObjectUtil</span><span class="token punctuation">.</span><span class="token function">checkNotNull</span><span class="token punctuation">(</span>channel<span class="token punctuation">,</span> <span class="token string">&quot;channel&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    succeededFuture <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">SucceededChannelFuture</span><span class="token punctuation">(</span>channel<span class="token punctuation">,</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    voidPromise <span class="token operator">=</span>  <span class="token keyword">new</span> <span class="token class-name">VoidChannelPromise</span><span class="token punctuation">(</span>channel<span class="token punctuation">,</span> <span class="token boolean">true</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    tail <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">TailContext</span><span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    head <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HeadContext</span><span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    head<span class="token punctuation">.</span>next <span class="token operator">=</span> tail<span class="token punctuation">;</span>
    tail<span class="token punctuation">.</span>prev <span class="token operator">=</span> head<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>这里实例化了 <code>tail</code> 和 <code>head</code> 这两个 <code>handler</code>。tail 实现了 <code>ChannelInboundHandler</code> 接口，而 <code>head</code> 实现了 <code>ChannelOutboundHandler</code> 和 <code>ChannelInboundHandler</code> 两个接口，并且最后两行代码将 <code>tail</code> 和 <code>head</code> 连接起来:</p> <p><img src="https://www.javadoop.com/blogimages/netty-source/12.png" alt="img"></p> <p>注意，在不同的版本中，源码也略有差异，<code>head</code> 不一定是 <code>in + out</code>，大家知道这点就好了。</p> <p>还有，从上面的 <code>head</code> 和 <code>tail</code> 我们也可以看到，其实 <code>pipeline</code> 中的每个元素是 <code>**ChannelHandlerContext**</code> 的实例，而不是 <code>ChannelHandler</code> 的实例，<code>context</code> 包装了一下 <code>handler</code>，但是，后面我们都会用 <code>handler</code> 来描述一个 <code>pipeline</code> 上的节点，而不是使用 <code>context</code>，希望读者知道这一点。</p> <p><code>ChannelHandlerContext</code> 可以说是 <code>ChannelPipeline</code> 的核心，它代表了 <code>ChannelHandler</code> 和 <code>ChannelPipeline</code> 之间的关联，我们首先要知道一个 <code>ChannelPipeline</code> 内部会维护一个双向链表，每当一个 <code>ChannelHandler</code> 被添加到 <code>ChannelPipeline</code> 中时，它都会被包装成为一个 <code>ChannelHandlerContext</code>，组成链表的各个节点。</p> <p><img src="http://104.244.90.112/images/a2944e63-dc68-491c-b81a-defade8a7ec6.png" alt="img"></p> <p>这里只是构造了 <code>pipeline</code>，并且添加了两个固定的 <code>handler</code> 到其中（head + tail），还不涉及到自定义的 <code>handler</code> 代码执行。我们回过头来看下面这段代码：</p> <p><img src="https://www.javadoop.com/blogimages/netty-source/13.png" alt="img"></p> <p>我们说过 <code>childHandler</code> 中指定的 <code>handler</code> 不是给 <code>NioServerSocketChannel</code> 使用的，是给 <code>NioSocketChannel</code> 使用的，所以这里我们不看它。</p> <p>这里调用 <code>handler(…)</code> 方法指定了一个 <code>LoggingHandler</code> 的实例，然后我们再进去下面的 <code>bind(…)</code> 方法中看看这个 <code>LoggingHandler</code> 实例是怎么进入到我们之前构造的 pipeline 内的。</p> <p>顺着 <code>bind()</code> 一直往前走，<code>bind()</code> -&gt; <code>doBind()</code> -&gt; <code>initAndRegister()</code>：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">final</span> <span class="token class-name">ChannelFuture</span> <span class="token function">initAndRegister</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token class-name">Channel</span> channel <span class="token operator">=</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
    <span class="token keyword">try</span> <span class="token punctuation">{</span>
        <span class="token comment">// 1. 构造 channel 实例，同时会构造 pipeline 实例，</span>
        <span class="token comment">// 现在 pipeline 中有 head 和 tail 两个 handler 了</span>
        channel <span class="token operator">=</span> channelFactory<span class="token punctuation">.</span><span class="token function">newChannel</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 2. 看这里</span>
        <span class="token function">init</span><span class="token punctuation">(</span>channel<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Throwable</span> t<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>上面的两行代码，第一行实现了构造 <code>channel</code> 和 <code>channel</code> 内部的 <code>pipeline</code>，我们来看第二行 <code>init</code> 代码：</p> <p><code>ServerBootstrap</code>：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Override</span>
<span class="token keyword">void</span> <span class="token function">init</span><span class="token punctuation">(</span><span class="token class-name">Channel</span> channel<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">Exception</span> <span class="token punctuation">{</span>
    <span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span>
    <span class="token comment">// 拿到刚刚创建的 channel 内部的 pipeline 实例</span>
    <span class="token class-name">ChannelPipeline</span> p <span class="token operator">=</span> channel<span class="token punctuation">.</span><span class="token function">pipeline</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span>
    <span class="token comment">// 开始往 pipeline 中添加一个 handler，这个 handler 是 ChannelInitializer 的实例</span>
    p<span class="token punctuation">.</span><span class="token function">addLast</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">ChannelInitializer</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Channel</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>

        <span class="token comment">// 我们以后会看到，下面这个 initChannel 方法何时会被调用</span>
        <span class="token annotation punctuation">@Override</span>
        <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">initChannel</span><span class="token punctuation">(</span><span class="token keyword">final</span> <span class="token class-name">Channel</span> ch<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">Exception</span> <span class="token punctuation">{</span>
            <span class="token keyword">final</span> <span class="token class-name">ChannelPipeline</span> pipeline <span class="token operator">=</span> ch<span class="token punctuation">.</span><span class="token function">pipeline</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token comment">// 这个方法返回我们最开始指定的 LoggingHandler 实例</span>
            <span class="token class-name">ChannelHandler</span> handler <span class="token operator">=</span> config<span class="token punctuation">.</span><span class="token function">handler</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">if</span> <span class="token punctuation">(</span>handler <span class="token operator">!=</span> <span class="token keyword">null</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                <span class="token comment">// 添加 LoggingHandler</span>
                pipeline<span class="token punctuation">.</span><span class="token function">addLast</span><span class="token punctuation">(</span>handler<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>

            <span class="token comment">// 先不用管这里的 eventLoop</span>
            ch<span class="token punctuation">.</span><span class="token function">eventLoop</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">execute</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">Runnable</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                <span class="token annotation punctuation">@Override</span>
                <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">run</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                    <span class="token comment">// 添加一个 handler 到 pipeline 中：ServerBootstrapAcceptor</span>
                    <span class="token comment">// 从名字可以看到，这个 handler 的目的是用于接收客户端请求</span>
                    pipeline<span class="token punctuation">.</span><span class="token function">addLast</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">ServerBootstrapAcceptor</span><span class="token punctuation">(</span>
                            ch<span class="token punctuation">,</span> currentChildGroup<span class="token punctuation">,</span> currentChildHandler<span class="token punctuation">,</span> currentChildOptions<span class="token punctuation">,</span> currentChildAttrs<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token punctuation">}</span>
            <span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br></div></div><p>这里涉及到 <code>pipeline</code> 中的辅助类 <code>ChannelInitializer</code>，我们看到，它本身是一个 <code>handler</code>（Inbound 类型），但是它的作用和普通 <code>handler</code> 有点不一样，它纯碎是用来辅助将其他的 <code>handler</code> 加入到 <code>pipeline</code> 中的。</p> <p>大家可以稍微看一下 <code>ChannelInitializer</code> 的 <code>initChannel</code> 方法，有个简单的认识就好，此时的 <code>pipeline</code> 应该是这样的：</p> <p><img src="https://www.javadoop.com/blogimages/netty-source/14.png" alt="img"></p> <p><code>ChannelInitializer</code> 的 <code>initChannel(channel)</code> 方法被调用的时候，会往 <code>pipeline</code> 中添加我们最开始指定的 <code>**LoggingHandler**</code> 和添加一个 <code>**ServerBootstrapAcceptor**</code>。但是我们现在还不知道这个 <code>initChannel</code> 方法何时会被调用。</p> <p>上面我们说的是作为服务端的 <code>NioServerSocketChannel</code> 的 <code>pipeline</code>，<code>NioSocketChannel</code> 也是差不多的，我们可以看一下 <code>Bootstrap</code> 类的 <code>init(channel)</code> 方法：</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">void</span> <span class="token function">init</span><span class="token punctuation">(</span><span class="token class-name">Channel</span> channel<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">Exception</span> <span class="token punctuation">{</span>
    <span class="token class-name">ChannelPipeline</span> p <span class="token operator">=</span> channel<span class="token punctuation">.</span><span class="token function">pipeline</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    p<span class="token punctuation">.</span><span class="token function">addLast</span><span class="token punctuation">(</span>config<span class="token punctuation">.</span><span class="token function">handler</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p><img src="https://www.javadoop.com/blogimages/netty-source/23.png" alt="img"></p> <p>它和服务端 <code>ServerBootstrap</code> 要添加 <code>ServerBootstrapAcceptor</code> 不一样，它只需要将 <code>EchoClient</code> 类中的 <code>ChannelInitializer</code> 实例加进来就可以了，它的 <code>ChannelInitializer</code> 中添加了两个 <code>handler</code>，<code>LoggingHandler</code> 和 <code>EchoClientHandler</code>：</p> <p><img src="https://www.javadoop.com/blogimages/netty-source/16.png" alt="img"></p> <p>很显然，我们需要的是像 <code>LoggingHandler</code> 和 <code>EchoClientHandler</code> 这样的 <code>handler</code>，但是，它们现在还不在 <code>pipeline</code> 中，那么它们什么时候会真正进入到 <code>pipeline</code> 中呢？以后我们再揭晓。</p> <p>还有，为什么 <code>Server</code> 端我们指定的是一个 <code>handler</code> 实例，而 <code>Client</code> 指定的是一个 <code>ChannelInitializer</code> 实例？其实它们是可以随意搭配使用的，你甚至可以在 <code>ChannelInitializer</code> 实例中添加 <code>ChannelInitializer</code> 的实例。</p> <p>大家要记住 <code>pipeline</code> 现在的样子，<strong>head + channelInitializer + tail</strong>。</p> <p>本节没有介绍 handler 的向后传播，就是一个 <code>handler</code> 处理完了以后，怎么传递给下一个 <code>handler</code> 来处理？比如我们熟悉的 JavaEE 中的 <code>Filter</code> 是采用在一个 <code>Filter</code> 实例中调用 <code>chain.doFilter(request, response)</code> 来传递给下一个 Filter 这种方式的。</p> <p>我们用下面这张图结束本节。下图展示了传播的方法，但我其实是更想让大家看一下，哪些事件是 Inbound 类型的，哪些是 Outbound 类型的：</p> <p><img src="https://www.javadoop.com/blogimages/netty-source/19.png" alt="img"></p> <p>Outbound 类型的几个事件大家应该比较好认，注意 <code>bind</code> 也是 Outbound 类型的</p></div></div>  <div class="page-edit"><div class="edit-link"><a href="https://github.com/lixuanfengs/cactus-vuepress-sc/edit/master/docs/07.后端/110.阅读源码系列/20.Netty/03.消息处理器链表 ChannelPipeline.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusa
