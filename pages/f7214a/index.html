der level4"><a href="/pages/f7214a/#查询数据" class="sidebar-link">查询数据</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/pages/f7214a/#测试验证" class="sidebar-link">测试验证</a></li><li class="sidebar-sub-header level2"><a href="/pages/f7214a/#本章小结" class="sidebar-link">本章小结</a></li></ul></li><li><a href="/pages/67fc7d/" class="sidebar-link">网关注册中心库表结构设计</a></li><li><a href="/pages/2f51f8/" class="sidebar-link">网关注册算力节点领域服务实现</a></li><li><a href="/pages/f89110/" class="sidebar-link">网关注册服务接口领域服务实现</a></li><li><a href="/pages/97f176/" class="sidebar-link">服务发现组件搭建和注册网关连接</a></li><li><a href="/pages/851b37/" class="sidebar-link">网关映射聚合信息查询实现</a></li><li><a href="/pages/46b1c6/" class="sidebar-link">服务配置拉取和组件使用验证</a></li><li><a href="/pages/5d5836/" class="sidebar-link">网络通信配置提取</a></li><li><a href="/pages/bdae4e/" class="sidebar-link">核心通信组件管理和处理服务映射</a></li><li><a href="/pages/c2f223/" class="sidebar-link">容器关闭监听和异常管理</a></li><li><a href="/pages/81289e/" class="sidebar-link">网关引擎打包镜像部署</a></li><li><a href="/pages/3750a4/" class="sidebar-link">服务注册组件搭建采集接口信息</a></li><li><a href="/pages/46c35f/" class="sidebar-link">应用服务接口注册到注册中心</a></li><li><a href="/pages/bb3695/" class="sidebar-link">订阅服务注册消息驱动网关映射</a></li><li><a href="/pages/2d7dcf/" class="sidebar-link">网关运营管理后台框架搭建</a></li><li><a href="/pages/6936ee/" class="sidebar-link">前后端分离应用的跨域接口调用</a></li><li><a href="/pages/13559a/" class="sidebar-link">网关Nginx负载模型配置</a></li><li><a href="/pages/918d1a/" class="sidebar-link">动态刷新网关Nginx负载均衡配置</a></li><li><a href="/pages/dea686/" class="sidebar-link">实现网关算力节点动态负载功能</a></li><li><a href="/pages/1bdcba/" class="sidebar-link">网关组件工程模块合并</a></li><li><a href="/pages/d9cb43/" class="sidebar-link">功能完善(算力关联、接口上报、调用反馈)</a></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/note/Gateway/#《API网关设计与实现》" data-v-06225672>《API网关设计与实现》</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2023-06-19</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->网关注册中心服务初始创建<!----></h1>  <div class="theme-vdoing-content content__default"><h2 id="学习方法"><a href="#学习方法" class="header-anchor">#</a> <strong>学习方法</strong></h2> <p>需求开发时，不能只专注于写代码，还要时不时抬头检查。类似于刨地时，不能跑得太远，否则回头发现已经偏离了原本的方向。</p> <p>所以在开发一组接口之前，先自我验证一下，再交给前端使用。不要等到最后才发现前端说接口定义与你所写的不一致。</p> <h2 id="流程梳理"><a href="#流程梳理" class="header-anchor">#</a> <strong>流程梳理</strong></h2> <p>当我们实现第1部分1到12篇文章后，其实已经开发出了一个出具模型的核心通信组件。那么现在能想象出我们要怎么使用这个组件吗，接下来要完成什么，才能让串联起整个结构呢？这个就是本章要思考和架构设计的内容。—— 抬头看看</p> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/image-20230620140409057.png" alt="image-20230620140409057"></p> <ul><li><p>如图所示，<code>api-gateway-core</code> 是最核心的通信层。那么它还需要把注册的网关接口在通信核心服务中启动起来。那么怎么启动呢？</p></li> <li><p>这个启动过程首先来自于 api-gateway-sdk 向 api-gateway-center 推送注册接口，之后在通过网关引擎 api-gateway-engin 拉取接口并在本地服务完成注册。</p></li> <li><p>最后再调用到网关接口时，则是通过 api-gateway-core 调用到对应的 RPC 应用中。</p></li> <li><p>那么 api-gateway-sdk 并不是主要工程，没有它是可以通过 api-gateway-admin 配置。所以 在整个流程中 api-gateway-center、api-gateway-core 是两个核心工程，能更好的串联流程。</p></li></ul> <h2 id="注册中心"><a href="#注册中心" class="header-anchor">#</a> <strong>注册中心</strong></h2> <p>注册中心主要提供RPC接口的注册和接口的拉取使用。对于一些负载的控制也会在后续陆续完善。</p> <p>本章节我们先来初始化这样一个工程，这个工程采用简单的<code>DDD</code>工程模型结构开发，对外提供<code>HTTP</code> 接口。之所以提供 <code>HTTP</code>接口是因为可以引入更少的组件，也能满足需求。当然你也可以使用 MQ、Socket、ZK 等方式进行处理。</p> <h3 id="工程结构"><a href="#工程结构" class="header-anchor">#</a> <strong>工程结构</strong></h3> <p><img src="https://cdn.statically.io/gh/lixuanfengs/blog-images/master/cactus-blogs/image-20230620155054533.png" alt="image-20230620155054533"></p> <ul><li>源码：------</li> <li>资料：------</li></ul> <h3 id="初始功能"><a href="#初始功能" class="header-anchor">#</a> <strong>初始功能</strong></h3> <p>本章主要是搭建一个初始简单结构的 DDD 工程，并建一张简单的 API 映射数据库表，通过工程可以查询到表信息。</p> <h4 id="数据库表"><a href="#数据库表" class="header-anchor">#</a> <strong>数据库表</strong></h4> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> <span class="token identifier"><span class="token punctuation">`</span>http_statement<span class="token punctuation">`</span></span> <span class="token punctuation">(</span>
