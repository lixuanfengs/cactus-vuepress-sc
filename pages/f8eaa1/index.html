!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading open"><span>分布式事务</span> <span class="arrow down"></span></p> <ul class="sidebar-links sidebar-group-items"><li><a href="/pages/c701fe/" class="sidebar-link">分布式架构事务挑战🧡</a></li><li><a href="/pages/020840/" class="sidebar-link">分布式事务解决方案🥑</a></li><li><a href="/pages/f8eaa1/" aria-current="page" class="active sidebar-link">基于消息中间件RocketMQ方案（一）🥒</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level2"><a href="/pages/f8eaa1/#rocketmq简介" class="sidebar-link">RocketMQ简介</a></li><li class="sidebar-sub-header level2"><a href="/pages/f8eaa1/#rocketmq安装" class="sidebar-link">RocketMQ安装</a></li><li class="sidebar-sub-header level2"><a href="/pages/f8eaa1/#项目准备" class="sidebar-link">项目准备</a></li></ul></li><li><a href="/pages/a7a1b7/" class="sidebar-link">4 基于消息中间件RocketMQ方案（二）🍌</a></li><li><a href="/pages/8c9029/" class="sidebar-link">基于TX-LCN方案🌍</a></li><li><a href="/pages/330793/" class="sidebar-link">基于阿里Seata方案🌱</a></li></ul></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/note/SpringCloud-febs/#《SpringCloud微服务权限系统搭建》笔记" data-v-06225672>《SpringCloud微服务权限系统搭建》笔记</a></li><li data-v-06225672><a href="/note/SpringCloud-febs/#分布式事务" data-v-06225672>分布式事务</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://github.com/lixuanfengs" target="_blank" title="作者" class="beLink" data-v-06225672>cactusli</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2022-05-10</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->基于消息中间件RocketMQ方案（一）🥒<!----></h1>  <div class="theme-vdoing-content content__default"><h2 id="rocketmq简介"><a href="#rocketmq简介" class="header-anchor">#</a> RocketMQ简介</h2> <p>目前流行的消息中间件如RabbitMQ、Kafka、RocketMQ等，只有RocketMQ支持事务消息。RocketMQ的事务消息模型借鉴了2PC模式，整个交互流程如下图所示：</p> <p><img src="https://s2.ax1x.com/2019/12/30/lMlhss.png" alt="662.png"></p> <p>图来自于http://rocketmq.apache.org/rocketmq/the-design-of-transactional-message。</p> <ol><li>事务发起方首先发送一条半消息到MQ；</li> <li>MQ通知事务发起方，表示成功收到了这条半消息；</li> <li>事务发起方执行本地事务；</li> <li>根据本地事务执行结果向MQ反馈结果是commit或者是rollback，如果消息是rollback，MQ将删除该半消息不进行下发，如果是commit消息，MQ将会把这个消息发送给consumer端。</li> <li>如果第4步没有成功反馈，MQ会发送状态回查确认；</li> <li>事务发起方检查本地事务状态；</li> <li>将第6步结果反馈给MQ。</li></ol> <h2 id="rocketmq安装"><a href="#rocketmq安装" class="header-anchor">#</a> RocketMQ安装</h2> <p>因为截至2019年12月30日，org.apache.rocketmq:rocketmq-spring-boot-starter依赖的最新版本为2.0.4，其内部的RocketMQ版本为4.5.2，所以我们也下载这个版本的RocketMQ。</p> <p><img src="https://s2.ax1x.com/2019/12/30/lMgfl4.png" alt="663.png"></p> <p>下载地址：http://rocketmq.apache.org/dowloading/releases/，下载4.5.2 release Binary版本：</p> <p><img src="https://s2.ax1x.com/2019/12/30/lMgImR.png" alt="664.png"></p> <p>下载后解压，然后配置Windows环境变量：</p> <p><img src="https://s2.ax1x.com/2019/12/30/lM2KA0.png" alt="665.png"></p> <p>修改RocketMQ bin文件夹下的runbroker.cmd文件，修改内容如下图所示:</p> <p><img src="https://s2.ax1x.com/2019/12/30/lM2ovQ.png" alt="666.png"></p> <p>然后在bin目录下执行CMD命令：</p> <p>1.执行<code>start mqnamesrv.cmd</code>，启动NAMESERVER，页面弹出如下内容时，表示启动成功：</p> <p><img src="https://s2.ax1x.com/2019/12/30/lMRTJK.png" alt="667.png"></p> <p>2.执行<code>start mqbroker.cmd -n 127.0.0.1:9876 autoCreateTopicEnable=true</code>，启动BROKER：</p> <p><img src="https://s2.ax1x.com/2019/12/30/lMWNY6.png" alt="668.png"></p> <p>其中9876为RocketMQ默认端口号。这样RocketMQ就启动好了，Linux/Unix环境操作可以参考：http://rocketmq.apache.org/docs/quick-start/。</p> <h2 id="项目准备"><a href="#项目准备" class="header-anchor">#</a> 项目准备</h2> <p>项目的话我们接着使用8.7节的源码，不过需要适当的修改。</p> <p>使用IDEA导入8.7节的源码。因为我们在8.6节引入了Skywalking微服务追踪功能，所以之前引入的Zipkin、Sleuth和RabbitMQ依赖就可以去掉了（个人觉得Skywalking比Zipkin强大）。删除febs-server pom下面这几个依赖：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>&lt;dependency&gt;
    &lt;groupId&gt;org.springframework.cloud&lt;/groupId&gt;
    &lt;artifactId&gt;spring-cloud-starter-sleuth&lt;/artifactId&gt;
&lt;/dependency&gt;
&lt;dependency&gt;
    &lt;groupId&gt;org.springframework.cloud&lt;/groupId&gt;
    &lt;artifactId&gt;spring-cloud-starter-zipkin&lt;/artifactId&gt;
&lt;/dependency&gt;
&lt;dependency&gt;
    &lt;groupId&gt;org.springframework.amqp&lt;/groupId&gt;
    &lt;artifactId&gt;spring-rabbit&lt;/artifactId&gt;
&lt;/dependency&gt;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>因为我们删除了Zipkin、Sleuth和RabbitMQ依赖，所以我们需要修改Nacos中febs-server-system.yaml和febs-server-test.yaml的配置文件内容，将下面这段删除掉：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>spring:
  zipkin:
    sender:
      type: rabbit
  sleuth:
    sampler:
      probability: 1
  rabbitmq:
    host: ${rabbitmq.url}
    port: 5672
    username: febs
    password: 123456
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>此外，因为后续需要在febs-server-test下操作数据库，所以<strong>去掉</strong>febs-server-test.yaml中排除数据库自动装配的配置：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,com.baomidou.dynamic.datasource.spring.boot.autoconfigure.DynamicDataSourceAutoConfiguration
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>并添加数据源配置：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>spring:
  datasource:
    dynamic:
      p6spy: true
      hikari:
        connection-timeout: 30000
        max-lifetime: 1800000
        max-pool-size: 15
        min-idle: 5
        connection-test-query: select 1
        pool-name: FebsHikariCP
      primary: base
      datasource:
        base:
          username: root
          password: 123456
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${mysql.url}:3306/febs_cloud_base?useUnicode=true&amp;characterEncoding=UTF-8&amp;useJDBCCompliantTimezoneShift=true&amp;useLegacyDatetimeCode=false&amp;serverTimezone=GMT%2b8
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br></div></div><p>添加MyBatis Plus配置：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>mybatis-plus:
  type-aliases-package: cc.mrbird.febs.common.entity.system
  mapper-locations: classpath:mapper/*/*.xml
  configuration:
    jdbc-type-for-null: null
  global-config:
    banner: false
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>在febs-server-test的启动类中添加Mapper扫描注解<code>@MapperScan(&quot;cc.mrbird.febs.server.test.mapper&quot;)</code>和事务控制注解<code>@EnableTransactionManagement</code>。</p> <p>至此，Nacos中完整的febs-server-test.yaml内容如下所示：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>server:
  port: 8202

spring:
  boot:
    admin:
      client:
        url: http://${febs-monitor-admin}:8401
        username: febs
        password: 123456
  datasource:
    dynamic:
      p6spy: true
      hikari:
        connection-timeout: 30000
        max-lifetime: 1800000
        max-pool-size: 15
        min-idle: 5
        connection-test-query: select 1
        pool-name: FebsHikariCP
      primary: base
      datasource:
        base:
          username: root
          password: 123456
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${mysql.url}:3306/febs_cloud_base?useUnicode=true&amp;characterEncoding=UTF-8&amp;useJDBCCompliantTimezoneShift=true&amp;useLegacyDatetimeCode=false&amp;serverTimezone=GMT%2b8
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

security:
  oauth2:
    resource:
      id: ${spring.application.name}
      user-info-uri: http://${febs-gateway}:8301/auth/user

feign:
  hystrix:
    enabled: true

hystrix:
  shareSecurityContext: true

info:
  app:
    name: ${spring.application.name}
    description: &quot;@project.description@&quot;
    version: &quot;@project.version@&quot;

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS

mybatis-plus:
  type-aliases-package: cc.mrbird.febs.common.entity.system
  mapper-locations: classpath:mapper/*/*.xml
  configuration:
    jdbc-type-for-null: null
  global-config:
    banner: false
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br><span class="line-number">47</span><br><span class="line-number">48</span><br><span class="line-number">49</span><br><span class="line-number">50</span><br><span class="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br><span class="line-number">62</span><br><span class="line-number">63</span><br><span class="line-number">64</span><br><span class="line-number">65</span><br></div></div><p>复制</p> <p>这节就先到这里了，下节开始使用RocketMQ事务消息解决分布式事务问题。</p></div></div>  <div class="page-edit"><div class="edit-link"><a href="https://github.com/lixuanfengs/cactus-vuepress-sc/edit/master/docs/《SpringCloud微服务权限系统搭建》笔记/10.分布式事务/03.基于消息中间件RocketMQ方案（一）.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2022/05/13, 15:20:04</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/020840/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">分布式事务解决方案🥑</div></a> <a href="/pages/a7a1b7/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">4 基于消息中间件RocketMQ方案（二）🍌</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
